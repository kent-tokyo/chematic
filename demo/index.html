<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chematic — Interactive Demo</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #0f1117;
  --surface:   #1a1d27;
  --border:    #2e3246;
  --accent:    #4f8ef7;
  --pass:      #34d399;
  --fail:      #f87171;
  --warn:      #fbbf24;
  --text:      #e2e8f0;
  --muted:     #8b92a9;
  --font-ui:   'Segoe UI', 'SF Pro Display', 'Helvetica Neue', sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
  --radius:    10px;
  --shadow:    0 4px 24px rgba(0,0,0,.35);
}

html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.6;
  min-height: 100vh;
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ── Loading overlay ─────────────────────────────────────────────────── */
#loading-overlay {
  position: fixed; inset: 0; z-index: 999;
  background: var(--bg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 1rem;
  font-size: 1.1rem; color: var(--muted);
  transition: opacity .4s;
}
#loading-overlay.hidden { opacity: 0; pointer-events: none; }
.spinner {
  width: 44px; height: 44px;
  border: 4px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Header ──────────────────────────────────────────────────────────── */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 1rem 1.5rem;
  position: sticky; top: 0; z-index: 100;
}
.header-inner {
  max-width: 1100px; margin: 0 auto;
  display: flex; align-items: center; gap: 1rem;
  flex-wrap: wrap;
}
.logo {
  font-size: 1.4rem; font-weight: 700;
  color: var(--accent); letter-spacing: -.5px;
}
.version {
  background: color-mix(in srgb, var(--accent) 18%, transparent);
  color: var(--accent);
  border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
  border-radius: 999px;
  padding: 1px 10px;
  font-size: .75rem; font-family: var(--font-mono);
}
.tagline { color: var(--muted); font-size: .9rem; flex: 1; min-width: 180px; }
.lang-switcher {
  display: flex; gap: .4rem; margin-left: auto;
}
.lang-btn {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--muted);
  cursor: pointer;
  font-size: .8rem; font-weight: 600;
  padding: 3px 10px;
  transition: border-color .15s, color .15s, background .15s;
}
.lang-btn:hover { border-color: var(--accent); color: var(--accent); }
.lang-btn.active {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 15%, transparent);
  color: var(--accent);
}

/* ── Main layout ─────────────────────────────────────────────────────── */
main {
  max-width: 1100px; margin: 0 auto;
  padding: 2rem 1.5rem 4rem;
  display: flex; flex-direction: column; gap: 2.5rem;
}

section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.5rem;
  box-shadow: var(--shadow);
}
section h2 {
  font-size: 1.1rem; font-weight: 700;
  margin-bottom: 1.25rem;
  color: var(--text);
  display: flex; align-items: center; gap: .5rem;
}
section h2::before {
  content: '';
  display: inline-block;
  width: 3px; height: 1.1em;
  border-radius: 2px;
  background: var(--accent);
}

/* ── Input row ───────────────────────────────────────────────────────── */
.input-row {
  display: flex; gap: .5rem; margin-bottom: .75rem;
  flex-wrap: wrap;
}
.smiles-input {
  flex: 1; min-width: 180px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: var(--font-mono);
  font-size: .9rem;
  padding: .55rem 1rem;
  transition: border-color .15s, box-shadow .15s;
  outline: none;
}
.smiles-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
}
.btn {
  background: var(--accent);
  border: none;
  border-radius: 8px;
  color: #fff;
  cursor: pointer;
  font-size: .9rem; font-weight: 600;
  padding: .55rem 1.2rem;
  transition: filter .15s;
  white-space: nowrap;
}
.btn:hover { filter: brightness(1.12); }
.btn:active { filter: brightness(.92); }
.btn-outline {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--muted);
  cursor: pointer;
  font-size: .78rem; font-weight: 500;
  padding: .3rem .75rem;
  transition: border-color .15s, color .15s;
}
.btn-outline:hover { border-color: var(--accent); color: var(--accent); }

.preset-row {
  display: flex; gap: .4rem; flex-wrap: wrap;
  margin-bottom: 1rem;
}
.preset-label { color: var(--muted); font-size: .82rem; align-self: center; }

/* ── Error banner ────────────────────────────────────────────────────── */
.error-banner {
  background: color-mix(in srgb, var(--fail) 15%, transparent);
  border: 1px solid color-mix(in srgb, var(--fail) 40%, transparent);
  border-radius: 8px;
  color: var(--fail);
  font-size: .88rem;
  margin-bottom: 1rem;
  padding: .6rem 1rem;
}
.error-banner.hidden { display: none; }

/* ── SVG depiction ───────────────────────────────────────────────────── */
.svg-area {
  background: #fff;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 1.25rem;
  min-height: 200px;
  overflow: hidden;
}
.svg-area svg {
  max-width: 100%;
  height: auto;
  display: block;
}
.svg-placeholder {
  color: #aaa;
  font-size: .9rem;
  text-align: center;
  padding: 2rem;
}

/* ── Descriptor table ────────────────────────────────────────────────── */
.table-wrap { overflow-x: auto; }
table {
  width: 100%; border-collapse: collapse;
  font-size: .88rem;
}
thead th {
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  color: var(--muted);
  font-size: .78rem; font-weight: 600;
  letter-spacing: .04em;
  padding: .55rem 1rem;
  text-align: left;
  text-transform: uppercase;
  white-space: nowrap;
}
tbody tr:nth-child(odd) { background: color-mix(in srgb, var(--bg) 50%, transparent); }
tbody tr:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
tbody td {
  border-bottom: 1px solid var(--border);
  padding: .45rem 1rem;
  vertical-align: middle;
}
.td-name { color: var(--muted); font-size: .83rem; }
.td-value {
  font-family: var(--font-mono);
  font-size: .88rem;
  font-weight: 500;
}
.td-smiles {
  max-width: 260px; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap;
  font-family: var(--font-mono);
  font-size: .88rem;
  font-weight: 500;
}

/* ── Drug-likeness rules ─────────────────────────────────────────────── */
.rules-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1rem;
}
.rule-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1rem 1.25rem;
}
.rule-header {
  display: flex; align-items: center;
  justify-content: space-between;
  margin-bottom: .4rem;
}
.rule-name { font-weight: 700; font-size: .95rem; }
.badge {
  border-radius: 999px;
  font-size: .72rem; font-weight: 700;
  letter-spacing: .05em;
  padding: 2px 10px;
  text-transform: uppercase;
}
.badge-pass {
  background: color-mix(in srgb, var(--pass) 15%, transparent);
  border: 1px solid color-mix(in srgb, var(--pass) 35%, transparent);
  color: var(--pass);
}
.badge-fail {
  background: color-mix(in srgb, var(--fail) 15%, transparent);
  border: 1px solid color-mix(in srgb, var(--fail) 35%, transparent);
  color: var(--fail);
}
.badge-pending {
  background: color-mix(in srgb, var(--border) 40%, transparent);
  border: 1px solid var(--border);
  color: var(--muted);
}
.rule-criteria { color: var(--muted); font-size: .8rem; }

/* ── Similarity ──────────────────────────────────────────────────────── */
.sim-inputs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.25rem;
  margin-bottom: 1rem;
  align-items: start;
}
.sim-label {
  font-size: .82rem; font-weight: 600;
  color: var(--muted);
  margin-bottom: .35rem;
}
.sim-bar-wrap {
  background: var(--border);
  border-radius: 999px;
  height: 6px;
  overflow: hidden;
}
.sim-bar {
  height: 100%;
  border-radius: 999px;
  transition: width .35s ease;
}
.sim-val { font-family: var(--font-mono); font-weight: 600; font-size: .9rem; }

/* ── Footer ──────────────────────────────────────────────────────────── */
footer {
  text-align: center;
  padding: 2rem 1.5rem;
  color: var(--muted);
  font-size: .82rem;
  border-top: 1px solid var(--border);
}

/* ── Responsive ──────────────────────────────────────────────────────── */
@media (max-width: 640px) {
  main { padding: 1rem .75rem 3rem; gap: 1.5rem; }
  header { padding: .75rem 1rem; }
  .header-inner { gap: .5rem; }
  .tagline { display: none; }
  section { padding: 1rem; }
  .sim-inputs { grid-template-columns: 1fr; }
  .rules-grid { grid-template-columns: 1fr 1fr; }
  tbody td { padding: .4rem .6rem; }
}
@media (max-width: 380px) {
  .rules-grid { grid-template-columns: 1fr; }
}

<main>

    </div>
    <div class="table-wrap">
      <table id="desc-table">
        <thead>
          <tr>
            <th id="th-prop"></th>
            <th id="th-val"></th>
          </tr>
        </thead>
        <tbody id="desc-tbody"></tbody>
      </table>
    </div>
  </section>

  <!-- Section 2: Drug-likeness Rules -->
  <section id="section-rules">
    <h2 id="h-rules-title"></h2>
    <div class="rules-grid" id="rules-grid"></div>
  </section>

  <!-- Section 3: Similarity Comparison -->
  <section id="section-similarity">
    <h2 id="h-sim-title"></h2>
    <div class="sim-inputs">
      <div>
        <div class="sim-label" id="sim-label-a"></div>
        <div class="input-row" style="margin-bottom:.5rem">
          <input id="sim-a" class="smiles-input" type="text"
                 spellcheck="false" autocomplete="off">
        </div>
        <div class="preset-row">
          <button class="btn-outline preset-sim" data-target="a" data-smiles="CC(=O)Oc1ccccc1C(=O)O"      id="sa-aspirin"></button>
          <button class="btn-outline preset-sim" data-target="a" data-smiles="Cn1cnc2c1c(=O)n(c(=O)n2C)C" id="sa-caffeine"></button>
          <button class="btn-outline preset-sim" data-target="a" data-smiles="CC(C)Cc1ccc(cc1)C(C)C(=O)O" id="sa-ibuprofen"></button>
        </div>
      </div>
      <div>
        <div class="sim-label" id="sim-label-b"></div>
        <div class="input-row" style="margin-bottom:.5rem">
          <input id="sim-b" class="smiles-input" type="text"
                 spellcheck="false" autocomplete="off">
        </div>
        <div class="preset-row">
          <button class="btn-outline preset-sim" data-target="b" data-smiles="Cn1cnc2c1c(=O)n(c(=O)n2C)C"              id="sb-caffeine"></button>
          <button class="btn-outline preset-sim" data-target="b" data-smiles="OC[C@H]1OC(O)[C@H](O)[C@@H](O)[C@@H]1O" id="sb-glucose"></button>
          <button class="btn-outline preset-sim" data-target="b" data-smiles="CC(C)Cc1ccc(cc1)C(C)C(=O)O"              id="sb-ibuprofen"></button>
        </div>
      </div>
    </div>
    <div style="margin-bottom:1rem">
      <button id="btn-sim" class="btn"></button>
    </div>
    <div id="error-sim" class="error-banner hidden"></div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th id="th-sim-method"></th>
            <th id="th-sim-desc"></th>
            <th id="th-sim-tanimoto"></th>
            <th></th>
          </tr>
        </thead>
        <tbody id="sim-tbody"></tbody>
      </table>
    </div>
  </section>

</main>

let lang = 'en';
function t(key) { return (T[lang] && T[lang][key]) || T.en[key] || key; }

// Map of element id → i18n key for static text nodes
const STATIC_IDS = {
  'tagline':         'app.tagline',
  'h-desc-title':    'desc.title',
  'btn-calc':        'desc.calculate',
  'presets-label':   'desc.presets',
  'svg-placeholder': 'desc.svg_ph',
  'th-prop':         'desc.th_prop',
  'th-val':          'desc.th_val',
  'h-rules-title':   'rules.title',
  'h-sim-title':     'sim.title',
  'sim-label-a':     'sim.mol_a',
  'sim-label-b':     'sim.mol_b',
  'btn-sim':         'sim.compare',
  'th-sim-method':   'sim.th_method',
  'th-sim-desc':     'sim.th_desc',
  'th-sim-tanimoto': 'sim.th_tanimoto',
  'p-aspirin':       'preset.aspirin',
  'p-caffeine':      'preset.caffeine',
  'p-ibuprofen':     'preset.ibuprofen',
  'p-taxol':         'preset.taxol',
  'p-glucose':       'preset.glucose',
  'sa-aspirin':      'preset.aspirin',
  'sa-caffeine':     'preset.caffeine',
  'sa-ibuprofen':    'preset.ibuprofen',
  'sb-caffeine':     'preset.caffeine',
  'sb-glucose':      'preset.glucose',
  'sb-ibuprofen':    'preset.ibuprofen',
};

function applyLang(newLang) {
  lang = newLang;
  document.documentElement.lang = lang === 'ja' ? 'ja' : lang === 'zh' ? 'zh-Hans' : 'en';
  localStorage.setItem('chematic-lang', lang);

  document.querySelectorAll('[data-lang]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });

  for (const [id, key] of Object.entries(STATIC_IDS)) {
    const el = document.getElementById(id);
    if (el) el.textContent = t(key);
  }
  document.getElementById('loading-text').textContent = t('app.loading');
  document.getElementById('smiles-input').placeholder = t('desc.placeholder');
  document.getElementById('sim-a').placeholder = t('desc.placeholder');
  document.getElementById('sim-b').placeholder = t('desc.placeholder');

  renderRuleCards(lastMol);
  renderSimTable(lastSimResults);
}

// ============================================================
// State
// ============================================================
let wasmReady = false;
let parseSmilesWasm, tanimotoEcfp4, tanimotoFcfp4, tanimotoAtomPair, tanimotoTorsion, bricsFrag;
let lastMol = null;
let lastSimResults = null;

// ============================================================
// WASM init
// ============================================================
async function initWasm() {
  try {
    const mod = await import('./pkg/chematic_wasm.js');
    await mod.default('./pkg/chematic_wasm_bg.wasm');
    parseSmilesWasm  = mod.parse_smiles;
    tanimotoEcfp4    = mod.tanimoto_ecfp4;
    tanimotoFcfp4    = mod.tanimoto_fcfp4;
    tanimotoAtomPair = mod.tanimoto_atom_pair;
    tanimotoTorsion  = mod.tanimoto_torsion;
    bricsFrag        = mod.brics_fragment_count;
    wasmReady = true;
  } catch (e) {
    document.getElementById('loading-text').textContent = 'WASM load failed: ' + String(e);
    throw e;
  }
}

// ============================================================
// Descriptor definitions
// ============================================================
const DESC_DEFS = [
  { key: 'desc.formula',     fn: m => m.formula(),                    isSmiles: false },
  { key: 'desc.mw',          fn: m => m.molecular_weight().toFixed(2)              },
  { key: 'desc.exact_mass',  fn: m => m.exact_mass().toFixed(4)                    },
  { key: 'desc.tpsa',        fn: m => m.tpsa().toFixed(2)                          },
  { key: 'desc.logp',        fn: m => m.logp_crippen().toFixed(3)                  },
  { key: 'desc.fsp3',        fn: m => m.fsp3().toFixed(3)                          },
  { key: 'desc.qed',         fn: m => m.qed().toFixed(3)                           },
  { key: 'desc.mr',          fn: m => m.molar_refractivity().toFixed(2)            },
  { key: 'desc.heavy_atoms', fn: m => String(m.heavy_atom_count())                 },
  { key: 'desc.atoms',       fn: m => String(m.atom_count())                       },
  { key: 'desc.bonds',       fn: m => String(m.bond_count())                       },
  { key: 'desc.hbd',         fn: m => String(m.hbd_count())                        },
  { key: 'desc.hba',         fn: m => String(m.hba_count())                        },
  { key: 'desc.rotbonds',    fn: m => String(m.rotatable_bond_count())             },
  { key: 'desc.rings',       fn: m => String(m.ring_count())                       },
  { key: 'desc.arom_rings',  fn: m => String(m.aromatic_ring_count())              },
  { key: 'desc.heteroatoms', fn: m => String(m.num_heteroatoms())                  },
  { key: 'desc.stereo',      fn: m => String(m.num_stereocenters())                },
  { key: 'desc.charge',      fn: m => String(m.formal_charge_sum())                },
  { key: 'desc.brics',       fn: m => String(bricsFrag(m))                         },
  { key: 'desc.canonical',   fn: m => m.canonical_smiles(), isSmiles: true         },
  { key: 'desc.arom_het',    fn: m => String(m.num_aromatic_heterocycles())        },
  { key: 'desc.aliph_het',   fn: m => String(m.num_aliphatic_heterocycles())       },
  { key: 'desc.spiro',       fn: m => String(m.num_spiro_atoms())                  },
  { key: 'desc.bridge',      fn: m => String(m.num_bridgehead_atoms())             },
];

// ============================================================
// Rule definitions
// ============================================================
const RULE_DEFS = [
  { nameKey: 'rules.lipinski', criteriaKey: 'rules.lipinski_c', fn: m => m.lipinski_passes() },
  { nameKey: 'rules.veber',    criteriaKey: 'rules.veber_c',    fn: m => m.veber_passes()    },
  { nameKey: 'rules.egan',     criteriaKey: 'rules.egan_c',     fn: m => m.egan_passes()     },
  { nameKey: 'rules.ghose',    criteriaKey: 'rules.ghose_c',    fn: m => m.ghose_passes()    },
  { nameKey: 'rules.reos',     criteriaKey: 'rules.reos_c',     fn: m => m.reos_passes()     },
  { nameKey: 'rules.pains',    criteriaKey: 'rules.pains_c',    fn: m => m.pains_passes()    },
];

// ============================================================
// Similarity definitions
// ============================================================
const SIM_DEFS = [
  { nameKey: 'sim.ecfp4',    descKey: 'sim.ecfp4_d',    fn: (a,b) => tanimotoEcfp4(a,b)    },
  { nameKey: 'sim.fcfp4',    descKey: 'sim.fcfp4_d',    fn: (a,b) => tanimotoFcfp4(a,b)    },
  { nameKey: 'sim.atompair', descKey: 'sim.atompair_d', fn: (a,b) => tanimotoAtomPair(a,b) },
  { nameKey: 'sim.torsion',  descKey: 'sim.torsion_d',  fn: (a,b) => tanimotoTorsion(a,b)  },
];

// ============================================================
// Render: descriptors (all text via textContent — no XSS risk)
// ============================================================
function renderDescriptors(mol) {
  const tbody = document.getElementById('desc-tbody');
  tbody.textContent = '';
  for (const d of DESC_DEFS) {
    const val = d.fn(mol);
    const tr = document.createElement('tr');
    const tdName = document.createElement('td');
    tdName.className = 'td-name';
    tdName.textContent = t(d.key);
    const tdVal = document.createElement('td');
    tdVal.className = d.isSmiles ? 'td-smiles' : 'td-value';
    tdVal.textContent = val;
    tr.appendChild(tdName);
    tr.appendChild(tdVal);
    tbody.appendChild(tr);
  }
}

// ============================================================
// Render: rule cards (all text via textContent)
// ============================================================
function renderRuleCards(mol) {
  const grid = document.getElementById('rules-grid');
  grid.textContent = '';
  for (const r of RULE_DEFS) {
    const passes = mol ? r.fn(mol) : null;

    const card = document.createElement('div');
    card.className = 'rule-card';

    const header = document.createElement('div');
    header.className = 'rule-header';

    const name = document.createElement('span');
    name.className = 'rule-name';
    name.textContent = t(r.nameKey);

    const badge = document.createElement('span');
    if (mol === null) {
      badge.className = 'badge badge-pending';
      badge.textContent = '—';
    } else {
      badge.className = 'badge ' + (passes ? 'badge-pass' : 'badge-fail');
      badge.textContent = passes ? t('rules.pass') : t('rules.fail');
    }

    header.appendChild(name);
    header.appendChild(badge);

    const criteria = document.createElement('div');
    criteria.className = 'rule-criteria';
    criteria.textContent = t(r.criteriaKey);

    card.appendChild(header);
    card.appendChild(criteria);
    grid.appendChild(card);
  }
}

// ============================================================
// Render: similarity table (textContent for all text)
// ============================================================
function simColor(v) {
  if (v >= 0.7) return 'var(--pass)';
  if (v >= 0.3) return 'var(--warn)';
  return 'var(--fail)';
}

function renderSimTable(results) {
  lastSimResults = results;
  const tbody = document.getElementById('sim-tbody');
  tbody.textContent = '';
  for (let i = 0; i < SIM_DEFS.length; i++) {
    const d = SIM_DEFS[i];
    const v = results ? results[i] : null;

    const tr = document.createElement('tr');

    const tdMethod = document.createElement('td');
    tdMethod.className = 'td-name';
    tdMethod.style.fontWeight = '600';
    tdMethod.textContent = t(d.nameKey);

    const tdDesc = document.createElement('td');
    tdDesc.className = 'td-name';
    tdDesc.textContent = t(d.descKey);

    const tdVal = document.createElement('td');
    tdVal.className = 'sim-val';
    tdVal.style.color = v !== null ? simColor(v) : 'var(--muted)';
    tdVal.textContent = v !== null ? v.toFixed(3) : '—';

    const tdBar = document.createElement('td');
    tdBar.style.cssText = 'width:140px;vertical-align:middle;padding-right:1rem';
    const wrap = document.createElement('div');
    wrap.className = 'sim-bar-wrap';
    const bar = document.createElement('div');
    bar.className = 'sim-bar';
    bar.style.width = v !== null ? (v * 100).toFixed(1) + '%' : '0%';
    bar.style.background = v !== null ? simColor(v) : 'transparent';
    wrap.appendChild(bar);
    tdBar.appendChild(wrap);

    tr.appendChild(tdMethod);
    tr.appendChild(tdDesc);
    tr.appendChild(tdVal);
    tr.appendChild(tdBar);
    tbody.appendChild(tr);
  }
}

// ============================================================
// SVG depiction (output from our own WASM library — trusted source)
// ============================================================
function renderSvg(mol) {
  const area = document.getElementById('svg-area');
  try {
    const svgStr = mol.depict_svg();
    // svgStr is generated by our Rust SVG renderer, not user input.
    // We use DOMParser to validate it as XML before inserting.
    const parser = new DOMParser();
    const doc = parser.parseFromString(svgStr, 'image/svg+xml');
    const err = doc.querySelector('parsererror');
    if (err) throw new Error('invalid SVG');
    area.textContent = '';
    area.appendChild(doc.documentElement);
  } catch (_) {
    area.textContent = '';
    const ph = document.createElement('span');
    ph.className = 'svg-placeholder';
    ph.style.color = 'var(--muted)';
    ph.textContent = t('desc.svg_ph');
    area.appendChild(ph);
  }
}

// ============================================================
// Error helpers
// ============================================================
function showError(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.classList.remove('hidden');
}
function clearError(id) {
  document.getElementById(id).classList.add('hidden');
}

// ============================================================
// Calculate descriptors
// ============================================================
function calculate() {
  clearError('error-desc');
  const smiles = document.getElementById('smiles-input').value.trim();
  if (!smiles) { showError('error-desc', t('error.empty')); return; }
  if (!wasmReady) { showError('error-desc', t('error.wasm')); return; }

  let mol;
  try { mol = parseSmilesWasm(smiles); }
  catch (e) { showError('error-desc', t('error.parse') + String(e)); return; }

  if (lastMol) { try { lastMol.free(); } catch (_) {} }
  lastMol = mol;

  renderSvg(mol);
  renderDescriptors(mol);
  renderRuleCards(mol);
}

// ============================================================
// Compare similarity
// ============================================================
function compare() {
  clearError('error-sim');
  const sA = document.getElementById('sim-a').value.trim();
  const sB = document.getElementById('sim-b').value.trim();
  if (!sA || !sB) { showError('error-sim', t('error.empty')); return; }
  if (!wasmReady) { showError('error-sim', t('error.wasm')); return; }

  let mA, mB;
  try { mA = parseSmilesWasm(sA); } catch(e) { showError('error-sim', 'A: ' + t('error.parse') + String(e)); return; }
  try { mB = parseSmilesWasm(sB); } catch(e) { mA.free(); showError('error-sim', 'B: ' + t('error.parse') + String(e)); return; }

  const results = SIM_DEFS.map(d => d.fn(mA, mB));
  mA.free(); mB.free();
  renderSimTable(results);
}

// ============================================================
// Boot
// ============================================================
(async () => {
  // Language detection: localStorage > browser > 'en'
  const saved = localStorage.getItem('chematic-lang');
  const browser = navigator.language.toLowerCase();
  const detected = saved ?? (browser.startsWith('zh') ? 'zh' : browser.startsWith('ja') ? 'ja' : 'en');
  applyLang(detected);

  renderRuleCards(null);
  renderSimTable(null);

  await initWasm();
  document.getElementById('loading-overlay').classList.add('hidden');

  // Auto-load aspirin on startup
  document.getElementById('smiles-input').value = 'CC(=O)Oc1ccccc1C(=O)O';
  calculate();

  // Language switcher
  document.querySelectorAll('[data-lang]').forEach(btn => {
    btn.addEventListener('click', () => applyLang(btn.dataset.lang));
  });

  // Calculate
  document.getElementById('btn-calc').addEventListener('click', calculate);
  document.getElementById('smiles-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') calculate();
  });

  // Descriptor presets
  document.querySelectorAll('.preset-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.getElementById('smiles-input').value = btn.dataset.smiles;
      calculate();
    });
  });

  // Similarity presets
  document.querySelectorAll('.preset-sim').forEach(btn => {
    btn.addEventListener('click', () => {
      document.getElementById(btn.dataset.target === 'a' ? 'sim-a' : 'sim-b').value = btn.dataset.smiles;
    });
  });

  // Compare
  document.getElementById('btn-sim').addEventListener('click', compare);
  ['sim-a', 'sim-b'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') compare();
    });
  });
})();
</script>
