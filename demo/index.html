<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chematic — Interactive Demo</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #0f1117;
  --surface:   #1a1d27;
  --border:    #2e3246;
  --accent:    #4f8ef7;
  --pass:      #34d399;
  --fail:      #f87171;
  --warn:      #fbbf24;
  --text:      #e2e8f0;
  --muted:     #8b92a9;
  --font-ui:   'Segoe UI', 'SF Pro Display', 'Helvetica Neue', sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
  --radius:    10px;
  --shadow:    0 4px 24px rgba(0,0,0,.35);
}

html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.6;
  min-height: 100vh;
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ── Loading overlay ─────────────────────────────────────────────────── */
#loading-overlay {
  position: fixed; inset: 0; z-index: 999;
  background: var(--bg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 1rem;
  font-size: 1.1rem; color: var(--muted);
  transition: opacity .4s;
}
#loading-overlay.hidden { opacity: 0; pointer-events: none; }
.spinner {
  width: 44px; height: 44px;
  border: 4px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Header ──────────────────────────────────────────────────────────── */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 1rem 1.5rem;
  position: sticky; top: 0; z-index: 100;
}
.header-inner {
  max-width: 1100px; margin: 0 auto;
  display: flex; align-items: center; gap: 1rem;
  flex-wrap: wrap;
}
.logo {
  font-size: 1.4rem; font-weight: 700;
  color: var(--accent); letter-spacing: -.5px;
}
.version {
  background: color-mix(in srgb, var(--accent) 18%, transparent);
  color: var(--accent);
  border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
  border-radius: 999px;
  padding: 1px 10px;
  font-size: .75rem; font-family: var(--font-mono);
}
.tagline { color: var(--muted); font-size: .9rem; flex: 1; min-width: 180px; }
.lang-switcher {
  display: flex; gap: .4rem; margin-left: auto;
}
.lang-btn {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--muted);
  cursor: pointer;
  font-size: .8rem; font-weight: 600;
  padding: 3px 10px;
  transition: border-color .15s, color .15s, background .15s;
}
.lang-btn:hover { border-color: var(--accent); color: var(--accent); }
.lang-btn.active {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 15%, transparent);
  color: var(--accent);
}

/* ── Main layout ─────────────────────────────────────────────────────── */
main {
  max-width: 1100px; margin: 0 auto;
  padding: 2rem 1.5rem 4rem;
  display: flex; flex-direction: column; gap: 2.5rem;
}

section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.5rem;
  box-shadow: var(--shadow);
}
section h2 {
  font-size: 1.1rem; font-weight: 700;
  margin-bottom: 1.25rem;
  color: var(--text);
  display: flex; align-items: center; gap: .5rem;
}
section h2::before {
  content: '';
  display: inline-block;
  width: 3px; height: 1.1em;
  border-radius: 2px;
  background: var(--accent);
}

/* ── Input row ───────────────────────────────────────────────────────── */
.input-row {
  display: flex; gap: .5rem; margin-bottom: .75rem;
  flex-wrap: wrap;
}
.smiles-input {
  flex: 1; min-width: 180px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: var(--font-mono);
  font-size: .9rem;
  padding: .55rem 1rem;
  transition: border-color .15s, box-shadow .15s;
  outline: none;
}
.smiles-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
}
.btn {
  background: var(--accent);
  border: none;
  border-radius: 8px;
  color: #fff;
  cursor: pointer;
  font-size: .9rem; font-weight: 600;
  padding: .55rem 1.2rem;
  transition: filter .15s;
  white-space: nowrap;
}
.btn:hover { filter: brightness(1.12); }
.btn:active { filter: brightness(.92); }
.btn-outline {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--muted);
  cursor: pointer;
  font-size: .78rem; font-weight: 500;
  padding: .3rem .75rem;
  transition: border-color .15s, color .15s;
}
.btn-outline:hover { border-color: var(--accent); color: var(--accent); }

.preset-row {
  display: flex; gap: .4rem; flex-wrap: wrap;
  margin-bottom: 1rem;
}
.preset-label { color: var(--muted); font-size: .82rem; align-self: center; }

/* ── Error banner ────────────────────────────────────────────────────── */
.error-banner {
  background: color-mix(in srgb, var(--fail) 15%, transparent);
  border: 1px solid color-mix(in srgb, var(--fail) 40%, transparent);
  border-radius: 8px;
  color: var(--fail);
  font-size: .88rem;
  margin-bottom: 1rem;
  padding: .6rem 1rem;
}
.error-banner.hidden { display: none; }

/* ── SVG depiction ───────────────────────────────────────────────────── */
.svg-area {
  background: var(--surface);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 1rem;
  min-height: 200px;
  overflow: hidden;
  position: relative;
  user-select: none;
}
.svg-area svg {
  max-width: 100%;
  height: auto;
  display: block;
}
.svg-placeholder {
  color: #aaa;
  font-size: .9rem;
  text-align: center;
  padding: 2rem;
}
.svg-zoom-reset {
  position: absolute; top: .5rem; right: .5rem; z-index: 1;
  background: var(--border); border: none; border-radius: 6px;
  color: var(--muted); cursor: pointer;
  font-size: .72rem; font-weight: 600; line-height: 1; padding: .3rem .55rem;
  opacity: 0; transition: opacity .15s;
}
.svg-area:hover .svg-zoom-reset { opacity: 1; }
.svg-zoom-reset:hover { background: var(--accent); color: #fff; }

/* ── SVG left controls (atom index toggle) ───────────────────────────── */
.svg-controls-left {
  position: absolute; top: .5rem; left: .5rem; z-index: 1;
  display: flex; gap: .3rem;
  opacity: 0; transition: opacity .15s;
}
.svg-area:hover .svg-controls-left { opacity: 1; }
.btn-svg-ctrl {
  background: var(--border); border: none; border-radius: 6px;
  color: var(--muted); cursor: pointer;
  font-size: .72rem; font-weight: 600; padding: .3rem .55rem;
  transition: background .15s, color .15s;
}
.btn-svg-ctrl:hover { background: var(--accent); color: #fff; }
.btn-svg-ctrl.active {
  background: color-mix(in srgb, var(--accent) 60%, transparent);
  color: #fff;
}

/* ── SMARTS filter row ───────────────────────────────────────────────── */
.smarts-row {
  display: flex; gap: .5rem; margin-bottom: 1rem;
  flex-wrap: wrap; align-items: center;
}
.smarts-row-label { color: var(--muted); font-size: .82rem; white-space: nowrap; align-self: center; }
.smarts-badge {
  background: color-mix(in srgb, var(--pass) 15%, transparent);
  border: 1px solid color-mix(in srgb, var(--pass) 35%, transparent);
  color: var(--pass);
  border-radius: 999px; font-size: .72rem; font-weight: 700;
  padding: 2px 10px; display: none;
}
.smarts-badge.visible { display: inline-block; }
.smarts-nomatch {
  color: var(--muted); font-size: .8rem; display: none; align-self: center;
}
.smarts-nomatch.visible { display: inline; }

/* ── Radar chart ─────────────────────────────────────────────────────── */
.radar-wrap {
  display: flex;
  justify-content: center;
  margin: 0 0 1.25rem;
}
.radar-wrap svg { max-width: 280px; height: auto; overflow: visible; }

/* ── Descriptor table ────────────────────────────────────────────────── */
.table-wrap { overflow-x: auto; }
table {
  width: 100%; border-collapse: collapse;
  font-size: .88rem;
}
thead th {
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  color: var(--muted);
  font-size: .78rem; font-weight: 600;
  letter-spacing: .04em;
  padding: .55rem 1rem;
  text-align: left;
  text-transform: uppercase;
  white-space: nowrap;
}
tbody tr:nth-child(odd) { background: color-mix(in srgb, var(--bg) 50%, transparent); }
tbody tr:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
tbody td {
  border-bottom: 1px solid var(--border);
  padding: .45rem 1rem;
  vertical-align: middle;
}
.td-name { color: var(--muted); font-size: .83rem; }
.td-value {
  font-family: var(--font-mono);
  font-size: .88rem;
  font-weight: 500;
}
.td-smiles {
  max-width: 260px; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap;
  font-family: var(--font-mono);
  font-size: .88rem;
  font-weight: 500;
}

/* ── Drug-likeness rules ─────────────────────────────────────────────── */
.rules-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1rem;
}
.rule-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1rem 1.25rem;
}
.rule-header {
  display: flex; align-items: center;
  justify-content: space-between;
  margin-bottom: .4rem;
}
.rule-name { font-weight: 700; font-size: .95rem; }
.badge {
  border-radius: 999px;
  font-size: .72rem; font-weight: 700;
  letter-spacing: .05em;
  padding: 2px 10px;
  text-transform: uppercase;
}
.badge-pass {
  background: color-mix(in srgb, var(--pass) 15%, transparent);
  border: 1px solid color-mix(in srgb, var(--pass) 35%, transparent);
  color: var(--pass);
}
.badge-fail {
  background: color-mix(in srgb, var(--fail) 15%, transparent);
  border: 1px solid color-mix(in srgb, var(--fail) 35%, transparent);
  color: var(--fail);
}
.badge-pending {
  background: color-mix(in srgb, var(--border) 40%, transparent);
  border: 1px solid var(--border);
  color: var(--muted);
}
.rule-criteria { color: var(--muted); font-size: .8rem; }

/* ── Similarity ──────────────────────────────────────────────────────── */
.sim-inputs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.25rem;
  margin-bottom: 1rem;
  align-items: start;
}
.sim-label {
  font-size: .82rem; font-weight: 600;
  color: var(--muted);
  margin-bottom: .35rem;
}
.sim-bar-wrap {
  background: var(--border);
  border-radius: 999px;
  height: 6px;
  overflow: hidden;
}
.sim-bar {
  height: 100%;
  border-radius: 999px;
  transition: width .35s ease;
}
.sim-val { font-family: var(--font-mono); font-weight: 600; font-size: .9rem; }

/* ── Sim molecule SVGs ───────────────────────────────────────────────── */
.sim-svgs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
  margin-bottom: 1.25rem;
}
.sim-svg-label {
  font-size: .78rem; color: var(--muted); font-weight: 600;
  margin-bottom: .3rem;
}
.sim-svg-box {
  background: var(--surface);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  min-height: 130px;
  overflow: hidden;
}
.sim-svg-box svg { max-width: 100%; height: auto; display: block; }

/* ── Reaction Scheme ─────────────────────────────────────────────────── */
.rxn-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: .75rem;
  margin-bottom: .75rem;
}
.rxn-label { color: var(--muted); font-size: .82rem; font-weight: 600; margin-bottom: .25rem; }
.rxn-svg-wrap {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  min-height: 140px;
  margin-top: .75rem;
  overflow-x: auto;
  display: flex; align-items: center; justify-content: center;
  padding: .5rem;
}
.rxn-svg-wrap svg { max-width: 100%; height: auto; display: block; }
.rxn-placeholder { color: var(--muted); font-size: .88rem; text-align: center; }

/* ── Drug Gallery ────────────────────────────────────────────────────── */
.gallery-category { margin-bottom: 1.25rem; }
.gallery-cat-title {
  color: var(--muted);
  font-size: .78rem; font-weight: 700;
  letter-spacing: .06em;
  margin-bottom: .5rem;
  text-transform: uppercase;
}
.gallery-grid { display: flex; flex-wrap: wrap; gap: .4rem; }
.gallery-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  cursor: pointer;
  font-size: .82rem; font-weight: 600;
  padding: .4rem .9rem;
  transition: border-color .15s, color .15s, background .15s;
  white-space: nowrap;
}
.gallery-card:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: color-mix(in srgb, var(--accent) 8%, transparent);
}
.gallery-card.active {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 15%, transparent);
  color: var(--accent);
}

/* ── Footer ──────────────────────────────────────────────────────────── */
footer {
  text-align: center;
  padding: 2rem 1.5rem;
  color: var(--muted);
  font-size: .82rem;
  border-top: 1px solid var(--border);
}

/* ── Responsive ──────────────────────────────────────────────────────── */
@media (max-width: 640px) {
  main { padding: 1rem .75rem 3rem; gap: 1.5rem; }
  header { padding: .75rem 1rem; }
  .header-inner { gap: .5rem; }
  .tagline { display: none; }
  section { padding: 1rem; }
  .sim-inputs { grid-template-columns: 1fr; }
  .sim-svgs { grid-template-columns: 1fr; }
  .rules-grid { grid-template-columns: 1fr 1fr; }
  tbody td { padding: .4rem .6rem; }
  .rxn-grid { grid-template-columns: 1fr; }
}
@media (max-width: 380px) {
  .rules-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- Loading overlay -->
<div id="loading-overlay">
  <div class="spinner"></div>
  <span id="loading-text">Loading WASM…</span>
</div>

<!-- Header -->
<header>
  <div class="header-inner">
    <span class="logo">chematic</span>
    <span class="version">v0.1.11</span>
    <span class="tagline" id="tagline"></span>
    <div class="lang-switcher">
      <button class="lang-btn active" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="ja">日</button>
      <button class="lang-btn" data-lang="zh">中</button>
    </div>
  </div>
</header>

<main>

  <!-- Section 1: Descriptor Calculator -->
  <section id="section-descriptor">
    <h2 id="h-desc-title"></h2>
    <div class="input-row">
      <input id="smiles-input" class="smiles-input" type="text"
             spellcheck="false" autocomplete="off">
      <button id="btn-calc" class="btn"></button>
    </div>
    <div class="preset-row">
      <span class="preset-label" id="presets-label"></span>
      <button class="btn-outline preset-btn" data-smiles="CC(=O)Oc1ccccc1C(=O)O"       id="p-aspirin"></button>
      <button class="btn-outline preset-btn" data-smiles="Cn1cnc2c1c(=O)n(c(=O)n2C)C"  id="p-caffeine"></button>
      <button class="btn-outline preset-btn" data-smiles="CC(C)Cc1ccc(cc1)C(C)C(=O)O"  id="p-ibuprofen"></button>
      <button class="btn-outline preset-btn" data-smiles="CC1=C2C(C(=O)C3(C(CC4C(C3C(C(=C2OC1=O)C)(C)C)OC(=O)C5=CC=CC=C5)OC(=O)C4)O)(C)C" id="p-taxol"></button>
      <button class="btn-outline preset-btn" data-smiles="OC[C@H]1OC(O)[C@H](O)[C@@H](O)[C@@H]1O" id="p-glucose"></button>
    </div>
    <div id="error-desc" class="error-banner hidden"></div>
    <div class="svg-area" id="svg-area">
      <div class="svg-controls-left">
        <button class="btn-svg-ctrl" id="toggle-indices" title="Toggle atom indices">0..n</button>
      </div>
      <button class="svg-zoom-reset" id="svg-zoom-reset" title="Reset zoom">1:1</button>
      <span class="svg-placeholder" id="svg-placeholder"></span>
    </div>
    <!-- SMARTS substructure filter -->
    <div class="smarts-row">
      <span class="smarts-row-label" id="smarts-label"></span>
      <input id="smarts-input" class="smiles-input" type="text" style="flex:1;min-width:140px"
             placeholder="c1ccccc1" spellcheck="false" autocomplete="off">
      <button id="btn-smarts-hi" class="btn" style="background:var(--pass)"></button>
      <button id="btn-smarts-clear" class="btn-outline"></button>
      <span class="smarts-badge" id="smarts-match-badge"></span>
      <span class="smarts-nomatch" id="smarts-nomatch-msg"></span>
    </div>
    <div class="radar-wrap" id="radar-wrap"></div>
    <div class="table-wrap">
      <table id="desc-table">
        <thead>
          <tr>
            <th id="th-prop"></th>
            <th id="th-val"></th>
          </tr>
        </thead>
        <tbody id="desc-tbody"></tbody>
      </table>
    </div>
  </section>

  <!-- Section 2: Drug-likeness Rules -->
  <section id="section-rules">
    <h2 id="h-rules-title"></h2>
    <div class="rules-grid" id="rules-grid"></div>
  </section>

  <!-- Section 3: Similarity Comparison -->
  <section id="section-similarity">
    <h2 id="h-sim-title"></h2>
    <div class="sim-inputs">
      <div>
        <div class="sim-label" id="sim-label-a"></div>
        <div class="input-row" style="margin-bottom:.5rem">
          <input id="sim-a" class="smiles-input" type="text"
                 spellcheck="false" autocomplete="off">
        </div>
        <div class="preset-row">
          <button class="btn-outline preset-sim" data-target="a" data-smiles="CC(=O)Oc1ccccc1C(=O)O"      id="sa-aspirin"></button>
          <button class="btn-outline preset-sim" data-target="a" data-smiles="Cn1cnc2c1c(=O)n(c(=O)n2C)C" id="sa-caffeine"></button>
          <button class="btn-outline preset-sim" data-target="a" data-smiles="CC(C)Cc1ccc(cc1)C(C)C(=O)O" id="sa-ibuprofen"></button>
        </div>
      </div>
      <div>
        <div class="sim-label" id="sim-label-b"></div>
        <div class="input-row" style="margin-bottom:.5rem">
          <input id="sim-b" class="smiles-input" type="text"
                 spellcheck="false" autocomplete="off">
        </div>
        <div class="preset-row">
          <button class="btn-outline preset-sim" data-target="b" data-smiles="Cn1cnc2c1c(=O)n(c(=O)n2C)C"              id="sb-caffeine"></button>
          <button class="btn-outline preset-sim" data-target="b" data-smiles="OC[C@H]1OC(O)[C@H](O)[C@@H](O)[C@@H]1O" id="sb-glucose"></button>
          <button class="btn-outline preset-sim" data-target="b" data-smiles="CC(C)Cc1ccc(cc1)C(C)C(=O)O"              id="sb-ibuprofen"></button>
        </div>
      </div>
    </div>
    <div style="margin-bottom:1rem">
      <button id="btn-sim" class="btn"></button>
    </div>
    <div id="error-sim" class="error-banner hidden"></div>
    <div class="sim-svgs" id="sim-svgs" style="display:none">
      <div>
        <div class="sim-svg-label" id="sim-svg-label-a"></div>
        <div class="sim-svg-box" id="sim-svg-a"></div>
      </div>
      <div>
        <div class="sim-svg-label" id="sim-svg-label-b"></div>
        <div class="sim-svg-box" id="sim-svg-b"></div>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th id="th-sim-method"></th>
            <th id="th-sim-desc"></th>
            <th id="th-sim-tanimoto"></th>
            <th></th>
          </tr>
        </thead>
        <tbody id="sim-tbody"></tbody>
      </table>
    </div>
  </section>

  <!-- Section 4: Reaction Scheme -->
  <section id="section-reaction">
    <h2 id="h-rxn-title"></h2>
    <div class="rxn-grid">
      <div>
        <div class="rxn-label" id="rxn-label-smirks"></div>
        <div class="input-row" style="margin-bottom:.35rem">
          <input id="rxn-smirks" class="smiles-input" type="text" spellcheck="false" autocomplete="off">
        </div>
      </div>
      <div>
        <div class="rxn-label" id="rxn-label-reactants"></div>
        <div class="input-row" style="margin-bottom:.35rem">
          <input id="rxn-reactants" class="smiles-input" type="text" spellcheck="false" autocomplete="off">
        </div>
      </div>
    </div>
    <div class="preset-row">
      <span class="preset-label" id="rxn-presets-label"></span>
      <button class="btn-outline preset-rxn"
              data-smirks="[C:1](=O)[OH:2].[O:3][C:4]>>[C:1](=O)[O:3][C:4]"
              data-reactants="CC(=O)O|CCO"

async function initWasm() {
  try {
    const mod = await import('./pkg/chematic_wasm.js');
    await mod.default('./pkg/chematic_wasm_bg.wasm');
    parseSmilesWasm  = mod.parse_smiles;
    tanimotoEcfp4    = mod.tanimoto_ecfp4;
    tanimotoFcfp4    = mod.tanimoto_fcfp4;
    tanimotoAtomPair = mod.tanimoto_atom_pair;
    tanimotoTorsion  = mod.tanimoto_torsion;
    bricsFrag        = mod.brics_fragment_count;
    DepictOptions    = mod.DepictOptions;
    runReactants     = mod.run_reactants;
    depictSvgGrid    = mod.depict_svg_grid;
    smartsMatchAtoms = mod.smarts_match_atoms;
    wasmReady = true;
  } catch (e) {
    document.getElementById('loading-text').textContent = 'WASM load failed: ' + String(e);
    throw e;
  }
}

// ============================================================
// Render: radar chart (pure SVG, no library)
// ============================================================
function renderRadar(mol) {
  const wrap = document.getElementById('radar-wrap');
  wrap.textContent = '';
  if (!mol) return;

  const axes = [
    { label: 'MW',       val: mol.molecular_weight() / 500 },
    { label: 'LogP',     val: (mol.logp_crippen() + 5) / 10 },
    { label: 'HBD',      val: mol.hbd_count() / 5 },
    { label: 'HBA',      val: mol.hba_count() / 10 },
    { label: 'TPSA',     val: mol.tpsa() / 140 },
    { label: 'RotBonds', val: mol.rotatable_bond_count() / 10 },
  ];

  const size = 300, cx = 150, cy = 150, r = 95;
  const n = axes.length;
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${size} ${size}`);
  svg.setAttribute('aria-label', 'Property radar chart');

  function angle(i) { return (i / n) * 2 * Math.PI - Math.PI / 2; }
  function pt(frac, i) {
    const a = angle(i);
    return [cx + r * frac * Math.cos(a), cy + r * frac * Math.sin(a)];
  }

  // Grid rings
  for (const frac of [0.25, 0.5, 0.75, 1.0]) {
    const pts = Array.from({ length: n }, (_, i) => pt(frac, i));
    const poly = document.createElementNS(NS, 'polygon');
    poly.setAttribute('points', pts.map(p => p.join(',')).join(' '));
    poly.setAttribute('fill', 'none');
    poly.setAttribute('stroke', frac === 1.0 ? '#4f8ef788' : '#2e3246');
    poly.setAttribute('stroke-width', frac === 1.0 ? '1.5' : '0.7');
    if (frac === 1.0) poly.setAttribute('stroke-dasharray', '4 3');
    svg.appendChild(poly);
  }

  // Axis spokes
  Array.from({ length: n }, (_, i) => {
    const [x, y] = pt(1, i);
    const line = document.createElementNS(NS, 'line');
    line.setAttribute('x1', cx); line.setAttribute('y1', cy);
    line.setAttribute('x2', x);  line.setAttribute('y2', y);
    line.setAttribute('stroke', '#2e3246');
    line.setAttribute('stroke-width', '0.7');
    svg.appendChild(line);
  });

  // Data polygon
  const clamped = axes.map(a => Math.min(Math.max(a.val, 0), 1.5));
  const allInRange = clamped.every(v => v <= 1.0);
  const dataPts = clamped.map((v, i) => pt(v, i));
  const poly = document.createElementNS(NS, 'polygon');
  poly.setAttribute('points', dataPts.map(p => p.join(',')).join(' '));
  poly.setAttribute('fill', allInRange ? 'rgba(52,211,153,.22)' : 'rgba(248,113,113,.18)');
  poly.setAttribute('stroke', allInRange ? '#34d399' : '#f87171');
  poly.setAttribute('stroke-width', '2');
  poly.setAttribute('stroke-linejoin', 'round');
  svg.appendChild(poly);

  // Dots at vertices
  dataPts.forEach(([x, y]) => {
    const dot = document.createElementNS(NS, 'circle');
    dot.setAttribute('cx', x); dot.setAttribute('cy', y); dot.setAttribute('r', '3');
    dot.setAttribute('fill', allInRange ? '#34d399' : '#f87171');
    svg.appendChild(dot);
  });

  // Axis labels
  axes.forEach((axis, i) => {
    const [x, y] = pt(1.32, i);
    const text = document.createElementNS(NS, 'text');
    text.setAttribute('x', x);
    text.setAttribute('y', y);
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('dominant-baseline', 'middle');
    text.setAttribute('font-size', '11');
    text.setAttribute('fill', '#8b92a9');
    text.setAttribute('font-family', 'var(--font-ui, sans-serif)');
    text.textContent = axis.label;
    svg.appendChild(text);
  });

  wrap.appendChild(svg);
}

}

// ============================================================
// SVG pan + zoom (wheel to zoom, drag to pan, dblclick/button to reset)
// ============================================================
function enableSvgPanZoom(area, svgEl) {
  let scale = 1, tx = 0, ty = 0;
  let dragging = false, startX = 0, startY = 0;

  function apply() {
    svgEl.style.transformOrigin = '50% 50%';
    svgEl.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
  }

  area.addEventListener('wheel', e => {
    e.preventDefault();
    const f = e.deltaY < 0 ? 1.12 : 1 / 1.12;
    scale = Math.min(Math.max(scale * f, 0.15), 12);
    apply();
  }, { passive: false });

  area.addEventListener('pointerdown', e => {
    if (e.target.classList.contains('svg-zoom-reset')) return;
    if (e.target.classList.contains('btn-svg-ctrl')) return;
    dragging = true;
    startX = e.clientX - tx;
    startY = e.clientY - ty;
    area.setPointerCapture(e.pointerId);
    area.style.cursor = 'grabbing';
  });
  area.addEventListener('pointermove', e => {
    if (!dragging) return;
    tx = e.clientX - startX;
    ty = e.clientY - startY;
    apply();
  });
  area.addEventListener('pointerup', () => { dragging = false; area.style.cursor = 'grab'; });
  area.addEventListener('dblclick', reset);

  const btn = document.getElementById('svg-zoom-reset');
  if (btn) btn.onclick = reset;

  function reset() { scale = 1; tx = 0; ty = 0; apply(); }
  area.style.cursor = 'grab';
  apply();
}

// ============================================================
// SVG depiction (output from our own WASM library — trusted source)
// ============================================================
function renderSvg(mol) {
  const area = document.getElementById('svg-area');
  try {
    const opts = makeDepictOpts();
    if (highlightedAtoms.length > 0) {
      opts.set_highlight_atoms(new Uint32Array(highlightedAtoms));
      opts.set_highlight_color(highlightColor);
    }
    const svgStr = mol.depict_svg_opts(opts);
    opts.free();
    const parser = new DOMParser();
    const doc = parser.parseFromString(svgStr, 'image/svg+xml');
    if (doc.querySelector('parsererror')) throw new Error('invalid SVG');

    const svgEl = doc.documentElement;
    svgEl.removeAttribute('width');
    svgEl.removeAttribute('height');
    svgEl.style.cssText = 'max-width:100%;max-height:360px;display:block;';

    area.querySelectorAll('svg').forEach(el => el.remove());
    const ph = document.getElementById('svg-placeholder');
    if (ph) ph.textContent = '';
    area.appendChild(svgEl);
    enableSvgPanZoom(area, svgEl);
    enableAtomClick(svgEl);
  } catch (_) {
    area.querySelectorAll('svg').forEach(el => el.remove());
    const ph = document.getElementById('svg-placeholder');
    if (ph) { ph.style.color = 'var(--muted)'; ph.textContent = t('desc.svg_ph'); }
  }
}

// ============================================================
// Atom click — highlight on click, deselect on re-click, clear on background
// ============================================================
function enableAtomClick(svgEl) {
  svgEl.addEventListener('click', e => {
    const atomEl = e.target.closest('[data-atom-idx]');
    if (atomEl) {
      const idx = parseInt(atomEl.getAttribute('data-atom-idx'), 10);
      if (highlightedAtoms.length === 1 && highlightedAtoms[0] === idx) {
        highlightedAtoms = [];
      } else {
        highlightedAtoms = [idx];
        highlightColor = '#4f8ef7';
      }
      clearSmartsUI();
      renderSvg(lastMol);
    } else {
      if (highlightedAtoms.length > 0) {
        highlightedAtoms = [];
        renderSvg(lastMol);
      }
    }
  });
}

// ============================================================
// SMARTS substructure highlight
// ============================================================
function applySmarts() {
  if (!lastMol || !smartsMatchAtoms) return;
  const pat = document.getElementById('smarts-input').value.trim();
  if (!pat) return;
  clearError('error-desc');
  try {
    const json = smartsMatchAtoms(pat, lastMol);
    const matches = JSON.parse(json);
    const idxs = [...new Set(matches.flat())].map(Number);
    const badge = document.getElementById('smarts-match-badge');
    const nomatch = document.getElementById('smarts-nomatch-msg');
    if (idxs.length > 0) {
      highlightedAtoms = idxs;
      highlightColor = '#34d399';
      badge.textContent = idxs.length + ' ' + t('smarts.matches');
      badge.classList.add('visible');
      nomatch.classList.remove('visible');
    } else {
      highlightedAtoms = [];
      badge.classList.remove('visible');
      nomatch.classList.add('visible');
    }
    renderSvg(lastMol);
  } catch (e) {
    showError('error-desc', 'SMARTS: ' + String(e));
  }
}

function clearSmarts() {
  clearSmartsUI();
  highlightedAtoms = [];
  if (lastMol) renderSvg(lastMol);
}

function clearSmartsUI() {
  const badge = document.getElementById('smarts-match-badge');
  const nomatch = document.getElementById('smarts-nomatch-msg');
  if (badge) badge.classList.remove('visible');
  if (nomatch) nomatch.classList.remove('visible');
}

// ============================================================
// Reaction Scheme
// ============================================================
function runReaction() {
  clearError('error-rxn');
  const smirks = document.getElementById('rxn-smirks').value.trim();
  const reactants = document.getElementById('rxn-reactants').value.trim();
  if (!smirks || !reactants) { showError('error-rxn', t('error.empty')); return; }
  if (!wasmReady) { showError('error-rxn', t('error.wasm')); return; }
  try {
    const productsJson = runReactants(smirks, reactants);
    const products = JSON.parse(productsJson);
    const reactantList = reactants.split('|').map(s => s.trim()).filter(Boolean);
    const productList = products.length > 0 ? products[0] : [];
    const allSmiles = [...reactantList, ...productList];
    if (allSmiles.length === 0) {
      showError('error-rxn', 'No products generated.');
      return;
    }
    const cols = Math.max(reactantList.length, productList.length, 1);
    const gridSvg = depictSvgGrid(allSmiles.join('\n'), cols);
    const parser = new DOMParser();
    const doc = parser.parseFromString(gridSvg, 'image/svg+xml');
    if (doc.querySelector('parsererror')) throw new Error('Invalid SVG from grid renderer');
    const svgEl = doc.documentElement;
    svgEl.style.cssText = 'max-width:100%;height:auto;display:block;';
    const wrap = document.getElementById('rxn-svg-wrap');
    const ph = wrap.querySelector('.rxn-placeholder');
    if (ph) ph.style.display = 'none';
    wrap.querySelectorAll('svg').forEach(el => el.remove());
    wrap.appendChild(svgEl);
  } catch (e) {
    showError('error-rxn', String(e));
  }
}

  const el = document.getElementById(id);
  el.textContent = msg;
  el.classList.remove('hidden');
}
function clearError(id) {
  document.getElementById(id).classList.add('hidden');
}

// ============================================================
// Calculate descriptors
// ============================================================
function calculate() {
  clearError('error-desc');
  const smiles = document.getElementById('smiles-input').value.trim();
  if (!smiles) { showError('error-desc', t('error.empty')); return; }
  if (!wasmReady) { showError('error-desc', t('error.wasm')); return; }

  let mol;
  try { mol = parseSmilesWasm(smiles); }
  catch (e) { showError('error-desc', t('error.parse') + String(e)); return; }

  if (lastMol) { try { lastMol.free(); } catch (_) {} }
  lastMol = mol;
  highlightedAtoms = [];
  clearSmartsUI();

  renderSvg(mol);
  renderRadar(mol);
  renderDescriptors(mol);
  renderRuleCards(mol);
}

// ============================================================
// Compare similarity
// ============================================================
function compare() {
  clearError('error-sim');
  const sA = document.getElementById('sim-a').value.trim();
  const sB = document.getElementById('sim-b').value.trim();
  if (!sA || !sB) { showError('error-sim', t('error.empty')); return; }
  if (!wasmReady) { showError('error-sim', t('error.wasm')); return; }

  let mA, mB;
  try { mA = parseSmilesWasm(sA); } catch(e) { showError('error-sim', 'A: ' + t('error.parse') + String(e)); return; }
  try { mB = parseSmilesWasm(sB); } catch(e) { mA.free(); showError('error-sim', 'B: ' + t('error.parse') + String(e)); return; }

  renderSimSvgs(mA, mB);
  const results = SIM_DEFS.map(d => d.fn(mA, mB));
  mA.free(); mB.free();
  renderSimTable(results);
}

  renderGallery();

  await initWasm();
  document.getElementById('loading-overlay').classList.add('hidden');

  // Auto-load aspirin on startup
  document.getElementById('smiles-input').value = 'CC(=O)Oc1ccccc1C(=O)O';
  calculate();

  // Language switcher
  document.querySelectorAll('[data-lang]').forEach(btn => {
    btn.addEventListener('click', () => applyLang(btn.dataset.lang));
  });

  // Calculate (button + Enter)
  document.getElementById('btn-calc').addEventListener('click', calculate);
  document.getElementById('smiles-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') calculate();
  });

  // Real-time rendering: debounced input → auto-calculate
  let calcTimer;
  document.getElementById('smiles-input').addEventListener('input', () => {
    clearTimeout(calcTimer);
    calcTimer = setTimeout(() => { if (wasmReady) calculate(); }, 350);
  });

  // Descriptor presets
  document.querySelectorAll('.preset-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.getElementById('smiles-input').value = btn.dataset.smiles;
      calculate();
    });
  });

  // Similarity presets
  document.querySelectorAll('.preset-sim').forEach(btn => {
    btn.addEventListener('click', () => {
      document.getElementById(btn.dataset.target === 'a' ? 'sim-a' : 'sim-b').value = btn.dataset.smiles;
    });
  });

  // Compare (button + Enter)
  document.getElementById('btn-sim').addEventListener('click', compare);
  ['sim-a', 'sim-b'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') compare();
    });
  });

  // Atom index toggle
  document.getElementById('toggle-indices').addEventListener('click', () => {
    showIndices = !showIndices;
    document.getElementById('toggle-indices').classList.toggle('active', showIndices);
    if (lastMol) renderSvg(lastMol);
  });

  // SMARTS
  document.getElementById('btn-smarts-hi').addEventListener('click', applySmarts);
  document.getElementById('btn-smarts-clear').addEventListener('click', clearSmarts);
  document.getElementById('smarts-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') applySmarts();
  });

  // Reaction presets
  document.querySelectorAll('.preset-rxn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.getElementById('rxn-smirks').value = btn.dataset.smirks;
      document.getElementById('rxn-reactants').value = btn.dataset.reactants;
    });
  });

  // Run reaction
  document.getElementById('btn-rxn').addEventListener('click', runReaction);
})();
</script>
</body>
</html>
