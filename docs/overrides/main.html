{% extends "base.html" %}

{% block extrahead %}
  <meta property="og:type" content="website" />
  <meta property="og:title" content="{% if page.title and page.title != 'Home' %}{{ page.title }} — chematic{% else %}chematic — Rust cheminformatics for the browser{% endif %}" />
  <meta property="og:description" content="{{ config.site_description }}" />
  <meta property="og:url" content="{{ page.canonical_url }}" />
  <meta property="og:image" content="{{ config.site_url }}og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{% if page.title and page.title != 'Home' %}{{ page.title }} — chematic{% else %}chematic — Rust cheminformatics for the browser{% endif %}" />
  <meta name="twitter:description" content="{{ config.site_description }}" />
  <meta name="twitter:image" content="{{ config.site_url }}og-image.png" />
{% endblock %}
