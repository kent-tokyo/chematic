[package]
name = "chematic-smarts"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "SMARTS parser, VF2 subgraph isomorphism and MCS for chematic — pure-Rust RDKit alternative"
keywords = ["smarts", "substructure", "vf2", "mcs", "cheminformatics"]
categories = ["science", "science::computational-chemistry::cheminformatics", "parser-implementations"]
readme = "README.md"
homepage.workspace = true
documentation = "https://docs.rs/chematic-smarts"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
chematic-core = { path = "../chematic-core", version = "0.4.6" }
chematic-perception = { path = "../chematic-perception", version = "0.4.6" }

[dev-dependencies]
chematic-smiles = { path = "../chematic-smiles" }
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "smarts_bench"
harness = false
