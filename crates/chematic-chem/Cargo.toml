[package]
name = "chematic-chem"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Molecular descriptors: MW, LogP, TPSA, QED, Gasteiger charges, CIP stereo, Murcko scaffold, tautomers, BRICS fragmentation — pure-Rust"
keywords = ["descriptors", "lipinski", "tpsa", "logp", "cheminformatics"]
categories = ["science", "science::computational-chemistry::cheminformatics"]
readme = "../../README.md"
homepage.workspace = true
documentation = "https://docs.rs/chematic-chem"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
chematic-core       = { path = "../chematic-core",       version = "0.2.0" }
chematic-perception = { path = "../chematic-perception", version = "0.2.0" }
chematic-smiles     = { path = "../chematic-smiles",     version = "0.2.0" }
chematic-smarts     = { path = "../chematic-smarts",     version = "0.2.0" }
chematic-fp         = { path = "../chematic-fp",         version = "0.2.0" }
chematic-iupac      = { path = "../chematic-iupac",      version = "0.2.0" }
serde               = { version = "1.0", features = ["derive"] }
serde_json          = "1.0"

[dev-dependencies]
