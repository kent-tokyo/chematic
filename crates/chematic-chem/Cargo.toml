[package]
name = "chematic-chem"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Molecular descriptors: MW, LogP, TPSA, QED, Gasteiger charges, CIP stereo, Murcko scaffold, tautomers, BRICS fragmentation — pure-Rust"
keywords = ["descriptors", "lipinski", "tpsa", "logp", "cheminformatics"]
categories = ["science", "science::computational-chemistry::cheminformatics", "mathematics"]
readme = "../../README.md"
homepage.workspace = true
documentation = "https://docs.rs/chematic-chem"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
chematic-core       = { path = "../chematic-core",       version = "1.1.0" }
rustc-hash          = "2"
smallvec            = "1"
chematic-perception = { path = "../chematic-perception", version = "1.1.0" }
chematic-smiles     = { path = "../chematic-smiles",     version = "1.1.0" }
chematic-smarts     = { path = "../chematic-smarts",     version = "1.1.0" }
chematic-fp         = { path = "../chematic-fp",         version = "1.1.0" }
chematic-iupac      = { path = "../chematic-iupac",      version = "1.1.0" }
chematic-cip        = { path = "../chematic-cip",        version = "1.1.0" }
serde               = { version = "1.0", features = ["derive"], optional = true }
serde_json          = { version = "1.0", optional = true }

[features]
serde = ["dep:serde", "dep:serde_json"]
trained-solubility-mlp = []
# Retained as a no-op compatibility feature. The abandoned compressed-table
# prototype was never wired into production, but downstream manifests may
# still name the feature.
compress-patterns = []

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
serde_json = "1.0"

[[bench]]
name = "descriptor_bench"
harness = false
