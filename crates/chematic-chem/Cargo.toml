[package]
name = "chematic-chem"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Molecular descriptors (MW, LogP, TPSA, CIP), standardization and Murcko scaffold for chematic"
keywords = ["descriptors", "lipinski", "tpsa", "logp", "cheminformatics"]
categories = ["science"]
readme = "../../README.md"
homepage = "https://github.com/kent-tokyo/chematic"
documentation = "https://docs.rs/chematic-chem"

[dependencies]
chematic-core = { path = "../chematic-core", version = "0.1.2" }
chematic-perception = { path = "../chematic-perception", version = "0.1.2" }

[dev-dependencies]
chematic-smiles = { path = "../chematic-smiles" }
chematic-fp     = { path = "../chematic-fp" }
