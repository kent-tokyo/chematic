[package]
name = "chematic-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Small command-line interface for common chematic molecule conversions"
keywords = ["cheminformatics", "chemistry", "smiles", "molecule", "cli"]
categories = ["command-line-utilities", "science::computational-chemistry::cheminformatics"]
homepage.workspace = true

[[bin]]
name = "chematic"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
chematic-smarts = { path = "../chematic-smarts", version = "1.0.2" }
chematic-core = { path = "../chematic-core", version = "1.0.2" }
chematic-fp = { path = "../chematic-fp", version = "1.0.2" }
chematic-chem = { path = "../chematic-chem", version = "1.0.2", features = ["serde"] }
chematic-rxn = { path = "../chematic-rxn", version = "1.0.2" }
chematic-mol = { path = "../chematic-mol", version = "1.0.2" }
chematic-smiles = { path = "../chematic-smiles", version = "1.0.2" }
