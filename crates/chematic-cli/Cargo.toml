[package]
name = "chematic-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Small command-line interface for common chematic molecule conversions"
keywords = ["cheminformatics", "chemistry", "smiles", "molecule", "cli"]
categories = ["command-line-utilities", "science::computational-chemistry::cheminformatics"]
homepage.workspace = true

[[bin]]
name = "chematic"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
chematic-mol = { path = "../chematic-mol", version = "0.45.0" }
chematic-smiles = { path = "../chematic-smiles", version = "0.45.0" }
