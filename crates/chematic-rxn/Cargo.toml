[package]
name = "chematic-rxn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Reaction SMILES/SMIRKS parser and writer for chematic — pure-Rust RDKit alternative"
keywords = ["reaction", "smiles", "smirks", "cheminformatics", "chemistry"]
categories = ["science", "science::computational-chemistry::cheminformatics", "parser-implementations", "algorithms"]
readme = "README.md"
homepage.workspace = true
documentation = "https://docs.rs/chematic-rxn"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Internal work counters (run_reactants_calls, vf2_match_count, ...) for
# performance diagnosis -- see src/perf_counters.rs. Off by default so the
# hot path pays zero cost in normal builds.
perf-instrumentation = []

[dependencies]
chematic-core   = { path = "../chematic-core",   version = "1.0.7" }
chematic-perception = { path = "../chematic-perception", version = "1.0.7" }
chematic-smiles = { path = "../chematic-smiles", version = "1.0.7" }
chematic-smarts = { path = "../chematic-smarts", version = "1.0.7" }
rustc-hash = "2"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"
# Path-only (no `version`): mutual dev-dependency, matching the pattern in
# chematic-smiles/Cargo.toml (avoids a cargo-publish version deadlock).
chematic-chem = { path = "../chematic-chem" }
