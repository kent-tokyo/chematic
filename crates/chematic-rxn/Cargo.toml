[package]
name = "chematic-rxn"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Reaction SMILES/SMIRKS parser and writer for chematic — pure-Rust RDKit alternative"
keywords = ["reaction", "smiles", "smirks", "cheminformatics", "chemistry"]
categories = ["science", "science::computational-chemistry::cheminformatics", "parser-implementations"]
readme = "README.md"
homepage.workspace = true
documentation = "https://docs.rs/chematic-rxn"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
chematic-core   = { path = "../chematic-core",   version = "0.4.29" }
chematic-smiles = { path = "../chematic-smiles", version = "0.4.29" }
chematic-smarts = { path = "../chematic-smarts", version = "0.4.29" }
rustc-hash = "2"
