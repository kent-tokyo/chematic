[package]
name = "chematic"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure-Rust cheminformatics: SMILES/SMARTS, 2D SVG depiction, SDF/MOL V3000, ECFP/MACCS fingerprints, LogP/TPSA, CIP stereo, MCS — zero C/C++ deps, WASM-ready"
keywords = ["cheminformatics", "smiles", "chemistry", "wasm", "rdkit"]
categories = ["science", "parser-implementations", "rendering"]
readme = "../../README.md"
homepage = "https://github.com/kent-tokyo/chematic"
documentation = "https://docs.rs/chematic"

[features]
default = []
smiles      = ["dep:chematic-core", "dep:chematic-smiles"]
perception  = ["smiles", "dep:chematic-perception"]
mol         = ["dep:chematic-core", "dep:chematic-mol"]
depict      = ["perception", "dep:chematic-depict"]
fp          = ["perception", "dep:chematic-smarts", "dep:chematic-fp"]
chem        = ["perception", "dep:chematic-chem"]
smarts      = ["perception", "dep:chematic-smarts"]
rxn         = ["smiles", "dep:chematic-rxn"]
threed      = ["perception", "dep:chematic-3d"]
iupac       = ["dep:chematic-iupac"]
full        = ["smiles", "perception", "mol", "depict", "fp", "chem", "smarts", "rxn", "threed", "iupac"]

[package.metadata.docs.rs]
features = ["full"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
chematic-core       = { path = "../chematic-core",       version = "0.1.26", optional = true }
chematic-smiles     = { path = "../chematic-smiles",     version = "0.1.26", optional = true }
chematic-perception = { path = "../chematic-perception", version = "0.1.26", optional = true }
chematic-mol        = { path = "../chematic-mol",        version = "0.1.26", optional = true }
chematic-depict     = { path = "../chematic-depict",     version = "0.1.26", optional = true }
chematic-chem       = { path = "../chematic-chem",       version = "0.1.26", optional = true }
chematic-fp         = { path = "../chematic-fp",         version = "0.1.26", optional = true }
chematic-smarts     = { path = "../chematic-smarts",     version = "0.1.26", optional = true }
chematic-rxn        = { path = "../chematic-rxn",        version = "0.1.26", optional = true }
chematic-3d         = { path = "../chematic-3d",         version = "0.1.26", optional = true }
chematic-iupac      = { path = "../chematic-iupac",      version = "0.1.26", optional = true }
