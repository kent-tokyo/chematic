[package]
name = "chematic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "A pure-Rust cheminformatics toolkit: SMILES/SMARTS, SDF/MOL V3000, ECFP/MACCS fingerprints, LogP/TPSA/QED, CIP stereo, MCS, 2D SVG depiction — no C/C++ dependencies, runs in the browser via WebAssembly."
keywords = ["cheminformatics", "chemistry", "smiles", "drug-discovery", "wasm"]
categories = ["science::computational-chemistry::cheminformatics", "science::computational-chemistry::molecular-simulation", "wasm", "parser-implementations", "visualization"]
readme = "../../README.md"
homepage.workspace = true
documentation = "https://docs.rs/chematic"

[features]
default = []
smiles      = ["dep:chematic-core", "dep:chematic-smiles"]
perception  = ["smiles", "dep:chematic-perception"]
mol         = ["dep:chematic-core", "dep:chematic-mol"]
depict      = ["perception", "dep:chematic-depict"]
fp          = ["perception", "dep:chematic-smarts", "dep:chematic-fp"]
chem        = ["perception", "dep:chematic-chem"]
smarts      = ["perception", "dep:chematic-smarts"]
rxn         = ["smiles", "dep:chematic-rxn"]
threed      = ["perception", "dep:chematic-3d"]
inchi       = ["chem", "dep:chematic-inchi"]
iupac       = ["dep:chematic-iupac"]
crystal     = ["dep:chematic-crystal", "chematic-mol?/crystal"]
# `full` is the aggregate of every optional facade capability (not scoped
# to Molecule-only features) -- a user who writes `features = ["full"]`
# expects everything, `crystal` included. `chematic-crystal`'s
# architectural independence from `Molecule` is why it's its own crate,
# not a reason to exclude it from this aggregate. New optional facade
# features should default to joining `full` too unless there's a specific
# reason not to (see docs/rfcs/chematic_crystal_foundation.md's
# facade-feature section for the crystal-specific decision record).
#
# `crystal`'s weak-dependency forward (`chematic-mol?/crystal`) activates
# chematic-mol's own `crystal` feature (the CIF <-> PeriodicStructure
# adapter, `parse_cif_periodic_structure`/`write_cif_periodic_structure`)
# whenever `chematic-mol` is *also* already a dependency (i.e. `mol` is
# enabled too) -- a no-op otherwise, per Cargo's `?` weak-feature syntax.
# Found and fixed as a release-readiness check: `full` previously enabled
# both `mol` and `crystal` without this forward, so a `full` user got
# `chematic::crystal` and `chematic::mol` but never the adapter bridging
# them -- exactly the "enabled full but one thing doesn't work" surprise
# this facade's own `full` contract is meant to rule out.
full        = ["smiles", "perception", "mol", "depict", "fp", "chem", "smarts", "rxn", "threed", "inchi", "iupac", "crystal"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[dependencies]
chematic-core       = { path = "../chematic-core",       version = "0.63.0", optional = true }
chematic-smiles     = { path = "../chematic-smiles",     version = "0.63.0", optional = true }
chematic-perception = { path = "../chematic-perception", version = "0.63.0", optional = true }
chematic-mol        = { path = "../chematic-mol",        version = "0.63.0", optional = true }
chematic-depict     = { path = "../chematic-depict",     version = "0.63.0", optional = true }
chematic-chem       = { path = "../chematic-chem",       version = "0.63.0", optional = true }
chematic-fp         = { path = "../chematic-fp",         version = "0.63.0", optional = true }
chematic-smarts     = { path = "../chematic-smarts",     version = "0.63.0", optional = true }
chematic-rxn        = { path = "../chematic-rxn",        version = "0.63.0", optional = true }
chematic-3d         = { path = "../chematic-3d",         version = "0.63.0", optional = true }
chematic-inchi      = { path = "../chematic-inchi",      version = "0.63.0", optional = true }
chematic-iupac      = { path = "../chematic-iupac",      version = "0.63.0", optional = true }
chematic-crystal    = { path = "../chematic-crystal",    version = "0.63.0", optional = true }
