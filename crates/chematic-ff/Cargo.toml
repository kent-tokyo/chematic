[package]
name = "chematic-ff"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "DREIDING force field atom typing and parameters for chematic — pure-Rust cheminformatics"
keywords = ["force-field", "dreiding", "cheminformatics", "molecular-dynamics", "wasm"]
categories = ["science", "science::computational-chemistry::cheminformatics", "science::computational-chemistry::molecular-simulation"]
readme = "../../README.md"
homepage.workspace = true
documentation = "https://docs.rs/chematic-ff"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
chematic-core       = { path = "../chematic-core",       version = "0.51.0" }
chematic-perception = { path = "../chematic-perception", version = "0.51.0" }

[dev-dependencies]
# Path-only (no `version`): see chematic-smiles/Cargo.toml's dev-dependencies
# comment -- a version-pinned dev-dependency must resolve against the
# registry at `cargo publish` time, which a forward reference can't satisfy.
chematic-smiles = { path = "../chematic-smiles" }
