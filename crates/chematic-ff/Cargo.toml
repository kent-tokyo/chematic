[package]
name = "chematic-ff"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "DREIDING force field atom typing and parameters for chematic — pure-Rust cheminformatics"
keywords = ["force-field", "dreiding", "cheminformatics", "molecular-dynamics", "wasm"]
categories = ["science", "science::computational-chemistry::cheminformatics"]
readme = "../../README.md"
homepage.workspace = true
documentation = "https://docs.rs/chematic-ff"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
chematic-core       = { path = "../chematic-core",       version = "0.4.12" }
chematic-perception = { path = "../chematic-perception", version = "0.4.12" }

[dev-dependencies]
chematic-smiles = { path = "../chematic-smiles", version = "0.4.12" }
