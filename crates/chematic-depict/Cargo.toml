[package]
name = "chematic-depict"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "2D molecular structure depiction as SVG: ring templates, wedge/dash stereo bonds, CPK coloring, grid layout — pure-Rust, no C/C++ dependencies"
keywords = ["svg", "depiction", "2d", "cheminformatics", "chemistry"]
categories = ["science", "science::computational-chemistry::cheminformatics", "visualization"]
readme = "README.md"
homepage.workspace = true
documentation = "https://docs.rs/chematic-depict"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
chematic-core = { path = "../chematic-core", version = "0.4.6" }
chematic-perception = { path = "../chematic-perception", version = "0.4.6" }
chematic-rxn = { path = "../chematic-rxn", version = "0.4.6" }
chematic-smiles = { path = "../chematic-smiles", version = "0.4.6" }
tiny-skia = "0.12"
image = "0.25"

[dev-dependencies]
