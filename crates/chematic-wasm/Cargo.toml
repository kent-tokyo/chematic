[package]
name = "chematic-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "WebAssembly bindings for chematic — use chematic from JavaScript/TypeScript"
keywords = ["cheminformatics", "wasm", "webassembly", "smiles", "chemistry"]
categories = ["science", "science::computational-chemistry::cheminformatics", "wasm", "api-bindings"]
readme = "README.md"
homepage.workspace = true
documentation = "https://docs.rs/chematic-wasm"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["wasm32-unknown-unknown"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["console"] }
# Not a new dependency in practice: web-sys already pulls js-sys transitively
# (same "0.3" generation) for every function above -- this just promotes it
# to a direct dependency so `js_sys::Float64Array`/`Uint32Array` can be named
# from this crate's own code (Cargo requires a direct manifest entry, not
# just transitive availability).
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chematic-core       = { path = "../chematic-core",       version = "1.0.7" }
chematic-smiles     = { path = "../chematic-smiles",     version = "1.0.7" }
chematic-perception = { path = "../chematic-perception", version = "1.0.7" }
chematic-chem       = { path = "../chematic-chem",       version = "1.0.7", features = ["serde"] }
chematic-fp         = { path = "../chematic-fp",         version = "1.0.7" }
chematic-depict     = { path = "../chematic-depict",     version = "1.0.7", default-features = false, features = [] }
chematic-rxn        = { path = "../chematic-rxn",        version = "1.0.7" }
chematic-smarts     = { path = "../chematic-smarts",     version = "1.0.7" }
chematic-3d         = { path = "../chematic-3d",         version = "1.0.7" }
chematic-mol        = { path = "../chematic-mol",        version = "1.0.7" }
chematic-inchi      = { path = "../chematic-inchi",      version = "1.0.7" }
chematic-iupac      = { path = "../chematic-iupac",      version = "1.0.7" }
chematic-ff         = { path = "../chematic-ff",         version = "1.0.7" }

[dev-dependencies]
wasm-bindgen-test = "0.2"
