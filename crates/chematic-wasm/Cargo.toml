[package]
name = "chematic-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "WebAssembly bindings for chematic — use chematic from JavaScript/TypeScript"
keywords = ["cheminformatics", "wasm", "webassembly", "smiles", "chemistry"]
categories = ["science", "wasm"]
readme = "README.md"
homepage = "https://github.com/kent-tokyo/chematic"
documentation = "https://docs.rs/chematic-wasm"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
chematic-core       = { path = "../chematic-core",       version = "0.1.12" }
chematic-smiles     = { path = "../chematic-smiles",     version = "0.1.12" }
chematic-perception = { path = "../chematic-perception", version = "0.1.12" }
chematic-chem       = { path = "../chematic-chem",       version = "0.1.12" }
chematic-fp         = { path = "../chematic-fp",         version = "0.1.12" }
chematic-depict     = { path = "../chematic-depict",     version = "0.1.12" }
chematic-rxn        = { path = "../chematic-rxn",        version = "0.1.12" }
chematic-smarts     = { path = "../chematic-smarts",     version = "0.1.12" }
chematic-3d         = { path = "../chematic-3d",         version = "0.1.12" }
