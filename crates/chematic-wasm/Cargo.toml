[package]
name = "chematic-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "WebAssembly bindings for chematic — use chematic from JavaScript/TypeScript"
keywords = ["cheminformatics", "wasm", "webassembly", "smiles", "chemistry"]
categories = ["science", "science::computational-chemistry::cheminformatics", "wasm"]
readme = "README.md"
homepage.workspace = true
documentation = "https://docs.rs/chematic-wasm"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["wasm32-unknown-unknown"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
serde_json = "1.0"
chematic-core       = { path = "../chematic-core",       version = "0.2.0" }
chematic-smiles     = { path = "../chematic-smiles",     version = "0.2.0" }
chematic-perception = { path = "../chematic-perception", version = "0.2.0" }
chematic-chem       = { path = "../chematic-chem",       version = "0.2.0" }
chematic-fp         = { path = "../chematic-fp",         version = "0.2.0" }
chematic-depict     = { path = "../chematic-depict",     version = "0.2.0" }
chematic-rxn        = { path = "../chematic-rxn",        version = "0.2.0" }
chematic-smarts     = { path = "../chematic-smarts",     version = "0.2.0" }
chematic-3d         = { path = "../chematic-3d",         version = "0.2.0" }
chematic-ewald      = { path = "../chematic-ewald",      version = "0.2.0" }
chematic-mol        = { path = "../chematic-mol",        version = "0.2.0" }
chematic-inchi      = { path = "../chematic-inchi",      version = "0.2.0" }
chematic-iupac      = { path = "../chematic-iupac",      version = "0.2.0" }
