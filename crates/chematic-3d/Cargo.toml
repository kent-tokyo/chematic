[package]
name = "chematic-3d"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "3D coordinate generation, DREIDING force field, velocity Verlet MD, PDB/XYZ I/O, conformer RMSD — pure Rust, WASM-compatible"
keywords = ["3d", "coordinates", "pdb", "xyz", "cheminformatics"]
categories = ["science", "science::computational-chemistry::cheminformatics", "science::computational-chemistry::molecular-simulation", "simulation"]
readme = "../../README.md"
homepage.workspace = true
documentation = "https://docs.rs/chematic-3d"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
chematic-core       = { path = "../chematic-core",       version = "1.0.6" }
chematic-perception = { path = "../chematic-perception", version = "1.0.6" }
chematic-ff         = { path = "../chematic-ff",         version = "1.0.6" }
chematic-chem       = { path = "../chematic-chem",       version = "1.0.6" }
chematic-fp         = { path = "../chematic-fp",         version = "1.0.6" }
chematic-smarts     = { path = "../chematic-smarts",     version = "1.0.6" }
serde_json          = "1.0"

# std::time::Instant panics on wasm32-unknown-unknown (issue #219); web-time
# is a drop-in Instant replacement backed by Performance.now() there, and
# re-exports std::time::Instant everywhere else -- see src/clock.rs.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
web-time = "1"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
# Path-only (no `version`): see chematic-smiles/Cargo.toml's dev-dependencies
# comment -- a version-pinned dev-dependency must resolve against the
# registry at `cargo publish` time, which a forward reference can't satisfy.
chematic-smiles = { path = "../chematic-smiles" }

[[bench]]
name = "pipeline_3d_bench"
harness = false
