[package]
name = "chematic-3d"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "3D coordinate generation, DREIDING force field, velocity Verlet MD, PDB/XYZ I/O, conformer RMSD — pure Rust, WASM-compatible"
keywords = ["3d", "coordinates", "pdb", "xyz", "cheminformatics"]
categories = ["science", "science::computational-chemistry::cheminformatics"]
readme = "../../README.md"
homepage.workspace = true
documentation = "https://docs.rs/chematic-3d"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
chematic-core       = { path = "../chematic-core",       version = "0.6.0" }
chematic-perception = { path = "../chematic-perception", version = "0.6.0" }
chematic-ff         = { path = "../chematic-ff",         version = "0.6.0" }
chematic-chem       = { path = "../chematic-chem",       version = "0.6.0" }
chematic-fp         = { path = "../chematic-fp",         version = "0.6.0" }
chematic-smarts     = { path = "../chematic-smarts",     version = "0.6.0" }

[dev-dependencies]
# Path-only (no `version`): see chematic-smiles/Cargo.toml's dev-dependencies
# comment -- a version-pinned dev-dependency must resolve against the
# registry at `cargo publish` time, which a forward reference can't satisfy.
chematic-smiles = { path = "../chematic-smiles" }
