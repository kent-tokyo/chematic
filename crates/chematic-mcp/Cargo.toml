[package]
name = "chematic-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "MCP (Model Context Protocol) server for chematic — AI-agent-ready cheminformatics tools"
keywords = ["cheminformatics", "mcp", "ai", "chemistry", "smiles"]
categories = ["science", "science::computational-chemistry::cheminformatics", "command-line-utilities"]
homepage.workspace = true

[[bin]]
name = "chematic-mcp"
path = "src/main.rs"

[dependencies]
serde_json = "1.0"
ureq = "3"
chematic-core       = { path = "../chematic-core",       version = "0.78.0" }
chematic-smiles     = { path = "../chematic-smiles",     version = "0.78.0" }
chematic-chem       = { path = "../chematic-chem",       version = "0.78.0", features = ["serde"] }
chematic-fp         = { path = "../chematic-fp",         version = "0.78.0" }
chematic-smarts     = { path = "../chematic-smarts",     version = "0.78.0" }
chematic-3d         = { path = "../chematic-3d",         version = "0.78.0" }
chematic-inchi      = { path = "../chematic-inchi",      version = "0.78.0" }
chematic-mol        = { path = "../chematic-mol",        version = "0.78.0" }
chematic-perception = { path = "../chematic-perception", version = "0.78.0" }

[dev-dependencies]
# Real JSON Schema 2020-12 validator, used only in tests to independently
# confirm every tool's inputSchema/outputSchema in tools.rs is itself valid
# 2020-12, and that structuredContent conforms to its outputSchema. Runtime
# argument validation (the -32602 gate in server.rs) uses a small hand-rolled
# validator instead (src/schema.rs) so the published crate's dependency
# footprint doesn't grow. `default-features = false` drops the optional
# `resolve-http`/`resolve-file` remote-$ref-fetching features -- this project
# never resolves external `$ref`s (section 12), so there is no reason for
# even a dev-dependency to carry that capability.
jsonschema = { version = "0.50", default-features = false }
