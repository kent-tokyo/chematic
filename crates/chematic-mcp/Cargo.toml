[package]
name = "chematic-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "MCP (Model Context Protocol) server for chematic — exposes 12 cheminformatics tools for AI agents"
keywords = ["mcp", "cheminformatics", "chemistry", "llm", "ai"]
categories = ["science"]

[[bin]]
name = "chematic-mcp"
path = "src/main.rs"

[dependencies]
# MCP
rmcp = { version = "0.1", features = ["server"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "io-std", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Chematic crates
chematic-core = { path = "../chematic-core", version = "0.1.38" }
chematic-smiles = { path = "../chematic-smiles", version = "0.1.38" }
chematic-chem = { path = "../chematic-chem", version = "0.1.38" }
chematic-fp = { path = "../chematic-fp", version = "0.1.38" }
chematic-smarts = { path = "../chematic-smarts", version = "0.1.38" }
chematic-rxn = { path = "../chematic-rxn", version = "0.1.38" }
chematic-3d = { path = "../chematic-3d", version = "0.1.38" }
chematic-inchi = { path = "../chematic-inchi", version = "0.1.38" }
chematic-mol = { path = "../chematic-mol", version = "0.1.38" }
chematic-perception = { path = "../chematic-perception", version = "0.1.38" }
