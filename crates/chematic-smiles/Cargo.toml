[package]
name = "chematic-smiles"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "OpenSMILES parser, writer and canonical SMILES for chematic — pure Rust, WASM-compatible"
keywords = ["smiles", "parser", "cheminformatics", "rdkit", "wasm"]
categories = ["science", "science::computational-chemistry::cheminformatics", "parser-implementations", "algorithms"]
readme = "README.md"
homepage.workspace = true
documentation = "https://docs.rs/chematic-smiles"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
chematic-core = { path = "../chematic-core", version = "0.7.1" }

[features]
# Feature-gated internal work counters for the orbit-pruning canonical
# search (`src/canonical_search.rs`). Off by default -- every counter bump
# compiles to nothing without this feature, matching the existing
# `chematic-rxn`/`perf-instrumentation` pattern (`docs/reaction_transform_perf.md`).
canonical-search-instrumentation = []

[dev-dependencies]
# Test-only: re-aromatizing after an explicit kekulize+apply_kekule round
# trip needs perception-level Huckel logic to get back to a fairly
# comparable (aromatic-form) canonical string. chematic-perception's own
# dev-dependencies pull in chematic-smiles the same way -- Cargo supports
# this dev-dependency cycle since it never affects either crate's published
# library dependency graph, only test binaries.
#
# No `version` here (path-only): a version-pinned dev-dependency still
# needs to resolve against the registry when THIS crate is packaged (cargo
# generates a full Cargo.lock, including dev-deps, before the publish
# verify step) -- with both sides pinned, neither could ever publish first.
# Path-only dev-deps are dropped from the published manifest entirely, so
# there's nothing to resolve. See scripts/check_publish_graph.py.
chematic-perception = { path = "../chematic-perception" }
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "parse_bench"
harness = false
