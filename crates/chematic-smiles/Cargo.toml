[package]
name = "chematic-smiles"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "OpenSMILES parser, writer and canonical SMILES for chematic — pure Rust, WASM-compatible"
keywords = ["smiles", "parser", "cheminformatics", "rdkit", "wasm"]
categories = ["science", "science::computational-chemistry::cheminformatics", "parser-implementations"]
readme = "README.md"
homepage.workspace = true
documentation = "https://docs.rs/chematic-smiles"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
chematic-core = { path = "../chematic-core", version = "0.4.30" }

[dev-dependencies]
# Test-only: re-aromatizing after an explicit kekulize+apply_kekule round
# trip needs perception-level Huckel logic to get back to a fairly
# comparable (aromatic-form) canonical string. chematic-perception's own
# dev-dependencies pull in chematic-smiles the same way -- Cargo supports
# this dev-dependency cycle since it never affects either crate's published
# library dependency graph, only test binaries.
chematic-perception = { path = "../chematic-perception", version = "0.4.30" }
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "parse_bench"
harness = false
