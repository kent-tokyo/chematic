[package]
name = "chematic-ewald"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Smooth Particle Mesh Ewald (SPME) electrostatics: real-space erfc Coulomb, reciprocal-space FFT, periodic boundary conditions — pure Rust"
keywords = ["ewald", "electrostatics", "molecular-dynamics", "pme", "cheminformatics"]
categories = ["science", "science::computational-chemistry::cheminformatics", "science::computational-chemistry::molecular-simulation", "mathematics"]
readme = "../../README.md"
homepage.workspace = true
documentation = "https://docs.rs/chematic-ewald"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
chematic-core = { path = "../chematic-core", version = "0.49.0" }
rustfft = "6.4"

[dev-dependencies]
# Path-only (no `version`): see chematic-smiles/Cargo.toml's dev-dependencies
# comment -- a version-pinned dev-dependency must resolve against the
# registry at `cargo publish` time, which a forward reference can't satisfy.
chematic-3d = { path = "../chematic-3d" }
