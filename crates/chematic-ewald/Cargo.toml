[package]
name = "chematic-ewald"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Smooth Particle Mesh Ewald (SPME) electrostatics: real-space erfc Coulomb, reciprocal-space FFT, periodic boundary conditions — pure Rust"
keywords = ["ewald", "electrostatics", "molecular-dynamics", "pme", "cheminformatics"]
categories = ["science", "science::computational-chemistry::cheminformatics"]
readme = "../../README.md"
homepage.workspace = true
documentation = "https://docs.rs/chematic-ewald"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
chematic-core = { path = "../chematic-core", version = "0.4.6" }
rustfft = "6.4"

[dev-dependencies]
chematic-3d = { path = "../chematic-3d", version = "0.4.6" }
