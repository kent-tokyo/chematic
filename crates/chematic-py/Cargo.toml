[package]
name = "chematic-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Python bindings for chematic — pure-Rust cheminformatics"
keywords = ["cheminformatics", "smiles", "rdkit", "python", "chemistry"]
categories = ["science", "science::computational-chemistry::cheminformatics", "api-bindings"]
publish = false

[features]
# Enables standard_inchi / standard_inchikey via the vendored IUPAC InChI C library.
# Requires a C compiler; not available for WASM targets.
native-inchi = ["chematic-inchi/native-inchi"]

[lib]
name = "chematic"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
numpy = "0.29"
rayon = "1"
ndarray = { version = "0.17", default-features = false }
chematic-core       = { path = "../chematic-core",       version = "0.85.0" }
chematic-smiles     = { path = "../chematic-smiles",     version = "0.85.0" }
chematic-perception = { path = "../chematic-perception", version = "0.85.0" }
chematic-chem       = { path = "../chematic-chem",       version = "0.85.0" }
chematic-fp         = { path = "../chematic-fp",         version = "0.85.0" }
chematic-depict     = { path = "../chematic-depict",     version = "0.85.0", features = ["pdf"] }
chematic-mol        = { path = "../chematic-mol",        version = "0.85.0", features = ["crystal"] }
chematic-smarts     = { path = "../chematic-smarts",     version = "0.85.0" }
chematic-inchi      = { path = "../chematic-inchi",      version = "0.85.0" }
chematic-iupac      = { path = "../chematic-iupac",      version = "0.85.0" }
chematic-rxn        = { path = "../chematic-rxn",        version = "0.85.0" }
chematic-3d         = { path = "../chematic-3d",         version = "0.85.0" }
chematic-ff         = { path = "../chematic-ff",         version = "0.85.0" }
chematic-crystal    = { path = "../chematic-crystal",    version = "0.85.0" }
