[package]
name = "chematic-mol"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "MOL/SDF V2000 and V3000 parser and writer for chematic — pure-Rust RDKit alternative"
keywords = ["sdf", "mol", "ctfile", "cheminformatics", "chemistry"]
categories = ["science", "science::computational-chemistry::cheminformatics", "parser-implementations", "encoding"]
readme = "../../README.md"
homepage.workspace = true
documentation = "https://docs.rs/chematic-mol"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
chematic-core        = { path = "../chematic-core",        version = "0.8.1" }
chematic-rxn         = { path = "../chematic-rxn",         version = "0.8.1" }
chematic-perception  = { path = "../chematic-perception",  version = "0.8.1" }
chematic-smiles      = { path = "../chematic-smiles",      version = "0.8.1" }
serde_json           = "1.0"

[dev-dependencies]
# Path-only (no `version`): see chematic-smiles/Cargo.toml's dev-dependencies
# comment -- a version-pinned dev-dependency must resolve against the
# registry at `cargo publish` time, which a forward reference can't satisfy.
chematic-chem   = { path = "../chematic-chem" }
