[package]
name = "chematic-mol"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "MOL/SDF V2000 and V3000 parser and writer for chematic — pure-Rust RDKit alternative"
keywords = ["sdf", "mol", "ctfile", "cheminformatics", "chemistry"]
categories = ["science", "science::computational-chemistry::cheminformatics", "parser-implementations"]
readme = "../../README.md"
homepage.workspace = true
documentation = "https://docs.rs/chematic-mol"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
chematic-core = { path = "../chematic-core", version = "0.1.33" }
chematic-rxn  = { path = "../chematic-rxn",  version = "0.1.33" }
