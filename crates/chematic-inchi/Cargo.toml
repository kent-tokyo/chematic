[package]
name = "chematic-inchi"
version.workspace = true
edition.workspace = true
authors = ["kent-tokyo <kent-tokyo@users.noreply.github.com>"]
license = "MIT OR Apache-2.0"
description = "Pure Rust InChI and InChIKey generation for IUPAC standard organic molecules (WASM-compatible)"
repository = "https://github.com/kent-tokyo/chematic"
homepage = "https://kent-tokyo.github.io/chematic/"
documentation = "https://docs.rs/chematic-inchi"
keywords = ["inchi", "cheminformatics", "chemistry", "smiles", "molecular"]
categories = ["science", "parser-implementations"]
readme = "README.md"

[dependencies]
chematic-core = { version = "0.2.0", path = "../chematic-core" }
chematic-smiles = { version = "0.2.0", path = "../chematic-smiles" }
chematic-chem = { version = "0.2.0", path = "../chematic-chem" }
sha2 = { version = "0.11", default-features = false }

[lib]
crate-type = ["rlib", "cdylib"]
