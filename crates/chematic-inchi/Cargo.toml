[package]
name = "chematic-inchi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Kentaro Tanabe (kent-tokyo) <kent-tokyo@users.noreply.github.com>"]
license = "MIT OR Apache-2.0"
description = "Pure Rust InChI/InChIKey generation (WASM-compatible) + optional IUPAC-standard InChI via native-inchi feature"
repository = "https://github.com/kent-tokyo/chematic"
homepage = "https://kent-tokyo.github.io/chematic/"
documentation = "https://docs.rs/chematic-inchi"
keywords = ["inchi", "cheminformatics", "chemistry", "smiles", "molecular"]
categories = ["science", "science::computational-chemistry::cheminformatics", "parser-implementations", "encoding"]
readme = "README.md"

[features]
# Link the vendored IUPAC InChI C library (v1.07.5) for standard-compliant
# InChI/InChIKey generation. Requires a C compiler. Not available for WASM targets.
native-inchi = ["dep:cc"]

[dependencies]
chematic-core = { version = "1.0.7", path = "../chematic-core" }
chematic-smiles = { version = "1.0.7", path = "../chematic-smiles" }
chematic-chem = { version = "1.0.7", path = "../chematic-chem" }
chematic-rxn = { version = "1.0.7", path = "../chematic-rxn" }

[build-dependencies]
cc = { version = "1", optional = true }

[lib]
crate-type = ["rlib", "cdylib"]

[[example]]
name = "ez_stash_inchi_snapshot"
required-features = ["native-inchi"]

[[example]]
name = "dedup_verify"
required-features = ["native-inchi"]

[[example]]
name = "dedup_stereo_guard_diagnosis"
required-features = ["native-inchi"]
