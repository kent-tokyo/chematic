[package]
name = "chematic-fp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "ECFP4/6, MACCS 166-bit and topological path fingerprints with Tanimoto/Dice similarity for chematic"
keywords = ["fingerprints", "ecfp", "morgan", "tanimoto", "cheminformatics"]
categories = ["science", "science::computational-chemistry::cheminformatics"]
readme = "README.md"
homepage.workspace = true
documentation = "https://docs.rs/chematic-fp"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
chematic-core = { path = "../chematic-core", version = "0.4.30" }
rustc-hash = "2"
smallvec = "1"
chematic-perception = { path = "../chematic-perception", version = "0.4.30" }
chematic-rxn = { path = "../chematic-rxn", version = "0.4.30" }
chematic-smarts = { path = "../chematic-smarts", version = "0.4.30" }
chematic-smiles = { path = "../chematic-smiles", version = "0.4.30" }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "ecfp_bench"
harness = false
