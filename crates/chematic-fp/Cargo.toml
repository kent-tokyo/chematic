[package]
name = "chematic-fp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "ECFP4/6, MACCS 166-bit and topological path fingerprints with Tanimoto/Dice similarity for chematic"
keywords = ["fingerprints", "ecfp", "morgan", "tanimoto", "cheminformatics"]
categories = ["science"]
readme = "../../README.md"
homepage = "https://github.com/kent-tokyo/chematic"
documentation = "https://docs.rs/chematic-fp"

[dependencies]
chematic-core = { path = "../chematic-core", version = "0.1.26" }
chematic-perception = { path = "../chematic-perception", version = "0.1.26" }
chematic-smarts = { path = "../chematic-smarts", version = "0.1.26" }

[dev-dependencies]
chematic-smiles = { path = "../chematic-smiles" }
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "ecfp_bench"
harness = false
