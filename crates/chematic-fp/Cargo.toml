[package]
name = "chematic-fp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "ECFP4/6, MACCS 166-bit and topological path fingerprints with Tanimoto/Dice similarity for chematic"
keywords = ["fingerprints", "ecfp", "morgan", "tanimoto", "cheminformatics"]
categories = ["science", "science::computational-chemistry::cheminformatics", "algorithms"]
readme = "README.md"
homepage.workspace = true
documentation = "https://docs.rs/chematic-fp"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Diagnostic/reference-only APIs not meant for production use, e.g. the
# Morgan RDKit-environment-parity trace (see
# scripts/ecfp_rdkit_environment_parity.py).
diagnostics = []

[dependencies]
rayon = "1"
chematic-core = { path = "../chematic-core", version = "1.0.7" }
chematic-cip = { path = "../chematic-cip", version = "1.0.7" }
rustc-hash = "2"
smallvec = "1"
chematic-perception = { path = "../chematic-perception", version = "1.0.7" }
chematic-rxn = { path = "../chematic-rxn", version = "1.0.7" }
chematic-smarts = { path = "../chematic-smarts", version = "1.0.7" }
chematic-smiles = { path = "../chematic-smiles", version = "1.0.7" }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
serde_json = "1.0"

[[bench]]
name = "ecfp_bench"
harness = false

[[example]]
name = "morgan_rdkit_environment_trace"
required-features = ["diagnostics"]

[[example]]
name = "morgan_suppression_dump"
required-features = ["diagnostics"]

[[example]]
name = "rdkit_morgan_hash_dump"
required-features = ["diagnostics"]

[[example]]
name = "rdkit_morgan_hash_dump_aromaticity_variant"
required-features = ["diagnostics"]

[[example]]
name = "rdkit_ecfp4_bitexact_matrix_dump"
required-features = ["diagnostics"]
