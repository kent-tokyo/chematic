[workspace]
members = [
    "crates/chematic-core",
    "crates/chematic-smiles",
    "crates/chematic-perception",
    "crates/chematic-mol",
    "crates/chematic-depict",
    "crates/chematic-chem",
    "crates/chematic-cip",
    "crates/chematic-fp",
    "crates/chematic-smarts",
    "crates/chematic-3d",
    "crates/chematic-rxn",
    "crates/chematic-ff",
    "crates/chematic-ewald",
    "crates/chematic-crystal",
    "crates/chematic-inchi",
    "crates/chematic-wasm",
    "crates/chematic",
    "crates/chematic-iupac",
    "crates/chematic-mcp",
    "crates/chematic-cli",
    "crates/chematic-py",
    "tools/gen_sa_table",
]
resolver = "2"

[profile.release]
opt-level = 3        # optimize for speed (was "z" for size)
lto = true           # whole-program link-time optimization
codegen-units = 1    # required for LTO; also enables more cross-crate inlining

[workspace.package]
version = "0.61.0"
edition = "2024"
rust-version = "1.88"
authors = ["kent-tokyo <kent-tokyo@users.noreply.github.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/kent-tokyo/chematic"
homepage = "https://kent-tokyo.github.io/chematic/"
