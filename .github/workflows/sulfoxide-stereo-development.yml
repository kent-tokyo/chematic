name: Sulfoxide stereo development regression
on:
  pull_request:
    types: [opened, reopened]
    paths:
      - '.github/workflows/sulfoxide-stereo-development.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Check sulfoxide parity, repair, and existing stereo regressions
        run: cargo test --locked -p chematic-3d --lib stereo_constraints::tests -- --nocapture
