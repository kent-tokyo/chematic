name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Unit tests
        run: cargo test --workspace --lib --quiet
      - name: Integration tests
        run: cargo test --workspace --tests --quiet

  test-native-inchi:
    name: Test (native-inchi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install C compiler
        run: sudo apt-get install -y gcc
      - name: Unit tests with native-inchi feature
        run: cargo test -p chematic-inchi --features native-inchi --lib --quiet
      - name: Integration tests with native-inchi feature
        run: cargo test -p chematic-inchi --features native-inchi --test standard_inchi --quiet

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo clippy --workspace -- -D warnings

  validate-citation:
    name: Validate CITATION.cff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install cffconvert --quiet
      - run: cffconvert --validate
