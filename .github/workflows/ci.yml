          python3 scripts/check_python_speed_frontier_packet.py benchmarks/2026-10-19-morgan-direct-connectivity-numeric.json.gz
          python3 scripts/check_python_speed_frontier_packet.py benchmarks/2026-10-19-morgan-tpsa-environments-numeric.json.gz
          python3 scripts/check_python_speed_frontier_packet.py benchmarks/2026-10-19-python-ring-cache-numeric.json.gz --require-adoption
          python3 scripts/check_python_speed_frontier_packet.py benchmarks/2026-10-19-morgan-tpsa-hot-scalars-pilot-numeric.json.gz
          python3 scripts/check_python_speed_frontier_packet.py benchmarks/2026-10-19-morgan-tpsa-compact-cache-pilot-numeric.json.gz
          python3 -m unittest scripts.tests.test_check_python_speed_frontier_packet scripts.tests.test_bench_python_speed_frontier -v
      - name: Verify rotor and Layered timing evidence
        run: |
          python3 scripts/check_python_rotor_layered_packet.py benchmarks/2026-10-19-rotor-layered-numeric.json.gz --require-adoption
          python3 -m unittest scripts.tests.test_check_python_rotor_layered_packet scripts.tests.test_cosmolkit_bench_corpus -v
      - name: Verify CIP timing evidence and corruption controls
        run: |
          python3 scripts/check_python_cip_frontier_packet.py benchmarks/2026-10-19-cip-lazy-preparation-numeric.json.gz
          python3 -m unittest scripts.tests.test_check_python_cip_frontier_packet -v
      - name: Verify MOL2 timing packets and corruption controls
        run: |
          python3 scripts/check_mol2_index_numeric_packet.py benchmarks/2026-10-18-mol2-index-only-numeric.json.gz
          python3 scripts/check_mol2_index_numeric_packet.py benchmarks/2026-10-18-mol2-index-fixed4-numeric.json.gz
          python3 -m unittest scripts.tests.test_check_mol2_index_numeric_packet -v
      - name: Verify bounded Open Babel file-I/O evidence
        run: python3 scripts/check_openbabel_file_io_evidence.py
      - name: Verify bounded Indigo workflow evidence
        run: python3 scripts/check_indigo_workflow_evidence.py
      - name: Verify published v1.0.29 to v1.0.30 artifact packet
        run: python3 scripts/check_v1030_artifact_packet.py
      - name: Verify isolated published-wheel timing and RSS records
        run: python3 scripts/check_published_python_isolated_paired.py
      - name: Verify isolated published-Rust timing and RSS records
        run: python3 scripts/check_published_rust_isolated_paired.py

  ci-gate:
    name: CI gate
    # Keep one stable required check while the implementation jobs evolve.
    # Release qualification waits for the entire called CI workflow, including
    # the slower artifact and cross-platform lanes below.
    if: ${{ always() }}
    needs:
      - test-python-stubs
      - test
      - rust-api-compat
      - semantic-interoperability
      - test-integration
      - test-native-inchi
      - test-python
      - test-hba-wheel-macos
      # Windows source-wheel and A6 cross-platform checks still run in full CI
      # and release qualification, without extending the PR merge gate.
      - test-wasm
      - clippy
      - msrv
      - repository-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Require every fast contract lane to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PYCODE'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          allowed_skips = {"rust-api-compat"} if os.environ["EVENT_NAME"] != "pull_request" else set()
          failures = {
              name: job["result"] for name, job in needs.items()
              if job["result"] != "success"
              and not (name in allowed_skips and job["result"] == "skipped")
          }
          for name, job in sorted(needs.items()):
              print(f"{name}: {job['result']}")
          if failures:
              print(f"Required CI lanes did not pass: {failures}", file=sys.stderr)
              sys.exit(1)
          PYCODE
