name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
      - name: Unit tests
        run: cargo test --workspace --lib --quiet

  test-integration:
    name: Integration tests (${{ matrix.package }} / ${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: chematic-3d, target: g1_regression_byte_identical }
          - { package: chematic-3d, target: rdkit_g1_parity }
          - { package: chematic-3d, target: torsion_knowledge_negative_controls }
          - { package: chematic-chem, target: canonical_idempotency_corpus_standardized }
          - { package: chematic-chem, target: canonical_stereo_d0_cip_multiset_invariance }
          - { package: chematic-chem, target: issue415_fused_heteroaromatic_holdout }
          - { package: chematic-chem, target: metal_disconnect_holdout }
          - { package: chematic-chem, target: rdkit_reference }
          - { package: chematic-chem, target: standardize_stereo_table_preservation }
          - { package: chematic-cip, target: corpus_report }
          - { package: chematic-cip, target: corpus_smoke }
          - { package: chematic-cip, target: kekule_s0_stereo_invariance }
          - { package: chematic-cip, target: mancude_context }
          - { package: chematic-cip, target: mancude_corpus_classification }
          - { package: chematic-cip, target: mancude_decision_regression }
          - { package: chematic-cip, target: mancude_digraph_diff }
          - { package: chematic-cip, target: rule4b_production_parity }
          - { package: chematic-cip, target: uncharacterized_diagnosis }
          - { package: chematic-crystal, target: neighbor }
          - { package: chematic-crystal, target: periodicity }
          - { package: chematic-crystal, target: serde_roundtrip }
          - { package: chematic-fp, target: rdkit_morgan_stable_api_fixtures }
          - { package: chematic-inchi, target: accurate_cip_preflight }
          - { package: chematic-inchi, target: dedup_fixtures }
          - { package: chematic-inchi, target: explicit_h_stereo }
          - { package: chematic-inchi, target: ez_stash_stereo0d }
          - { package: chematic-inchi, target: indexed_graph_relation }
          - { package: chematic-inchi, target: invert_stereocenter_p0_stereo_invariance }
          - { package: chematic-inchi, target: kekule_s0_stereo_invariance }
          - { package: chematic-inchi, target: standard_inchi }
          - { package: chematic-mcp, target: schema_conformance }
          - { package: chematic-mol, target: conformer_3d_io }
          - { package: chematic-mol, target: cross_binding_adversarial }
          - { package: chematic-mol, target: format_binding_parity }
          - { package: chematic-mol, target: mmcif_pqr_integration }
          - { package: chematic-mol, target: qcschema }
          - { package: chematic-mol, target: square_planar_mol_io }
          - { package: chematic-mol, target: stereo2d_ez_reader_integration }
          - { package: chematic-mol, target: stereo_reader_integration }
          - { package: chematic-perception, target: aromaticity_edge_gate }
          - { package: chematic-smiles, target: canonical_idempotency_corpus }
          - { package: chematic-smiles, target: canonical_ez_residual }
          - { package: chematic-smiles, target: cross_binding_contract }
          - { package: chematic-smiles, target: canonical_robustness }
          - { package: chematic-smiles, target: chembl_roundtrip }
          - { package: chematic-smiles, target: dative_bond_direction }
          - { package: chematic-smiles, target: kekule_s0_stereo_invariance }
          - { package: chematic-smiles, target: square_planar_stereo }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-integration-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-integration-
      - name: Integration tests
        run: |
          if [[ "${{ matrix.package }}" == "chematic-crystal" && "${{ matrix.target }}" == "serde_roundtrip" ]]; then
            cargo test -p "${{ matrix.package }}" --test "${{ matrix.target }}" --features serde --quiet
          else
            cargo test -p "${{ matrix.package }}" --test "${{ matrix.target }}" --quiet
          fi

  test-native-inchi:
    name: Test (native-inchi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install C compiler
        run: sudo apt-get install -y gcc
      - name: Unit tests with native-inchi feature
        run: cargo test -p chematic-inchi --features native-inchi --lib --quiet
      - name: Integration tests with native-inchi feature
        run: cargo test -p chematic-inchi --features native-inchi --quiet

  test-python:
    name: Test (Python bindings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-python-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-python-
      # chematic-py's pytest suite (550+ tests) previously had zero CI coverage:
      # bench-pr-gate.yml builds via maturin but never runs pytest, and
      # scripts/check.sh (the local pre-commit gate) only runs pytest when a
      # dev has already built the extension into their own .venv, since a
      # full maturin --release build is too slow for a fast local gate (see
      # scripts/check.sh). This job is the actual regression backstop.
      - name: Build & install chematic (maturin develop --release)
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
        run: |
          python -m venv .venv
          .venv/bin/pip install maturin pytest numpy --quiet
          .venv/bin/maturin develop --release -m crates/chematic-py/Cargo.toml
      - name: Run pytest (chematic-py)
        run: .venv/bin/python -m pytest crates/chematic-py/tests/ -q

  test-wasm:
    name: Test (WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Zero Rust/WASM dependency -- runs before the toolchain setup below so a
      # failure here gives the fastest possible signal.
      - name: Local Compound Explorer unit tests (pure functions, no WASM)
        run: node demo/explorer/tests/explorer.test.mjs
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked
      # chematic-wasm's Node integration tests (crates/chematic-wasm/tests/*.mjs)
      # previously had zero CI coverage: nothing built the wasm32 target or ran
      # them, so a real wasm32-unknown-unknown regression -- like issue #219's
      # Instant::now() panicking under real WASM, which no native `cargo test`
      # run could ever catch -- could ship silently. This job is that backstop.
      - name: Build WASM (--target nodejs)
        working-directory: crates/chematic-wasm
        run: wasm-pack build --target nodejs --out-dir pkg-node --release
      - name: Node integration tests (nodejs target)
        run: |
          for f in crates/chematic-wasm/tests/*.test.mjs; do
            case "$f" in
              *_web_target.test.mjs) continue ;; # needs pkg-web, built below
            esac
            echo "::group::$f"
            node "$f"
            echo "::endgroup::"
          done
      - name: Build WASM (--target web)
        working-directory: crates/chematic-wasm
        run: wasm-pack build --target web --out-dir pkg-web --release
      - name: Web-target runtime smoke (via Node initSync)
        run: node crates/chematic-wasm/tests/pipeline_v2_web_target.test.mjs

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - run: cargo clippy --workspace -- -D warnings

  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Pin the action's own code to @master (per dtolnay/rust-toolchain's
      # own documented pattern) and set the actual Rust version under test
      # via `toolchain:`, matching Cargo.toml's `rust-version`. Using the
      # action ref itself as the version pin (e.g. `@1.88.0`) makes
      # Dependabot treat this job's MSRV as a bumpable dependency -- it
      # previously proposed bumping straight to a not-yet-released Rust
      # version (1.100.0), breaking this job outright (PR #378).
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.88"
      - run: cargo check --workspace --all-features

  validate-citation:
    name: Validate CITATION.cff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install cffconvert --quiet
      - run: cffconvert --validate
