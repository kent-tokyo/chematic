name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
      - name: Unit tests
        run: cargo test --workspace --lib --quiet
      - name: Shared cross-binding manifest
        run: python3 scripts/check_cross_binding_manifest.py
      - name: A0 development packet
        run: python3 scripts/check_a0_development_packet.py
      - name: A0 core-eight sealed acceptance
        run: python3 scripts/check_a0_core_eight_sealed.py
      - name: Static binding surface inventory
        run: python3 scripts/check_binding_surface.py > /dev/null
      - name: Release documentation consistency
        run: |
          python3 scripts/check_release_docs_consistency.py
          python3 scripts/check_openbabel_file_io_contract.py
      - name: Compatibility Contract
        run: |
          python3 scripts/check_compatibility_profiles.py
          python3 scripts/check_rdkit_rebaseline_manifest.py
          python3 scripts/check_rdkit_rebaseline_execution.py
          python3 scripts/check_rdkit_rebaseline_execution.py --manifest validation/rdkit_rebaseline_python_2026_09_execution.json
          python3 scripts/check_rdkit_rebaseline_evidence.py
          python3 scripts/check_rdkit_2026_09_rebaseline_evidence.py
          python3 scripts/check_rdkit_native_rebaseline_evidence.py
          python3 -m scripts.check_rdkit_ring_backend_evidence
          node --test scripts/tests/test_compare_rdkitjs_release_chemistry.cjs scripts/tests/test_check_rdkitjs_cip_parity.cjs scripts/tests/test_check_rdkitjs_smarts_parity.cjs
          python3 scripts/check_v1029_accuracy_packet.py
          python3 scripts/generate_compatibility_dashboard.py --output /tmp/compatibility-dashboard.md
          diff -u docs/compatibility-dashboard.md /tmp/compatibility-dashboard.md
      - name: Release channel verification record
        run: python3 scripts/check_release_channel_evidence.py
      - name: MMFF94 current-source same-coordinate evidence
        run: python3 scripts/check_mmff94_current_energy_evidence.py
      - name: MMFF94 published-wheel quality evidence
        run: python3 scripts/check_mmff94_published_quality_evidence.py

  v3000-rdkit-semantic:
    name: V3000 RDKit semantic round trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install pinned RDKit lane
        run: python3 -m pip install 'rdkit==2025.9.3'
      - name: Build current CLI and verify ordinary V3000 round trip
        run: |
          cargo build --locked -p chematic-cli
          python3 scripts/v3000_rdkit_semantic_gate.py --output /tmp/v3000-rdkit-semantic.json
          python3 scripts/tpsa_functional_group_probe.py \
            --cli target/debug/chematic \
            --output /tmp/tpsa-functional-group-probe.json
          python3 scripts/descriptor_functional_group_classification.py \
            --cli target/debug/chematic \
            --output /tmp/descriptor-functional-group-classification.json

  cxsmiles-rdkit-attachment-semantic:
    name: CXSMILES RDKit attachment semantic round trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install pinned RDKit lane
        run: python3 -m pip install 'rdkit==2025.9.3'
      - name: Verify mapped wildcard attachment labels
        run: |
          cargo build --locked -p chematic-cli
          python3 scripts/rdkit_attachment_point_semantic_gate.py \
            --cli target/debug/chematic \
            --output /tmp/rdkit-attachment-point-semantic.json

  v3000-indigo-semantic:
    name: V3000 Indigo semantic round trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install pinned Indigo and RDKit lanes
        run: python3 -m pip install 'epam.indigo==1.46.0' 'rdkit==2025.9.3'
      - name: Build current CLI and verify Indigo V3000 contracts
        run: |
          cargo build --locked -p chematic-cli
          python3 scripts/v3000_indigo_semantic_gate.py --output /tmp/v3000-indigo-semantic.json
          python3 scripts/v3000_sgroup_external_reader_gate.py --output /tmp/v3000-sgroup-external-reader.json
          python3 scripts/v3000_relative_stereo_gate.py --output /tmp/v3000-relative-stereo.json
          python3 scripts/v3000_indigo_ez_query_truth_table.py --output /tmp/v3000-indigo-ez-query.json

  stereo-torture-suite:
    name: Stereo Torture Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install pinned RDKit lane
        run: python3 -m pip install 'rdkit==2025.9.3'
      - name: Verify fixed development suite and canonicalization contract
        run: |
          python3 scripts/build_stereo_torture_suite.py --check
          cargo build --locked -p chematic-cli
          python3 scripts/stereo_torture_suite_gate.py --output /tmp/stereo-torture-suite.json
          python3 scripts/stereo_spelling_invariance_gate.py --output /tmp/stereo-spelling-invariance.json

  test-integration:
    name: Integration tests (${{ matrix.package }} / ${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: chematic-3d, target: g1_regression_byte_identical }
          - { package: chematic-3d, target: rdkit_g1_parity }
          - { package: chematic-3d, target: torsion_knowledge_negative_controls }
          - { package: chematic-chem, target: canonical_idempotency_corpus_standardized }
          - { package: chematic-chem, target: canonical_stereo_d0_cip_multiset_invariance }
          - { package: chematic-chem, target: issue415_fused_heteroaromatic_holdout }
          - { package: chematic-chem, target: metal_disconnect_holdout }
          - { package: chematic-chem, target: rdkit_reference }
          - { package: chematic-chem, target: descriptor_contract }
          - { package: chematic-chem, target: standardize_stereo_table_preservation }
          - { package: chematic-cip, target: corpus_report }
          - { package: chematic-cip, target: corpus_smoke }
          - { package: chematic-cip, target: kekule_s0_stereo_invariance }
          - { package: chematic-cip, target: mancude_context }
          - { package: chematic-cip, target: mancude_corpus_classification }
          - { package: chematic-cip, target: mancude_decision_regression }
          - { package: chematic-cip, target: mancude_digraph_diff }
          - { package: chematic-cip, target: rule4b_production_parity }
          - { package: chematic-cip, target: uncharacterized_diagnosis }
          - { package: chematic-crystal, target: neighbor }
          - { package: chematic-crystal, target: periodicity }
          - { package: chematic-crystal, target: serde_roundtrip }
          - { package: chematic-fp, target: rdkit_morgan_stable_api_fixtures }
          - { package: chematic-inchi, target: accurate_cip_preflight }
          - { package: chematic-inchi, target: dedup_fixtures }
          - { package: chematic-inchi, target: explicit_h_stereo }
          - { package: chematic-inchi, target: ez_stash_stereo0d }
          - { package: chematic-inchi, target: indexed_graph_relation }
          - { package: chematic-inchi, target: invert_stereocenter_p0_stereo_invariance }
          - { package: chematic-inchi, target: kekule_s0_stereo_invariance }
          - { package: chematic-inchi, target: standard_inchi }
          - { package: chematic-mcp, target: schema_conformance }
          - { package: chematic-mol, target: conformer_3d_io }
          - { package: chematic-mol, target: cross_binding_adversarial }
          - { package: chematic-mol, target: format_binding_parity }
          - { package: chematic-mol, target: mmcif_pqr_integration }
          - { package: chematic-mol, target: qcschema }
          - { package: chematic-mol, target: square_planar_mol_io }
          - { package: chematic-mol, target: stereo2d_ez_reader_integration }
          - { package: chematic-mol, target: stereo_reader_integration }
          - { package: chematic-perception, target: aromaticity_edge_gate }
          - { package: chematic-smiles, target: canonical_idempotency_corpus }
          - { package: chematic-smiles, target: atom_tag_visit_order }
          - { package: chematic-smiles, target: atom_tag_cache }
          - { package: chematic-smiles, target: canonical_ez_residual }
          - { package: chematic-smiles, target: cross_binding_contract }
          - { package: chematic-smiles, target: canonical_robustness }
          - { package: chematic-smiles, target: chembl_roundtrip }
          - { package: chematic-smiles, target: dative_bond_direction }
          - { package: chematic-smiles, target: kekule_s0_stereo_invariance }
          - { package: chematic-smiles, target: square_planar_stereo }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-integration-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-integration-
      - name: Integration tests
        run: |
          if [[ "${{ matrix.package }}" == "chematic-crystal" && "${{ matrix.target }}" == "serde_roundtrip" ]]; then
            cargo test -p "${{ matrix.package }}" --test "${{ matrix.target }}" --features serde --quiet
          else
            cargo test -p "${{ matrix.package }}" --test "${{ matrix.target }}" --quiet
          fi

  test-native-inchi:
    name: Test (native-inchi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install C compiler
        run: sudo apt-get install -y gcc
      - name: Unit tests with native-inchi feature
        run: cargo test -p chematic-inchi --features native-inchi --lib --quiet
      - name: Integration tests with native-inchi feature
        run: cargo test -p chematic-inchi --features native-inchi --quiet

  test-python:
    name: Test (Python bindings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-python-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-python-
      # chematic-py's pytest suite (550+ tests) previously had zero CI coverage:
      # bench-pr-gate.yml builds via maturin but never runs pytest, and
      # scripts/check.sh (the local pre-commit gate) only runs pytest when a
      # dev has already built the extension into their own .venv, since a
      # full maturin --release build is too slow for a fast local gate (see
      # scripts/check.sh). This job is the actual regression backstop.
      - name: Build & install chematic (maturin develop --release)
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
        run: |
          python -m venv .venv
          .venv/bin/pip install maturin 'pytest<9' 'pytest-asyncio>=0.23,<1' numpy --quiet
          .venv/bin/maturin develop --release -m crates/chematic-py/Cargo.toml
      - name: Run pytest (chematic-py)
        run: .venv/bin/python -m pytest crates/chematic-py/tests/ -q
      - name: RDKit 2026 HBA parity from installed source wheel
        run: |
          .venv/bin/pip install 'rdkit==2026.3.6' --quiet
          .venv/bin/maturin build --release -m crates/chematic-py/Cargo.toml --interpreter .venv/bin/python --out dist/hba-wheel
          .venv/bin/pip install --force-reinstall --no-deps dist/hba-wheel/chematic-*.whl
          .venv/bin/python scripts/check_rdkit_hba_wheel.py --wheel dist/hba-wheel/chematic-*.whl --build-profile release --output validation/results/rdkit-hba-source-wheel-5k.json
          .venv/bin/python scripts/run_reaction_compatibility_v2.py --artifact dist/hba-wheel/chematic-*.whl --output validation/results/reaction-checked-source-wheel-83-linux.json --expected-rdkit 2026.03.6 --checked-rdkit-compat --expected-outcomes '{"semantic_match":80,"joint_invalid_input":3}'
          .venv/bin/python scripts/reaction_python_checked_provenance_gate.py --expected-rdkit 2026.03.6 --wheel dist/hba-wheel/chematic-*.whl --output validation/results/reaction-checked-provenance-83-linux.json
          .venv/bin/python scripts/check_python_smarts_parity_310k.py --wheel dist/hba-wheel/chematic-*.whl --module-root .venv --output validation/results/smarts-checked-source-wheel-310k-linux.json
          .venv/bin/python scripts/mmff94_atom_type_census.py --corpus validation/benchmark_corpora/rdkit-js-browser-10k-v1.smi --output validation/results/mmff94-type-source-wheel-10k-linux.json --wheel dist/hba-wheel/chematic-*.whl --module-root .venv --type37-context --source-wheel-gate
      - name: xsmarts-autoconf SMARTS/SMIRKS flag lane (#754)
        run: |
          .venv/bin/pip install "xsmarts-autoconf @ git+https://github.com/swamidasslab/xsmarts-autoconf@6ce94c945652fa4fc47719387b41be6bf0419402" --quiet
          .venv/bin/python scripts/xsmarts_autoconf_lane.py --output validation/results/xsmarts-autoconf-lane-linux.json
      - name: Property-based SMIRKS fuzz lane against RDKit (#754)
        run: .venv/bin/python scripts/smirks_property_fuzz.py --templates 2000 --seed 754 --expected validation/smirks_property_fuzz_expected.json --output validation/results/smirks-property-fuzz-linux.json --rows validation/results/smirks-property-fuzz-linux-probes.jsonl
      - name: Diagnose A6 optimized source wheel (Linux)
        run: |
          git diff --quiet
          .venv/bin/python scripts/public_package_3d_chematic.py --wheel dist/hba-wheel/chematic-*.whl --tiers AB --arms chematic_pipeline_v2_mmff94_strict_stereo_safe --output validation/results/a6-source-265-linux.jsonl --metadata-output validation/results/a6-source-265-linux.meta.json --wall-budget-seconds 1200 --package-kind source_candidate --source-revision "$(git rev-parse HEAD)" --source-diff-sha256 e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
          .venv/bin/python scripts/summarize_a6_mmff94_termination.py --rows validation/results/a6-source-265-linux.jsonl --metadata validation/results/a6-source-265-linux.meta.json --output validation/results/a6-source-265-linux.summary.json --build-profile release
          cargo run --release -q -p chematic-3d --example pipeline_v2_vs_rdkit_common_scorer -- --chematic-rows validation/results/a6-source-265-linux.jsonl --rdkit-rows validation/results/public-package-3d-rdkit-2026.3.6-2026-09-22.jsonl --output validation/results/a6-source-265-linux.scored.jsonl
          .venv/bin/python scripts/a6_platform_gate.py --rows validation/results/a6-source-265-linux.jsonl --scored validation/results/a6-source-265-linux.scored.jsonl --scope source-linux-x86_64 --output validation/results/a6-source-265-linux.gate.json
      - name: Retain HBA source-wheel parity result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rdkit-hba-source-wheel-5k
          path: |
            validation/results/rdkit-hba-source-wheel-5k.json
            validation/results/reaction-checked-source-wheel-83-linux.json
            validation/results/reaction-checked-provenance-83-linux.json
            validation/results/smarts-checked-source-wheel-310k-linux.json
            validation/results/xsmarts-autoconf-lane-linux.json
            validation/results/smirks-property-fuzz-linux.json
            validation/results/smirks-property-fuzz-linux-probes.jsonl
            validation/results/mmff94-type-source-wheel-10k-linux.json
            validation/results/a6-source-265-linux.jsonl
            validation/results/a6-source-265-linux.meta.json
            validation/results/a6-source-265-linux.summary.json
            validation/results/a6-source-265-linux.scored.jsonl
            validation/results/a6-source-265-linux.gate.json
          if-no-files-found: ignore

  test-a6-paired-linux-cp39:
    name: A6 published/source wheel retention (Linux Python 3.9)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.9'
      - name: Build source wheel and compare fixed A6 rows with published v1.0.42
        run: |
          python -m venv .venv
          .venv/bin/pip install --index-url https://pypi.org/simple maturin numpy
          .venv/bin/maturin build --release -m crates/chematic-py/Cargo.toml --interpreter .venv/bin/python --out dist/a6-source-wheel
          .venv/bin/pip install --no-deps dist/a6-source-wheel/chematic-*.whl
          git diff --quiet
          .venv/bin/python scripts/public_package_3d_chematic.py --wheel dist/a6-source-wheel/chematic-*.whl --tiers AB --arms chematic_pipeline_v2_mmff94_strict_stereo_safe --output validation/results/a6-source-265-linux-cp39.jsonl --metadata-output validation/results/a6-source-265-linux-cp39.meta.json --wall-budget-seconds 1200 --package-kind source_candidate --source-revision "$(git rev-parse HEAD)" --source-diff-sha256 e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
          .venv/bin/python scripts/summarize_a6_mmff94_termination.py --rows validation/results/a6-source-265-linux-cp39.jsonl --metadata validation/results/a6-source-265-linux-cp39.meta.json --output validation/results/a6-source-265-linux-cp39.summary.json --build-profile release
          .venv/bin/pip download --index-url https://pypi.org/simple --only-binary=:all: --no-deps 'chematic==1.0.42' --dest dist/a6-published-wheel
          .venv/bin/pip install --force-reinstall --no-deps dist/a6-published-wheel/chematic-*.whl
          .venv/bin/python scripts/public_package_3d_chematic.py --wheel dist/a6-published-wheel/chematic-*.whl --tiers AB --arms chematic_pipeline_v2_mmff94_strict_stereo_safe --output validation/results/a6-published-265-linux-cp39.jsonl --metadata-output validation/results/a6-published-265-linux-cp39.meta.json --wall-budget-seconds 1200 --package-kind published
          .venv/bin/python scripts/compare_a6_source_published_rows.py --source-rows validation/results/a6-source-265-linux-cp39.jsonl --source-metadata validation/results/a6-source-265-linux-cp39.meta.json --published-rows validation/results/a6-published-265-linux-cp39.jsonl --published-metadata validation/results/a6-published-265-linux-cp39.meta.json --output validation/results/a6-source-vs-published-265-linux-cp39.json
          cargo run --release -q -p chematic-3d --example pipeline_v2_vs_rdkit_common_scorer -- --chematic-rows validation/results/a6-source-265-linux-cp39.jsonl --rdkit-rows validation/results/public-package-3d-rdkit-2026.3.6-2026-09-22.jsonl --output validation/results/a6-source-265-linux-cp39.scored.jsonl
          .venv/bin/python scripts/a6_platform_gate.py --rows validation/results/a6-source-265-linux-cp39.jsonl --scored validation/results/a6-source-265-linux-cp39.scored.jsonl --scope source-linux-x86_64-cp39 --output validation/results/a6-source-265-linux-cp39.gate.json
          cargo run --release -q -p chematic-3d --example pipeline_v2_vs_rdkit_common_scorer -- --chematic-rows validation/results/a6-published-265-linux-cp39.jsonl --rdkit-rows validation/results/public-package-3d-rdkit-2026.3.6-2026-09-22.jsonl --output validation/results/a6-published-265-linux-cp39.scored.jsonl
          .venv/bin/python scripts/a6_platform_gate.py --rows validation/results/a6-published-265-linux-cp39.jsonl --scored validation/results/a6-published-265-linux-cp39.scored.jsonl --scope published-linux-x86_64-cp39 --reference-rows validation/results/a6-source-265-linux-cp39.jsonl --output validation/results/a6-published-265-linux-cp39.gate.json
      - name: Retain paired Linux A6 outcome
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: a6-paired-linux-cp39
          path: |
            validation/results/a6-source-265-linux-cp39.jsonl
            validation/results/a6-source-265-linux-cp39.meta.json
            validation/results/a6-source-265-linux-cp39.summary.json
            validation/results/a6-published-265-linux-cp39.jsonl
            validation/results/a6-published-265-linux-cp39.meta.json
            validation/results/a6-source-vs-published-265-linux-cp39.json
            validation/results/a6-source-265-linux-cp39.scored.jsonl
            validation/results/a6-source-265-linux-cp39.gate.json
            validation/results/a6-published-265-linux-cp39.scored.jsonl
            validation/results/a6-published-265-linux-cp39.gate.json
          if-no-files-found: ignore

  test-hba-wheel-macos:
    name: RDKit HBA release wheel (macOS arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Build, install, and compare release-profile wheel
        run: |
          test "$(uname -m)" = arm64
          python3 -m venv .venv
          .venv/bin/pip install maturin 'rdkit==2026.3.6' numpy --quiet
          .venv/bin/maturin build --release -m crates/chematic-py/Cargo.toml --interpreter .venv/bin/python --out dist/hba-wheel
          .venv/bin/pip install --no-deps dist/hba-wheel/chematic-*.whl
          .venv/bin/python scripts/check_rdkit_hba_wheel.py --wheel dist/hba-wheel/chematic-*.whl --build-profile release --output validation/results/rdkit-hba-source-wheel-5k-macos.json
          .venv/bin/python scripts/run_reaction_compatibility_v2.py --artifact dist/hba-wheel/chematic-*.whl --output validation/results/reaction-checked-source-wheel-83-macos.json --expected-rdkit 2026.03.6 --checked-rdkit-compat --expected-outcomes '{"semantic_match":80,"joint_invalid_input":3}'
          .venv/bin/python scripts/reaction_python_checked_provenance_gate.py --expected-rdkit 2026.03.6 --wheel dist/hba-wheel/chematic-*.whl --output validation/results/reaction-checked-provenance-83-macos.json
          .venv/bin/python scripts/check_python_smarts_parity_310k.py --wheel dist/hba-wheel/chematic-*.whl --module-root .venv --output validation/results/smarts-checked-source-wheel-310k-macos.json
          .venv/bin/python scripts/mmff94_atom_type_census.py --corpus validation/benchmark_corpora/rdkit-js-browser-10k-v1.smi --output validation/results/mmff94-type-source-wheel-10k-macos.json --wheel dist/hba-wheel/chematic-*.whl --module-root .venv --type37-context --source-wheel-gate
      - name: Diagnose A6 optimized source wheel (macOS arm64)
        run: |
          git diff --quiet
          .venv/bin/python scripts/public_package_3d_chematic.py --wheel dist/hba-wheel/chematic-*.whl --tiers AB --arms chematic_pipeline_v2_mmff94_strict_stereo_safe --output validation/results/a6-source-265-macos.jsonl --metadata-output validation/results/a6-source-265-macos.meta.json --wall-budget-seconds 1200 --package-kind source_candidate --source-revision "$(git rev-parse HEAD)" --source-diff-sha256 e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
          .venv/bin/python scripts/summarize_a6_mmff94_termination.py --rows validation/results/a6-source-265-macos.jsonl --metadata validation/results/a6-source-265-macos.meta.json --output validation/results/a6-source-265-macos.summary.json --build-profile release
          cargo run --release -q -p chematic-3d --example pipeline_v2_vs_rdkit_common_scorer -- --chematic-rows validation/results/a6-source-265-macos.jsonl --rdkit-rows validation/results/public-package-3d-rdkit-2026.3.6-2026-09-22.jsonl --output validation/results/a6-source-265-macos.scored.jsonl
          .venv/bin/python scripts/a6_platform_gate.py --rows validation/results/a6-source-265-macos.jsonl --scored validation/results/a6-source-265-macos.scored.jsonl --scope source-macos-arm64 --output validation/results/a6-source-265-macos.gate.json
      - name: Compare A6 published wheel on the same macOS host
        run: |
          .venv/bin/pip download --only-binary=:all: --no-deps 'chematic==1.0.42' --dest dist/a6-published-wheel
          .venv/bin/pip install --force-reinstall --no-deps dist/a6-published-wheel/chematic-*.whl
          .venv/bin/python scripts/public_package_3d_chematic.py --wheel dist/a6-published-wheel/chematic-*.whl --tiers AB --arms chematic_pipeline_v2_mmff94_strict_stereo_safe --output validation/results/a6-published-265-macos.jsonl --metadata-output validation/results/a6-published-265-macos.meta.json --wall-budget-seconds 1200 --package-kind published
          .venv/bin/python scripts/compare_a6_source_published_rows.py --source-rows validation/results/a6-source-265-macos.jsonl --source-metadata validation/results/a6-source-265-macos.meta.json --published-rows validation/results/a6-published-265-macos.jsonl --published-metadata validation/results/a6-published-265-macos.meta.json --output validation/results/a6-source-vs-published-265-macos.json
          cargo run --release -q -p chematic-3d --example pipeline_v2_vs_rdkit_common_scorer -- --chematic-rows validation/results/a6-published-265-macos.jsonl --rdkit-rows validation/results/public-package-3d-rdkit-2026.3.6-2026-09-22.jsonl --output validation/results/a6-published-265-macos.scored.jsonl
          .venv/bin/python scripts/a6_platform_gate.py --rows validation/results/a6-published-265-macos.jsonl --scored validation/results/a6-published-265-macos.scored.jsonl --scope published-macos-arm64-cp313 --reference-rows validation/results/a6-source-265-macos.jsonl --output validation/results/a6-published-265-macos.gate.json
      - name: Retain macOS HBA wheel result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rdkit-hba-source-wheel-5k-macos
          path: |
            validation/results/rdkit-hba-source-wheel-5k-macos.json
            validation/results/reaction-checked-source-wheel-83-macos.json
            validation/results/reaction-checked-provenance-83-macos.json
            validation/results/smarts-checked-source-wheel-310k-macos.json
            validation/results/mmff94-type-source-wheel-10k-macos.json
            validation/results/a6-source-265-macos.jsonl
            validation/results/a6-source-265-macos.meta.json
            validation/results/a6-source-265-macos.summary.json
            validation/results/a6-published-265-macos.jsonl
            validation/results/a6-published-265-macos.meta.json
            validation/results/a6-source-vs-published-265-macos.json
            validation/results/a6-source-265-macos.scored.jsonl
            validation/results/a6-source-265-macos.gate.json
            validation/results/a6-published-265-macos.scored.jsonl
            validation/results/a6-published-265-macos.gate.json
          if-no-files-found: ignore

  test-source-wheel-windows:
    name: Source wheel (Windows x86-64)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      # The release wheels are built for Windows but no source wheel was
      # tested there before publication.
      - name: Build and install the release-profile wheel
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install maturin 'pytest<9' 'pytest-asyncio>=0.23,<1' numpy 'rdkit==2026.3.6' --quiet
          .venv/Scripts/maturin build --locked --release -m crates/chematic-py/Cargo.toml --interpreter .venv/Scripts/python.exe --out dist/source-wheel
          .venv/Scripts/python -m pip install --no-deps dist/source-wheel/chematic-*.whl
      - name: Run pytest (chematic-py)
        run: |
          .venv/Scripts/python -m pytest crates/chematic-py/tests/ -q
          # The differential suite intentionally rewrites its checked-in
          # report. Keep the source checkout pristine for the A6 provenance
          # assertion; the platform-specific test result is already visible
          # in the pytest log.
          git restore validation/results/rdkit_diff.jsonl
      - name: Reaction 83-row and SMARTS 310k gates
        run: |
          .venv/Scripts/python scripts/run_reaction_compatibility_v2.py --artifact dist/source-wheel/chematic-*.whl --output validation/results/reaction-checked-source-wheel-83-windows.json --expected-rdkit 2026.03.6 --checked-rdkit-compat --expected-outcomes '{"semantic_match":80,"joint_invalid_input":3}'
          .venv/Scripts/python scripts/check_python_smarts_parity_310k.py --wheel dist/source-wheel/chematic-*.whl --module-root .venv --output validation/results/smarts-checked-source-wheel-310k-windows.json
      - name: Diagnose A6 optimized source wheel (Windows)
        run: |
          git status --short
          git diff --quiet
          .venv/Scripts/python scripts/public_package_3d_chematic.py --wheel dist/source-wheel/chematic-*.whl --tiers AB --arms chematic_pipeline_v2_mmff94_strict_stereo_safe --output validation/results/a6-source-265-windows.jsonl --metadata-output validation/results/a6-source-265-windows.meta.json --wall-budget-seconds 1200 --package-kind source_candidate --source-revision "$(git rev-parse HEAD)" --source-diff-sha256 e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
          .venv/Scripts/python scripts/summarize_a6_mmff94_termination.py --rows validation/results/a6-source-265-windows.jsonl --metadata validation/results/a6-source-265-windows.meta.json --output validation/results/a6-source-265-windows.summary.json --build-profile release
          cargo run --release -q -p chematic-3d --example pipeline_v2_vs_rdkit_common_scorer -- --chematic-rows validation/results/a6-source-265-windows.jsonl --rdkit-rows validation/results/public-package-3d-rdkit-2026.3.6-2026-09-22.jsonl --output validation/results/a6-source-265-windows.scored.jsonl
          .venv/Scripts/python scripts/a6_platform_gate.py --rows validation/results/a6-source-265-windows.jsonl --scored validation/results/a6-source-265-windows.scored.jsonl --scope source-windows-x86_64 --output validation/results/a6-source-265-windows.gate.json
      - name: Retain Windows source-wheel results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: source-wheel-windows
          path: |
            validation/results/reaction-checked-source-wheel-83-windows.json
            validation/results/smarts-checked-source-wheel-310k-windows.json
            validation/results/a6-source-265-windows.jsonl
            validation/results/a6-source-265-windows.meta.json
            validation/results/a6-source-265-windows.summary.json
            validation/results/a6-source-265-windows.scored.jsonl
            validation/results/a6-source-265-windows.gate.json
          if-no-files-found: ignore

  test-a6-published-macos-cp39:
    name: A6 published wheel (macOS Python 3.9)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.9'
      - name: Rerun published v1.0.42 A6 rows with the Linux lane Python ABI
        run: |
          test "$(uname -m)" = arm64
          python -m venv .venv
          .venv/bin/pip download --index-url https://pypi.org/simple --only-binary=:all: --no-deps 'chematic==1.0.42' --dest dist/a6-published-wheel
          .venv/bin/pip install --no-deps dist/a6-published-wheel/chematic-*.whl
          .venv/bin/python scripts/public_package_3d_chematic.py --wheel dist/a6-published-wheel/chematic-*.whl --tiers AB --arms chematic_pipeline_v2_mmff94_strict_stereo_safe --output validation/results/a6-published-265-macos-cp39.jsonl --metadata-output validation/results/a6-published-265-macos-cp39.meta.json --wall-budget-seconds 1200 --package-kind published
          cargo run --release -q -p chematic-3d --example pipeline_v2_vs_rdkit_common_scorer -- --chematic-rows validation/results/a6-published-265-macos-cp39.jsonl --rdkit-rows validation/results/public-package-3d-rdkit-2026.3.6-2026-09-22.jsonl --output validation/results/a6-published-265-macos-cp39.scored.jsonl
          .venv/bin/python scripts/a6_platform_gate.py --rows validation/results/a6-published-265-macos-cp39.jsonl --scored validation/results/a6-published-265-macos-cp39.scored.jsonl --scope published-macos-arm64-cp39 --output validation/results/a6-published-265-macos-cp39.gate.json
      - name: Retain macOS Python 3.9 published A6 outcomes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: a6-published-macos-cp39
          path: |
            validation/results/a6-published-265-macos-cp39.jsonl
            validation/results/a6-published-265-macos-cp39.meta.json
            validation/results/a6-published-265-macos-cp39.scored.jsonl
            validation/results/a6-published-265-macos-cp39.gate.json
          if-no-files-found: ignore

  # #739: the same A6 rows from the Linux, macOS and Windows jobs above,
  # compared row by row. Each platform job gates its own rows on the
  # independent scorer; this job reports whether the coordinates are
  # bit-identical across platforms (the libm-crate math makes them so).
  a6-cross-platform:
    name: A6 coordinates across platforms (#739)
    needs: [test-python, test-hba-wheel-macos, test-source-wheel-windows, test-a6-paired-linux-cp39, test-a6-published-macos-cp39]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: rdkit-hba-source-wheel-5k*
          path: a6-artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: a6-p*
          path: a6-artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: source-wheel-windows
          path: a6-artifacts/source-wheel-windows
      - name: Compare A6 coordinates with the Linux rows
        run: |
          A=a6-artifacts
          compare() {
            python scripts/a6_platform_gate.py --report-only --rows "$A/$1.jsonl" --scored "$A/$1.scored.jsonl" \
              --reference-rows "$A/$2.jsonl" --scope "$3" --output "a6-cross/$3.json" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          compare rdkit-hba-source-wheel-5k-macos/a6-source-265-macos rdkit-hba-source-wheel-5k/a6-source-265-linux source-macos-vs-linux
          compare source-wheel-windows/a6-source-265-windows rdkit-hba-source-wheel-5k/a6-source-265-linux source-windows-vs-linux
          compare a6-published-macos-cp39/a6-published-265-macos-cp39 a6-paired-linux-cp39/a6-published-265-linux-cp39 published-v1.0.42-macos-vs-linux-cp39
          compare a6-paired-linux-cp39/a6-published-265-linux-cp39 a6-paired-linux-cp39/a6-source-265-linux-cp39 published-v1.0.42-vs-source-linux-cp39
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: a6-cross-platform
          path: a6-cross/*.json
          if-no-files-found: ignore

  test-wasm:
    name: Test (WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Zero Rust/WASM dependency -- runs before the toolchain setup below so a
      # failure here gives the fastest possible signal.
      - name: Local Compound Explorer unit tests (pure functions, no WASM)
        run: node demo/explorer/tests/explorer.test.mjs
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked
      # chematic-wasm's Node integration tests (crates/chematic-wasm/tests/*.mjs)
      # previously had zero CI coverage: nothing built the wasm32 target or ran
      # them, so a real wasm32-unknown-unknown regression -- like issue #219's
      # Instant::now() panicking under real WASM, which no native `cargo test`
      # run could ever catch -- could ship silently. This job is that backstop.
      - name: Build WASM (--target nodejs)
        working-directory: crates/chematic-wasm
        run: wasm-pack build --target nodejs --out-dir pkg-node --release
      - name: Node integration tests (nodejs target)
        run: |
          for f in crates/chematic-wasm/tests/*.test.mjs; do
            case "$f" in
              *_web_target.test.mjs) continue ;; # needs pkg-web, built below
            esac
            echo "::group::$f"
            node "$f"
            echo "::endgroup::"
          done
      - name: Build WASM (--target web)
        working-directory: crates/chematic-wasm
        run: wasm-pack build --target web --out-dir pkg-web --release
      - name: Web-target runtime smoke (via Node initSync)
        run: node crates/chematic-wasm/tests/pipeline_v2_web_target.test.mjs
      - name: Web-target package smoke (Node byte initialization)
        run: node scripts/smoke_npm_package.mjs crates/chematic-wasm/pkg-web

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - run: cargo clippy --workspace -- -D warnings

  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Pin the action's own code to @master (per dtolnay/rust-toolchain's
      # own documented pattern) and set the actual Rust version under test
      # via `toolchain:`, matching Cargo.toml's `rust-version`. Using the
      # action ref itself as the version pin (e.g. `@1.88.0`) makes
      # Dependabot treat this job's MSRV as a bumpable dependency -- it
      # previously proposed bumping straight to a not-yet-released Rust
      # version (1.100.0), breaking this job outright (PR #378).
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.88"
      - run: cargo check --workspace --all-features

  validate-citation:
    name: Validate CITATION.cff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install cffconvert --quiet
      - run: cffconvert --validate

  validate-benchmark-index:
    name: Validate benchmark index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python3 scripts/check_benchmark_index.py
      - name: Verify bounded Open Babel file-I/O evidence
        run: python3 scripts/check_openbabel_file_io_evidence.py
      - name: Verify published v1.0.29 to v1.0.30 artifact packet
        run: python3 scripts/check_v1030_artifact_packet.py
      - name: Verify isolated published-wheel timing and RSS records
        run: python3 scripts/check_published_python_isolated_paired.py
      - name: Verify isolated published-Rust timing and RSS records
        run: python3 scripts/check_published_rust_isolated_paired.py
