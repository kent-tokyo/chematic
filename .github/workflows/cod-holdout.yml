name: Revised COD holdout comparison

on:
  pull_request:
    paths:
      - '.github/workflows/cod-holdout.yml'

permissions:
  contents: read
  actions: read

jobs:
  holdout:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: parity-candidate-ubuntu-latest-ac055be0c0262b32bfe52f7a9dd1cb3607cd1919
            wheel_sha: 046fd444e4131fbc5fabc4c1d14f5c9fe64b6525f42158abc961496f741a7898
          - os: macos-latest
            artifact: parity-candidate-macos-latest-ac055be0c0262b32bfe52f7a9dd1cb3607cd1919
            wheel_sha: 5e1f34dab867a41a97fe66ea42d01f27199fd88325c00ae36ddf229bb9406920
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      PARITY_ARTIFACT: ${{ matrix.artifact }}
      PARITY_WHEEL_SHA: ${{ matrix.wheel_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Verify and install frozen inputs
        run: |
          test "$(git rev-parse HEAD:crates)" = '99a9d44e7ddbe3ba8a1d797c8bd3baa5938272c1'
          test "$(git rev-parse HEAD:scripts/benchmarks)" = '00a8c3615c849288c7d31f718a502bbd40da4fdc'
          gh run download 44927371343 --repo "$GITHUB_REPOSITORY" --name "$PARITY_ARTIFACT" --dir candidate
          gh run download 44930127544 --repo "$GITHUB_REPOSITORY" --name cod-reference-sample-914f4df10743b1d484d0be76974ba256985822a4 --dir reference
          python -c 'import glob,hashlib,os,pathlib; p=glob.glob("candidate/**/*.whl",recursive=True); assert len(p)==1; assert hashlib.sha256(pathlib.Path(p[0]).read_bytes()).hexdigest()==os.environ["PARITY_WHEEL_SHA"]; assert hashlib.sha256(pathlib.Path("reference/cod-sample.sdf").read_bytes()).hexdigest()=="6ad24cf292a62561e55d3556395b841440f9d0d8588c7f2b85c8fb7e4675af74"'
          python -m pip install 'rdkit==2026.9.2' 'numpy<3'
          python -m pip install --force-reinstall --no-deps candidate/dist/candidate-wheel/*.whl
          python -c 'import hashlib,pathlib; x={"scripts/validation/cod_support_probe.py":"606d5d3f8b2a8cb17a3fe5534f9a1b9f09257eb4e8a9ae16c32e41fc7d474dcc", "scripts/validation/cod_eligible_split.py":"d2825bd9951a939333bf5f8ad926883f2801318f1b66ba68b28c68634d757d15", "validation/results/cod-invalid-exclusion-audit-2026-11-22.json":"3c982e6a04c7a5aecff262bec5bc8be92393587db96c17fbfa5249c9b3d25dd7"}; assert all(hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()==v for p,v in x.items())'
          gzip -dc validation/results/cod-scaffold-split-2026-11-22.json.gz > cod-split.json
          python -c 'import hashlib,pathlib; assert hashlib.sha256(pathlib.Path("cod-split.json").read_bytes()).hexdigest()=="138fff6f10426bf4041faae25fc07717e436eb7f965e2df65c5983cde65e3449"'
      - name: Audit complete holdout support and derive common domain
        run: |
          python scripts/validation/cod_support_probe.py reference/cod-sample.sdf cod-split.json --partition holdout --output cod-support.json
          python scripts/validation/cod_eligible_split.py cod-split.json validation/results/cod-invalid-exclusion-audit-2026-11-22.json cod-support.json --output-split eligible-split.json --output-audit eligible-audit.json
          python -c 'import json,os; n=json.load(open("eligible-split.json"))["eligibility"]["eligible_holdout_records"]; assert n>0; open(os.environ["GITHUB_ENV"],"a").write(f"PARITY_SAMPLE_COUNT={n}\n")'
      - name: Compare fixed candidates on the common domain
        run: |
          python scripts/benchmarks/platinum_development_probe.py --sdf reference/cod-sample.sdf --split eligible-split.json --invalid-exclusion-audit eligible-audit.json --partition holdout --output cod-holdout-fixed.json --limit "$PARITY_SAMPLE_COUNT" --count 20 --seed 42 --profile corrected --geometry --repair-iters 400
          python scripts/benchmarks/summarize_platinum_holdout.py cod-holdout-fixed.json eligible-split.json --output cod-holdout-fixed-summary.json
      - name: Compare equal-time candidates on the common domain
        run: |
          python scripts/benchmarks/platinum_time_budget.py --sdf reference/cod-sample.sdf --baseline cod-holdout-fixed.json --output cod-holdout-time.json --limit "$PARITY_SAMPLE_COUNT" --seconds 0.2 --max-candidates 20 --geometry --repair-iters 400
          python scripts/benchmarks/summarize_platinum_time_budget.py cod-holdout-time.json --output cod-holdout-time-summary.json
          python scripts/benchmarks/summarize_platinum_time_holdout.py cod-holdout-time.json eligible-split.json --output cod-holdout-time-cluster.json
      - name: Compare force fields on common coordinates
        run: |
          python scripts/benchmarks/platinum_force_fields.py --development cod-holdout-fixed.json --output cod-holdout-fields.json --checkpoint-every 50
          python scripts/benchmarks/summarize_platinum_force_fields.py cod-holdout-fields.json --output cod-holdout-fields-summary.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: revised-cod-holdout-${{ matrix.os }}-${{ github.sha }}
          path: |
            cod-support.json
            eligible-split.json
            eligible-audit.json
            cod-holdout*.json
          if-no-files-found: warn
