name: PDB macrocycle fallback timed macOS development
on:
  pull_request:
    types: [opened, reopened]
    paths:
      - '.github/workflows/macrocycle-fallback-time-development-macos.yml'
permissions:
  contents: read
  actions: read
jobs:
  timed:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Verify scoring code and fetch fixed inputs
        run: |
          python -c 'import hashlib,pathlib; p={"scripts/benchmarks/platinum_fallback_development_time.py":"7a56ce3aa82b29475e7e92a9f1141fe77b2aef2fe07e007d6c2eea5a9b6e5347","scripts/benchmarks/platinum_fallback_development_time_strict.py":"84b872a6233b84a36191cf2170185966e4e4e6f1d8cd8d833b69661c1220e2ed","scripts/benchmarks/platinum_development_probe.py":"eecbf2c8a12d9cfb75daac79ebde3a2504f87f0b267e7a196737951f6c73f9a8","scripts/benchmarks/platinum_stereo_strict.py":"3b09595c02ede46bccb1aa8b45e62b3e038fcbb30cdb5a974ef8ef0f1acd0132","scripts/benchmarks/platinum_geometry.py":"56d7c529f8499f7025aafae34c027f867a9fb2ba9877471774a285de3d19fc22","scripts/benchmarks/summarize_platinum_time_budget.py":"e0e0cf2fd47cf83bfe8c6f57ff7b9063db44895368de128e8aa88847ff83a623","scripts/benchmarks/summarize_platinum_stereo_strict.py":"66d2ea6cc908a85df7b7618aecb7cccbcd09b78e91dea11baf6fb7969726acb2"}; assert all(hashlib.sha256(pathlib.Path(k).read_bytes()).hexdigest()==v for k,v in p.items())'
          gh run download 44992673854 --repo "$GITHUB_REPOSITORY" --name corrected-fallback-development-macos-latest-f8c48c8b44321e14f4648b94ec03035ad5ae099d --dir candidate
          gh run download 44955399937 --repo "$GITHUB_REPOSITORY" --name macrocycle-pdb-prepared-3b3a5f827788c39195ccc58608e854e6ab543557 --dir macrocycle
          gh run download 44993927884 --repo "$GITHUB_REPOSITORY" --name macrocycle-pdb-development-fallback-strict-macos-14d6191281788183432f40519825a46244419918 --dir baseline
          python -c 'import glob,hashlib,json,pathlib; p=glob.glob("candidate/**/*.whl",recursive=True); assert len(p)==1; checks={p[0]:"637154a74bd4eb7000a284c5a6fe2420833dc87d1c9e7de2fb9b50b8569f7b2e","macrocycle/macrocycle-prepared.sdf":"71bf05a54cd402146e8892acd88969ec52fd45d2a02c4194b7aa905fe900222d","macrocycle/macrocycle-prepared-split.json":"ffb256b0a9dbc779a5c6b3dd2ac96deec6174dc25408dc1d0691efcef8c4c4ff","baseline/macrocycle-development-pilot.json":"c201d5551e0a781f72970ba568dce47c0de369002d61705fffff728e574ac9c5"}; assert all(hashlib.sha256(pathlib.Path(k).read_bytes()).hexdigest()==v for k,v in checks.items()); x=json.load(open("baseline/macrocycle-development-pilot.json")); assert len(x["results"])==32 and all(r.get("status")=="ok" for r in x["results"])'
          python -m pip install 'rdkit==2026.9.2' 'numpy<3'
          python -m pip install --force-reinstall --no-deps candidate/dist/candidate-wheel/*.whl
          python -m unittest scripts.validation.test_platinum_stereo_strict
      - name: Smoke test and compare under a 2-second deadline
        run: |
          common=(--sdf macrocycle/macrocycle-prepared.sdf --split macrocycle/macrocycle-prepared-split.json --baseline baseline/macrocycle-development-pilot.json --geometry --repair-iters 400 --max-candidates 20)
          python scripts/benchmarks/platinum_fallback_development_time_strict.py "${common[@]}" --limit 1 --seconds 0.2 --output fallback-time-smoke.json
          python -c 'import json; x=json.load(open("fallback-time-smoke.json")); assert len(x["results"])==1 and not x["results"][0].get("error")'
          python scripts/benchmarks/platinum_fallback_development_time_strict.py "${common[@]}" --limit 32 --seconds 2.0 --output fallback-time.json
          python scripts/benchmarks/summarize_platinum_time_budget.py fallback-time.json --output fallback-time-summary.json
          python scripts/benchmarks/summarize_platinum_stereo_strict.py fallback-time.json --output fallback-time-stereo-summary.json
          python -c 'import json; x=json.load(open("fallback-time.json")); assert len(x["results"])==32 and all(not r.get("error") for r in x["results"])'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: macrocycle-fallback-time-macos-${{ github.sha }}
          path: fallback-time*.json
          if-no-files-found: warn
