name: Phosphoryl stereo development regression
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/phosphoryl-stereo-development.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Check RDKit-derived phosphorus parity and existing verifier tests
        run: |
          cargo test --locked -p chematic-3d --lib phosphoryl_tetrahedral_parity_matches_rdkit_coordinates -- --nocapture
          cargo test --locked -p chematic-3d --lib stereo_constraints::tests -- --nocapture
      - name: Build development candidate
        run: |
          python -m pip install 'maturin==1.13.3' 'rdkit==2026.9.2' 'numpy<3'
          git rev-parse HEAD > phosphoryl-source-commit.txt
          maturin build --locked --release -m crates/chematic-py/Cargo.toml --interpreter python --out dist/phosphoryl
          python -m pip install --force-reinstall --no-deps dist/phosphoryl/*.whl
      - name: Inspect the eight exposed zero-candidate cases
        run: |
          python scripts/validation/cod_zero_candidates_diagnostic.py
          python - <<'PY'
          import json
          x=json.load(open('cod-zero-candidates-diagnostic.json'))
          cases={r['name']:r for r in x['results']}
          for name in ('VJUNGNXBONODDR-UHFFFAOYSA-N','HRPUQROAFUIJQN-NPTIBEEQSA-N'):
              item=cases[name]
              stereo=item.get('final_stereo') or {}
              assert not any(t.get('status') == 'unevaluable' for t in stereo.get('tetrahedral',[])), item
          PY
      - name: Check generated phosphorus candidates with RDKit
        run: python scripts/validation/phosphoryl_candidate_diagnostic.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: phosphoryl-stereo-development-${{ github.sha }}
          path: |
            phosphoryl-source-commit.txt
            cod-zero-candidates-diagnostic.json
            phosphoryl-candidate-diagnostic.json
          if-no-files-found: warn
