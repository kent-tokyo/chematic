name: Published package smoke

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published chematic version to install from PyPI
        required: true
        default: "1.0.15"
        type: string

permissions:
  contents: read

jobs:
  python-wheel-runtime:
    name: Python wheel runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.13"
      - name: Install published wheel
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all: "chematic==${{ inputs.version }}"
      - name: Run published runtime smoke
        run: python scripts/release_package_smoke.py --version "${{ inputs.version }}" --output "release-package-smoke-${{ runner.os }}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-package-smoke-${{ inputs.version }}-${{ runner.os }}
          path: release-package-smoke-${{ runner.os }}.json
          if-no-files-found: error
