name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    name: Rust unit coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: llvm-tools-preview
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-coverage-
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked
      # Matches the Rust unit-test lane, plus binary unit tests. Binding runtime
      # suites, integration tests, and optional features are separate CI lanes.
      - name: Measure Rust unit coverage
        id: measure
        run: |
          mkdir -p target/coverage
          cargo llvm-cov --locked --workspace --lib --bins \
            --exclude chematic-py --exclude chematic-wasm --exclude gen-sa-table \
            --lcov --output-path target/coverage/lcov.info
      - name: Generate HTML report
        run: >-
          cargo llvm-cov report
          --ignore-filename-regex '(crates/(chematic-py|chematic-wasm)/|tools/gen_sa_table/)'
          --html --output-dir target/coverage
      - name: Save coverage reports
        if: ${{ !cancelled() && steps.measure.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-unit-coverage
          path: target/coverage
          if-no-files-found: error
          retention-days: 14
      - name: Upload coverage to Codecov
        # Dependabot PRs have read-only permissions and cannot request OIDC.
        # Their measurement and downloadable reports still run above.
        if: github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          use_oidc: true
          files: target/coverage/lcov.info
          disable_search: true
          flags: rust-unit
          name: rust-unit-llvm-cov
          fail_ci_if_error: true
