name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    name: Rust coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Detect coverage-relevant changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          run_coverage=true
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            run_coverage=false
            while IFS= read -r path; do
              case "$path" in
                docs/*|benchmarks/*.json|*.md)
                  ;;
                *)
                  run_coverage=true
                  break
                  ;;
              esac
            done < <(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          fi
          echo "run_coverage=$run_coverage" >> "$GITHUB_OUTPUT"
      - name: Skip heavy coverage for documentation-only pull request
        if: steps.changes.outputs.run_coverage != 'true'
        run: echo "No Rust-impacting files changed; the required coverage check can pass without rebuilding the workspace."
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: steps.changes.outputs.run_coverage == 'true'
        with:
          components: llvm-tools-preview
      - name: Cache cargo
        if: steps.changes.outputs.run_coverage == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-coverage-
      - name: Install cargo-llvm-cov
        if: steps.changes.outputs.run_coverage == 'true'
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked
      # Include public format contracts as well as library and binary unit tests.
      # Native InChI reconstruction is measured here; binding runtimes remain
      # separate CI lanes.
      - name: Measure Rust coverage
        id: measure
        if: steps.changes.outputs.run_coverage == 'true'
        run: |
          mkdir -p target/coverage
          cargo llvm-cov --locked --workspace --lib --bins --tests \
            --features chematic-inchi/native-inchi \
            --exclude chematic-py --exclude chematic-wasm --exclude gen-sa-table \
            --no-report
          cargo llvm-cov report \
            --ignore-filename-regex '(/examples/|crates/(chematic-py|chematic-wasm)/|tools/gen_sa_table/|crates/chematic-3d/src/issue256_255_phase2_evaluation.rs)' \
            --fail-under-lines 96.5 \
            --lcov --output-path target/coverage/lcov.info
      - name: Generate HTML report
        if: steps.changes.outputs.run_coverage == 'true'
        run: >-
          cargo llvm-cov report
          --ignore-filename-regex '(/examples/|crates/(chematic-py|chematic-wasm)/|tools/gen_sa_table/|crates/chematic-3d/src/issue256_255_phase2_evaluation.rs)'
          --html --output-dir target/coverage
      - name: Save coverage reports
        if: ${{ !cancelled() && steps.changes.outputs.run_coverage == 'true' && steps.measure.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-unit-coverage
          path: target/coverage
          if-no-files-found: error
          retention-days: 14
      - name: Upload coverage to Codecov
        # Dependabot PRs have read-only permissions and cannot request OIDC.
        # Their measurement and downloadable reports still run above.
        if: steps.changes.outputs.run_coverage == 'true' && github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          use_oidc: true
          files: target/coverage/lcov.info
          disable_search: true
          # Retain the original flag so Codecov compares successive reports.
          flags: rust-unit
          name: rust-unit-llvm-cov
          fail_ci_if_error: true
