name: Build macOS bridge-fix evaluation wheel

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/bridge-fix-macos-wheel.yml'

permissions:
  contents: read

jobs:
  wheel:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 261e520ab4d0fce681b23c168bee0888c2103b0a
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Verify fixed source and build
        run: |
          test "$(git rev-parse HEAD:crates)" = '0a25fe5ad1e2ffc7478417abacd90436ae001000'
          python -m pip install 'maturin==1.13.3' 'numpy<3'
          maturin build --locked --release -m crates/chematic-py/Cargo.toml --interpreter python --out candidate
          python -m pip install --force-reinstall --no-deps candidate/*.whl
      - name: Verify bridge fixtures and record identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import chematic
          for path in ("validation/rdkit-2026.09.2-uff-bridging-hydrogen.json", "validation/rdkit-2026.09.2-uff-bridging-hydrogen-exposed.json"):
              reference = json.loads(Path(path).read_text())
              field = chematic.from_smiles(reference["smiles"]).add_hydrogens().uff_force_field(reference["coords"])
              gradient = [x for atom in field.gradient() for x in atom]
              assert abs(field.energy() - reference["energy"]) < 1e-8
              assert len(gradient) == len(reference["gradient"])
              assert max(abs(a-b) for a,b in zip(gradient, reference["gradient"])) < 1e-7
          PY
          python -c 'import hashlib,pathlib; w=list(pathlib.Path("candidate").glob("*.whl")); assert len(w)==1; pathlib.Path("candidate/wheel-sha256.txt").write_text(hashlib.sha256(w[0].read_bytes()).hexdigest()+"\n")'
          git rev-parse HEAD > candidate/source-commit.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bridge-fix-wheel-macos-261e520ab4d0fce681b23c168bee0888c2103b0a
          path: candidate/
          if-no-files-found: error
