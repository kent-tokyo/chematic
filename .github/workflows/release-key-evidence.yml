name: Release key evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Sign and verify release provenance
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Generate provenance
        run: |
          source_epoch="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH="$source_epoch"
          python3 scripts/generate_sbom.py --output target/sbom/chematic.spdx.json
          python3 scripts/generate_provenance.py \
            --output target/sbom/chematic.provenance.json \
            --artifact target/sbom/chematic.spdx.json
      - name: Sign and verify with protected release key
        env:
          RELEASE_PRIVATE_KEY: ${{ secrets.CHEMATIC_RELEASE_PRIVATE_KEY }}
        run: |
          test -n "$RELEASE_PRIVATE_KEY"
          umask 077
          private_key="$RUNNER_TEMP/release-key.pem"
          derived_public_key="$RUNNER_TEMP/derived-release-public-key.pem"
          published_public_key="chematic-release-public-key.pem"
          printf '%s\n' "$RELEASE_PRIVATE_KEY" > "$private_key"
          openssl pkey -in "$private_key" -pubout -out "$derived_public_key"
          published_fingerprint=$(openssl pkey -pubin -in "$published_public_key" -outform DER | sha256sum | awk '{print $1}')
          derived_fingerprint=$(openssl pkey -pubin -in "$derived_public_key" -outform DER | sha256sum | awk '{print $1}')
          test "$published_fingerprint" = "$derived_fingerprint"
          scripts/sign_provenance.sh \
            target/sbom/chematic.provenance.json "$private_key" \
            target/sbom/chematic.provenance.sig
          scripts/verify_release_key.sh \
            target/sbom/chematic.provenance.json \
            target/sbom/chematic.provenance.sig "$published_public_key" "$published_fingerprint"
          printf '%s  %s\n' "$published_fingerprint" "$published_public_key" > target/sbom/RELEASE-KEY-FINGERPRINT
          rm -f "$private_key"
      - name: Upload release-key evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: chematic-release-key-evidence
          path: target/sbom/
