name: Browser compatibility smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'demo/**'
      - 'scripts/browser_smoke.mjs'
      - 'scripts/explorer_browser_smoke.mjs'
      - 'scripts/explorer_worker_10k_smoke.mjs'
      - 'scripts/explorer_native_worker_parity.mjs'
      - '.github/workflows/browser-compat.yml'
  push:
    branches: [main, ci/linux-gates-089]
    paths:
      - 'demo/**'
      - 'scripts/browser_smoke.mjs'
      - 'scripts/explorer_browser_smoke.mjs'
      - 'scripts/explorer_worker_10k_smoke.mjs'
      - 'scripts/explorer_native_worker_parity.mjs'
      - '.github/workflows/browser-compat.yml'

permissions:
  contents: read

jobs:
  browser-smoke:
    name: ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.55.0
      - name: Cache Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.55.0-${{ matrix.browser }}
      - name: Install browser
        run: npx playwright install --with-deps "${{ matrix.browser }}"
      - name: Serve demo
        run: python3 -m http.server 8765 --directory demo >/tmp/chematic-browser-server.log 2>&1 &
      - name: Run browser smoke
        run: node scripts/browser_smoke.mjs "${{ matrix.browser }}"
      - name: Run Explorer browser smoke
        run: node scripts/explorer_browser_smoke.mjs "${{ matrix.browser }}"
      - name: Run Explorer Worker 10,000-record smoke
        if: matrix.browser == 'chromium'
        run: node scripts/explorer_worker_10k_smoke.mjs

  explorer-native-worker-parity:
    name: Explorer native-worker parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build native comparison binary
        # GitHub-hosted runners start without this workspace's Cargo cache.
        # Keep dependency resolution pinned while allowing the initial fetch.
        run: cargo build --release --locked -p chematic-cli
      - name: Serve demo
        run: python3 -m http.server 8765 --directory demo >/tmp/chematic-browser-server.log 2>&1 &
      - name: Compare native scalar, native batch, and Explorer Worker
        run: CHEMATIC_CLI=target/release/chematic node scripts/explorer_native_worker_parity.mjs
