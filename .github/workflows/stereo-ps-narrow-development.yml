name: Phosphorus and sulfur narrow stereo regression
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/stereo-ps-narrow-development.yml'
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Check oracle fixtures and reflections independently
        run: |
          python -m pip install 'rdkit==2026.9.2' 'numpy<3'
          python scripts/validation/check_ps_stereo_oracle.py
      - name: Test oracle geometries, mirrors and existing stereo gates
        run: |
          cargo test --locked --release -p chematic-3d --lib phosphorus_and_sulfur_stereo_matches_rdkit_and_mirrors
          cargo test --locked --release -p chematic-3d --lib stereo_constraints
          cargo test --locked --release -p chematic-3d --lib corrected_ensemble_tests
      - name: Build and fingerprint source candidate
        run: |
          python -m pip install 'maturin==1.13.3'
          git rev-parse HEAD > candidate-source-commit.txt
          git rev-parse HEAD:crates > candidate-crates-tree.txt
          maturin build --locked --release -m crates/chematic-py/Cargo.toml --interpreter python --out dist/candidate-wheel
          python -c 'import glob,hashlib,pathlib; p=glob.glob("dist/candidate-wheel/*.whl"); assert len(p)==1; f=pathlib.Path(p[0]); pathlib.Path("candidate-wheel.sha256").write_text(hashlib.sha256(f.read_bytes()).hexdigest()+"  "+f.name+"\n")'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ps-stereo-narrow-${{ matrix.os }}-${{ github.sha }}
          path: |
            candidate-source-commit.txt
            candidate-crates-tree.txt
            candidate-wheel.sha256
            dist/candidate-wheel/*.whl
          if-no-files-found: warn
