name: MMFF construction timing v8 and v9
on:
  pull_request:
    types: [opened, reopened]
    paths:
      - '.github/workflows/mmff-construction-timing-v9.yml'
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Fetch and verify candidate wheels
        run: |
          gh run download 44971533548 --repo "$GITHUB_REPOSITORY" --name parity-candidate-v8-ubuntu-latest-98a270e4ba39c7f7db61a0e1980bfa29fd55f615 --dir wheel8
          gh run download 44976994215 --repo "$GITHUB_REPOSITORY" --name parity-candidate-v9-ubuntu-latest-563825ef03c305fc2fa772dbd94db016cba7f8d1 --dir wheel9
          python -c 'import glob,hashlib,pathlib; h=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest(); a=glob.glob("wheel8/**/*.whl",recursive=True); b=glob.glob("wheel9/**/*.whl",recursive=True); assert len(a)==len(b)==1; assert h(a[0])=="8305fd27765c4d10670fa2a0900f3b86b286d35a711f3f2eecb5c412f96613ac"; assert h(b[0])=="bffb1cd496eef80f842ad26e9c036ba7cd46075204aa99374d1909a3a1642002"'
          python -m pip install --no-deps --target candidates/v8 wheel8/dist/candidate-wheel/*.whl
          python -m pip install --no-deps --target candidates/v9 wheel9/dist/candidate-wheel/*.whl
      - name: Measure in alternating order
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/candidates/v8" python scripts/validation/mmff_construction_timing.py timing-v8-a.json
          PYTHONPATH="$GITHUB_WORKSPACE/candidates/v9" python scripts/validation/mmff_construction_timing.py timing-v9-b.json
          PYTHONPATH="$GITHUB_WORKSPACE/candidates/v9" python scripts/validation/mmff_construction_timing.py timing-v9-c.json
          PYTHONPATH="$GITHUB_WORKSPACE/candidates/v8" python scripts/validation/mmff_construction_timing.py timing-v8-d.json
          python scripts/validation/summarize_mmff_construction_timing.py timing-v8-a.json timing-v9-b.json timing-v9-c.json timing-v8-d.json timing-summary.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: mmff-construction-timing-v9-${{ github.sha }}
          path: timing-*.json
          if-no-files-found: warn
