name: UFF inversion gradient development regression
on:
  pull_request:
    types: [opened, reopened]
    paths:
      - '.github/workflows/uff-inversion-development.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Check force field regression
        run: |
          python -c 'import hashlib,json,pathlib; x=json.loads(pathlib.Path("validation/rdkit-2026.09.2-uff-inversion-boundary.json").read_text()); assert hashlib.sha256(pathlib.Path("validation/rdkit-2026.03.1-uff-boundary.json").read_bytes()).hexdigest()==x["source_fixture_sha256"]'
          cargo test --locked -p chematic-ff --lib uff_contract_tests -- --nocapture
          cargo test --locked -p chematic-ff --lib uff_boundary_contract_tests -- --nocapture
          cargo test --locked -p chematic-3d --lib phosphoryl_tetrahedral_parity_matches_rdkit_coordinates -- --nocapture
      - name: Build development wheel
        run: |
          python -m pip install 'maturin==1.13.3' 'rdkit==2026.9.2' 'numpy<3'
          git rev-parse HEAD > uff-inversion-source-commit.txt
          maturin build --locked --release -m crates/chematic-py/Cargo.toml --interpreter python --out dist/uff-inversion
          python -m pip install --force-reinstall --no-deps dist/uff-inversion/*.whl
      - name: Compare against RDKit and finite differences
        run: |
          python scripts/validation/uff_inversion_diagnostic.py
          python scripts/validation/cod_zero_candidates_diagnostic.py
          python -c 'import json; x=json.load(open("cod-zero-candidates-diagnostic.json")); r={v["name"]:v for v in x["results"]}; names=("VJUNGNXBONODDR-UHFFFAOYSA-N","HRPUQROAFUIJQN-UHFFFAOYSA-N"); assert all(not any(t.get("status")=="unevaluable" for t in (r[n].get("final_stereo") or {}).get("tetrahedral",[])) for n in names)'
          python scripts/validation/phosphoryl_candidate_diagnostic.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: uff-inversion-development-${{ github.sha }}
          path: |
            uff-inversion-source-commit.txt
            uff-inversion-diagnostic.json
            cod-zero-candidates-diagnostic.json
            phosphoryl-candidate-diagnostic.json
          if-no-files-found: warn
