name: Release

# PyPI trusts this entry workflow filename for OIDC publishing.

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

# Called workflows narrow these permissions for their own jobs.
permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Verify exact source revision and publish graph
        id: tag
        run: |
          version="$(python3 scripts/check_release_tag.py --tag "$GITHUB_REF_NAME")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          test -f "validation/published-wheel-chemistry-gates-expected-v${version}.json"
          python3 scripts/check_publish_graph.py
          python3 -m unittest scripts.tests.test_check_release_tag -v

  qualification:
    name: Qualify release source
    needs: preflight
    uses: ./.github/workflows/ci.yml

  coverage:
    name: Qualify coverage
    needs: preflight
    uses: ./.github/workflows/coverage.yml

  security:
    name: Qualify security
    needs: preflight
    uses: ./.github/workflows/security.yml

  publish-crates:
    name: Publish crates.io
    if: ${{ !contains(github.ref_name, '-') }}
    needs: [preflight, qualification, coverage, security]
    uses: ./.github/workflows/publish-crates.yml
    secrets: inherit

  publish-npm:
    name: Publish npm
    if: ${{ !contains(github.ref_name, '-') }}
    needs: [preflight, qualification, coverage, security]
    uses: ./.github/workflows/publish-npm.yml
    secrets: inherit

  linux:
    if: ${{ !contains(github.ref_name, '-') }}
    needs: [preflight, qualification, coverage, security]
    # The tag trigger also matches v1.0.15-rc.2. RCs qualify source only;
    # distribution artifacts and registry publication remain skipped.
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --manifest-path crates/chematic-py/Cargo.toml -i python${{ matrix.python-version }}
          manylinux: auto
      - name: Validate packaged Python stubs before upload
        run: python scripts/check_python_stubs.py --wheel "dist/chematic-*.whl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wheels-linux-${{ matrix.platform.target }}-py${{ matrix.python-version }}
          path: dist
          if-no-files-found: error

  macos:
    if: ${{ !contains(github.ref_name, '-') }}
    needs: [preflight, qualification, coverage, security]
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --manifest-path crates/chematic-py/Cargo.toml
      - name: Validate packaged Python stubs before upload
        run: python scripts/check_python_stubs.py --wheel "dist/chematic-*.whl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wheels-macos-${{ matrix.target }}-py${{ matrix.python-version }}
          path: dist
          if-no-files-found: error

  windows:
    if: ${{ !contains(github.ref_name, '-') }}
    needs: [preflight, qualification, coverage, security]
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Normalize packaged Python typing files to LF
        shell: python
        run: |
          from pathlib import Path

          package = Path("crates/chematic-py/python/chematic")
          paths = [*package.rglob("*.pyi"), package / "py.typed"]
          for path in paths:
              data = path.read_bytes()
              path.write_bytes(data.replace(b"\r\n", b"\n").replace(b"\r", b"\n"))
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          args: --release --out dist --manifest-path crates/chematic-py/Cargo.toml
      - name: Validate packaged Python stubs before upload
        run: python scripts/check_python_stubs.py --wheel "dist/chematic-*.whl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wheels-windows-py${{ matrix.python-version }}
          path: dist
          if-no-files-found: error

  sdist:
    if: ${{ !contains(github.ref_name, '-') }}
    needs: [preflight, qualification, coverage, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out dist --manifest-path crates/chematic-py/Cargo.toml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wheels-sdist
          path: dist
          if-no-files-found: error

  publish:
    if: ${{ !contains(github.ref_name, '-') }}
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [linux, macos, windows, sdist]
    environment:
      name: pypi
      url: https://pypi.org/project/chematic/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Validate complete distribution matrix and wheel stubs
        run: |
          python scripts/check_pypi_dist.py --dist dist --version "${GITHUB_REF_NAME#v}"
          python scripts/check_python_stubs.py --wheel "dist/chematic-*.whl"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          skip-existing: true
      - name: Verify published file hashes against the built distributions
        run: python scripts/check_pypi_dist.py --dist dist --version "${GITHUB_REF_NAME#v}" --verify-published

  published-wheel-smoke:
    name: Verify published wheels
    needs: [preflight, publish]
    uses: ./.github/workflows/release-package-smoke.yml
    with:
      version: ${{ needs.preflight.outputs.version }}

  published-wheel-chemistry:
    name: Verify published chemistry
    needs: [preflight, publish]
    uses: ./.github/workflows/published-wheel-chemistry-gates.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
      biotransformer_corpus: true

  release:
    name: Create GitHub Release
    needs:
      - preflight
      - publish-crates
      - publish-npm
      - publish
      - published-wheel-smoke
      - published-wheel-chemistry
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Extract release notes
        run: |
          OLD=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null | sed 's/^v//' || echo '0.0.0')
          python3 scripts/make_release_notes.py --old "$OLD" --notes-file /tmp/release_notes.md
      - name: Generate machine-readable release metadata
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          COMMIT="$(git rev-list -1 "$GITHUB_REF_NAME")"
          RELEASED_AT="$(git for-each-ref --format='%(taggerdate:iso-strict)' "refs/tags/${GITHUB_REF_NAME}")"
          if [ -z "$RELEASED_AT" ]; then
            RELEASED_AT="$(git log -1 --format=%cI "${GITHUB_REF_NAME}^{commit}")"
          fi
          python3 scripts/generate_release_metadata.py \
            --version "$VERSION" \
            --commit "$COMMIT" \
            --released-at "$RELEASED_AT" \
            --output "/tmp/chematic-release-metadata-${VERSION}.json"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file /tmp/release_notes.md \
            --verify-tag \
            "/tmp/chematic-release-metadata-${GITHUB_REF_NAME#v}.json"
