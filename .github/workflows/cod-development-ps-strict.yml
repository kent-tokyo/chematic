name: Strict stereo COD phosphorus sulfur development comparison

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/cod-development-ps-strict.yml'

permissions:
  contents: read
  actions: read

jobs:
  development:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            profile: fallback
          - os: macos-latest
            profile: fallback
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Fetch and verify frozen wheel and structural sample
        run: |
          python -c 'import hashlib,pathlib; p={"scripts/benchmarks/platinum_fallback_development_probe.py":"95d1bf19aa126ec9f5e438a56ba43e21435e861916e5227735516029bbd26bcc","scripts/benchmarks/platinum_fallback_development_strict.py":"3588453c94f937e6a6e6c0e995c08bc929cf2e03bd981de43975891b0fb9e205","scripts/benchmarks/platinum_stereo_strict.py":"3b09595c02ede46bccb1aa8b45e62b3e038fcbb30cdb5a974ef8ef0f1acd0132","scripts/benchmarks/platinum_geometry.py":"56d7c529f8499f7025aafae34c027f867a9fb2ba9877471774a285de3d19fc22","scripts/benchmarks/summarize_platinum_stereo_strict.py":"66d2ea6cc908a85df7b7618aecb7cccbcd09b78e91dea11baf6fb7969726acb2","scripts/validation/audit_declared_stereo.py":"10213de83ecf34ffe4f3b144a1752cfe53a15005bd655bb924267dc4dbfffe91"}; assert all(hashlib.sha256(pathlib.Path(k).read_bytes()).hexdigest()==v for k,v in p.items())'
          gh run download 44997866129 --repo "$GITHUB_REPOSITORY" --name ps-stereo-development-${{ matrix.os }}-5020f56de0f7bd03e4fcf87f46bab09b4d5956f6 --dir candidate
          gh run download 44930127544 --repo "$GITHUB_REPOSITORY" --name cod-reference-sample-914f4df10743b1d484d0be76974ba256985822a4 --dir reference
          python -c 'import glob,hashlib,pathlib; p=glob.glob("candidate/**/*.whl",recursive=True); assert len(p)==1; assert hashlib.sha256(pathlib.Path(p[0]).read_bytes()).hexdigest()=="${{ matrix.os == 'ubuntu-latest' && 'e21d849fbac5795bccf6d99d35242a6e698639fdb2a2cf3bac78863a5d023b63' || '404389891f8d8f4c5a14b489a7b7cffc41c57735c69401002dc771ac700d5273' }}"; assert hashlib.sha256(pathlib.Path("reference/cod-sample.sdf").read_bytes()).hexdigest()=="6ad24cf292a62561e55d3556395b841440f9d0d8588c7f2b85c8fb7e4675af74"'
          python -c 'import hashlib,pathlib; x={"scripts/validation/cod_support_probe.py":"606d5d3f8b2a8cb17a3fe5534f9a1b9f09257eb4e8a9ae16c32e41fc7d474dcc", "scripts/validation/cod_atom_identity_audit.py":"3c28cae85c13e139c749465ad222f00b6ce75786bbd99a0bcfc3ee6298c162a7", "scripts/validation/prime_stereo_diagnostic.py":"b4decd18b60e2738cc4277a7e7e36cbdc74c52f9dc5e52244e9875675fb65e31"}; assert all(hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()==v for p,v in x.items())'
          python -m pip install 'rdkit==2026.9.2' 'numpy<3'
          python -m pip install --force-reinstall --no-deps candidate/dist/candidate-wheel/*.whl
          python -m unittest scripts.validation.test_platinum_stereo_strict scripts.validation.test_audit_declared_stereo scripts.validation.test_shard_platinum_holdout scripts.validation.test_shard_platinum_time
      - name: Unpack pinned scaffold split
        run: gzip -dc validation/results/cod-round2-scaffold-split-2026-11-22.json.gz > cod-split.json
      - name: Verify split identity
        run: python -c 'import hashlib,pathlib; assert hashlib.sha256(pathlib.Path("cod-split.json").read_bytes()).hexdigest()=="b12af9cb05683735ab8fad725dcf38e0f8e8f51bdef8e4aa3db22e87590109c3"'
      - name: Audit declared development stereo coverage
        run: python scripts/validation/audit_declared_stereo.py reference/cod-sample.sdf cod-split.json --partition development --output cod-declared-stereo.json
      - name: Audit development support separately
        run: python scripts/validation/cod_support_probe.py reference/cod-sample.sdf cod-split.json --partition development --output cod-support.json
      - name: Audit development atom identity
        run: python scripts/validation/cod_atom_identity_audit.py reference/cod-sample.sdf cod-split.json --partition development --output cod-identity.json
      - name: Diagnose exposed Prime stereo mismatch
        run: |
          python scripts/validation/prime_stereo_diagnostic.py
          python -c 'import json; x=json.load(open("prime-stereo-diagnostic.json")); assert x["count"]==44; assert not x["observations"]'
      - name: Compare development conformers
        run: |
          extra=()
          if [ "${{ matrix.profile }}" = fallback ]; then extra=(--repair-iters 400); fi
          python scripts/benchmarks/platinum_fallback_development_strict.py --sdf reference/cod-sample.sdf --split cod-split.json --output cod-development.json --limit 225 --count 20 --seed 42 --profile "${{ matrix.profile }}" --geometry "${extra[@]}"
          python scripts/benchmarks/summarize_platinum_probe.py cod-development.json --output cod-development-summary.json
          python scripts/benchmarks/summarize_platinum_stereo_strict.py cod-development.json --output cod-development-strict-stereo-summary.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cod-development-fallback-strict-${{ matrix.os }}-${{ github.sha }}
          path: |
            cod-declared-stereo.json
            cod-support.json
            cod-identity.json
            prime-stereo-diagnostic.json
            cod-development*.json
          if-no-files-found: warn
