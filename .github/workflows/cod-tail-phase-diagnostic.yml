name: Exposed COD timing phase diagnostic

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/cod-tail-phase-diagnostic.yml'

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Restore frozen candidate and reference
        run: |
          bash scripts/validation/fetch_mixed_holdout_inputs.sh ubuntu-latest cod
          gzip -dc validation/results/cod-independent-mixed-fixed-linux-2026-11-22.json.gz > baseline.json
          echo '3fb325b1f18e3150f76f1bb5fb89c9c6cc05be3f2f7e4a437b97f306fbf0f7d0  baseline.json' | sha256sum -c
          python -m pip install 'rdkit==2026.9.2' 'numpy<3'
          python -m pip install --force-reinstall --no-deps "$(cat evaluation/wheel-path.txt)"
      - name: Profile exposed case
        run: |
          python scripts/benchmarks/profile_exposed_cod_tail.py --sdf evaluation/reference/reference.sdf --baseline baseline.json --wheel "$(cat evaluation/wheel-path.txt)" --output profile.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: exposed-cod-phase-profile-${{ github.run_id }}
          path: profile.json
          if-no-files-found: warn
