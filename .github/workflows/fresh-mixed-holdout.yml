name: Fresh mixed-profile holdout evaluation

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/fresh-mixed-holdout.yml'

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        dataset: [cod, macrocycle]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Verify source tree and frozen inputs
        run: |
          git fetch --no-tags --depth=1 origin 29e37e169668903d6b01490c565b2f4a2cf63e5e
          test "$(git rev-parse 29e37e169668903d6b01490c565b2f4a2cf63e5e:crates)" = '3fbdec119699e5eb16610a6bd0ee282fa016770e'
          bash scripts/validation/fetch_mixed_holdout_inputs.sh '${{ matrix.os }}' '${{ matrix.dataset }}'
          python -m pip install 'rdkit==2026.9.2' 'numpy<3'
          python -m pip install --force-reinstall --no-deps "$(cat evaluation/wheel-path.txt)"
      - name: Audit identity and force-field support
        run: |
          python scripts/validation/cod_atom_identity_audit.py evaluation/reference/reference.sdf evaluation/reference/split.json --partition holdout --output identity.json
          python scripts/validation/cod_support_probe.py evaluation/reference/reference.sdf evaluation/reference/split.json --partition holdout --output support.json
          if [ '${{ matrix.dataset }}' = macrocycle ]; then
            python -c 'import json; x=json.load(open("identity.json")); assert x["summary"]=={"match":1243}; assert all(r.get("isotopic_formula_match",True) for r in x["results"])'
          fi
      - name: Seal fixed-count shard plan
        run: |
          python scripts/benchmarks/shard_platinum_holdout.py prepare --split evaluation/reference/split.json --audit evaluation/reference/audit.json --output-dir plan --shards 4 --wheel-sha256 "$(cat evaluation/wheel/candidate/wheel-sha256.txt)" --profile mixed_checked
          python -c 'import json; x=json.load(open("plan/manifest.json")); expected=2102 if "${{ matrix.dataset }}"=="cod" else 1243; assert sum(s["count"] for s in x["shards"])==expected'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fresh-plan-${{ matrix.dataset }}-${{ matrix.os }}-${{ github.run_id }}
          path: |
            plan/
            identity.json
            support.json
            evaluation/wheel/candidate/source-commit.txt
            evaluation/wheel/candidate/wheel-sha256.txt
          if-no-files-found: error

  fixed:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        os: [ubuntu-latest, macos-latest]
        dataset: [cod, macrocycle]
        shard: [0, 1, 2, 3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Restore inputs
        run: |
          git fetch --no-tags --depth=1 origin 29e37e169668903d6b01490c565b2f4a2cf63e5e
          test "$(git rev-parse 29e37e169668903d6b01490c565b2f4a2cf63e5e:crates)" = '3fbdec119699e5eb16610a6bd0ee282fa016770e'
          bash scripts/validation/fetch_mixed_holdout_inputs.sh '${{ matrix.os }}' '${{ matrix.dataset }}'
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name 'fresh-plan-${{ matrix.dataset }}-${{ matrix.os }}-${{ github.run_id }}' --dir parent
          python -m pip install 'rdkit==2026.9.2' 'numpy<3'
          python -m pip install --force-reinstall --no-deps "$(cat evaluation/wheel-path.txt)"
      - name: Score and verify fixed-count shard
        run: |
          index='${{ matrix.shard }}'
          suffix=$(printf '%03d' "$index")
          count=$(python -c 'import json,sys; print(json.load(open("parent/plan/manifest.json"))["shards"][int(sys.argv[1])]["count"])' "$index")
          python scripts/benchmarks/platinum_mixed_checked_development.py --sdf evaluation/reference/reference.sdf --split "parent/plan/split-$suffix.json" --invalid-exclusion-audit "parent/plan/audit-$suffix.json" --partition holdout --output result.json --limit "$count" --count 20 --seed 42 --profile corrected --geometry --repair-iters 400
          python scripts/benchmarks/shard_platinum_holdout.py seal --manifest parent/plan/manifest.json --index "$index" --wheel "$(cat evaluation/wheel-path.txt)" --audit "parent/plan/audit-$suffix.json" --result result.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: fresh-fixed-${{ matrix.dataset }}-${{ matrix.os }}-${{ matrix.shard }}-${{ github.run_id }}
          path: result.json
          if-no-files-found: warn

  fixed-merge:
    needs: fixed
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        dataset: [cod, macrocycle]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Restore verified shards
        run: |
          bash scripts/validation/fetch_mixed_holdout_inputs.sh '${{ matrix.os }}' '${{ matrix.dataset }}'
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name 'fresh-plan-${{ matrix.dataset }}-${{ matrix.os }}-${{ github.run_id }}' --dir parent
          for i in 0 1 2 3; do
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "fresh-fixed-${{ matrix.dataset }}-${{ matrix.os }}-$i-${{ github.run_id }}" --dir "part-$i"
          done
          python -m pip install 'rdkit==2026.9.2' 'numpy<3'
      - name: Merge, summarize and prepare timed shards
        run: |
          python scripts/benchmarks/shard_platinum_holdout.py merge --manifest parent/plan/manifest.json --output fixed.json part-0/result.json part-1/result.json part-2/result.json part-3/result.json
          python scripts/benchmarks/summarize_platinum_holdout.py fixed.json evaluation/reference/split.json --output fixed-summary.json
          python scripts/benchmarks/summarize_platinum_stereo_strict.py fixed.json --output fixed-stereo.json
          python scripts/benchmarks/shard_platinum_time.py prepare --fixed-manifest parent/plan/manifest.json --baseline fixed.json --output-dir timed-plan
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fresh-fixed-merged-${{ matrix.dataset }}-${{ matrix.os }}-${{ github.run_id }}
          path: |
            fixed.json
            fixed-summary.json
            fixed-stereo.json
            timed-plan/
          if-no-files-found: error

  timed:
    needs: fixed-merge
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        os: [ubuntu-latest, macos-latest]
        dataset: [cod, macrocycle]
        shard: [0, 1, 2, 3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Restore timed inputs
        run: |
          bash scripts/validation/fetch_mixed_holdout_inputs.sh '${{ matrix.os }}' '${{ matrix.dataset }}'
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name 'fresh-fixed-merged-${{ matrix.dataset }}-${{ matrix.os }}-${{ github.run_id }}' --dir parent
          python -m pip install 'rdkit==2026.9.2' 'numpy<3'
          python -m pip install --force-reinstall --no-deps "$(cat evaluation/wheel-path.txt)"
      - name: Score and verify timed shard
        run: |
          index='${{ matrix.shard }}'
          suffix=$(printf '%03d' "$index")
          count=$(python -c 'import json,sys; print(json.load(open("parent/timed-plan/manifest.json"))["shards"][int(sys.argv[1])]["count"])' "$index")
          python scripts/benchmarks/platinum_time_mixed_strict.py --sdf evaluation/reference/reference.sdf --baseline "parent/timed-plan/baseline-$suffix.json" --output result.json --limit "$count" --seconds 0.2 --max-candidates 20 --geometry --repair-iters 400
          python scripts/benchmarks/shard_platinum_time.py seal --manifest parent/timed-plan/manifest.json --index "$index" --wheel "$(cat evaluation/wheel-path.txt)" --baseline "parent/timed-plan/baseline-$suffix.json" --result result.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: fresh-timed-${{ matrix.dataset }}-${{ matrix.os }}-${{ matrix.shard }}-${{ github.run_id }}
          path: result.json
          if-no-files-found: warn

  timed-merge:
    needs: timed
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        dataset: [cod, macrocycle]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Restore and merge timed results
        run: |
          bash scripts/validation/fetch_mixed_holdout_inputs.sh '${{ matrix.os }}' '${{ matrix.dataset }}'
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name 'fresh-fixed-merged-${{ matrix.dataset }}-${{ matrix.os }}-${{ github.run_id }}' --dir parent
          for i in 0 1 2 3; do
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "fresh-timed-${{ matrix.dataset }}-${{ matrix.os }}-$i-${{ github.run_id }}" --dir "part-$i"
          done
          python -m pip install 'rdkit==2026.9.2' 'numpy<3'
          python scripts/benchmarks/shard_platinum_time.py merge --manifest parent/timed-plan/manifest.json --output timed.json part-0/result.json part-1/result.json part-2/result.json part-3/result.json
          python scripts/benchmarks/summarize_platinum_time_holdout.py timed.json evaluation/reference/split.json --output timed-summary.json
          python scripts/benchmarks/summarize_platinum_stereo_strict.py timed.json --output timed-stereo.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fresh-timed-merged-${{ matrix.dataset }}-${{ matrix.os }}-${{ github.run_id }}
          path: |
            timed.json
            timed-summary.json
            timed-stereo.json
          if-no-files-found: error
