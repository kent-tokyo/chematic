name: Published browser replication

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/published-browser-replication.yml'
      - 'scripts/bench_browser_wasm_vs_rdkit_isolated.py'
      - 'scripts/check_published_browser_paired.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install pinned browser runtime
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          python3 -m pip install 'playwright==1.58.0'
          python3 -m playwright install --with-deps "$BROWSER"

      - name: Fetch and verify published packages
        run: |
          mkdir -p /tmp/chematic-published /tmp/chematic-package
          npm pack '@kent-tokyo/chematic@1.0.30' --pack-destination /tmp/chematic-package --ignore-scripts
          echo 'fd427a161c11b14e6cca51e78e0c35ff05bbc52faf0539a2ddc2b7090e534201  /tmp/chematic-package/kent-tokyo-chematic-1.0.30.tgz' | sha256sum -c -
          tar -xzf /tmp/chematic-package/kent-tokyo-chematic-1.0.30.tgz -C /tmp/chematic-published
          npm install --prefix /tmp/rdkit '@rdkit/rdkit@2026.3.6' --ignore-scripts
          echo 'e0a505c33a282724114e279201dae199b2e5dbe68c35c0ebaa474693a6eb4ae6  /tmp/chematic-published/package/chematic_wasm_bg.wasm' | sha256sum -c -
          echo '4ca57d6e9b9c8cc703d854d0265550f5ef355d52c2bf56a1a7b8bfcc09f21eb4  /tmp/chematic-published/package/chematic_wasm.js' | sha256sum -c -
          echo 'f5981af4cf5bdcef861ffdf7410330bf9887f1195e39fbf9901b3a2f134ace2e  /tmp/rdkit/node_modules/@rdkit/rdkit/dist/RDKit_minimal.wasm' | sha256sum -c -
          echo '25ea1529b8eeb106ac1f3acb7c5d338a90533248c6223614574fefd14fee772f  /tmp/rdkit/node_modules/@rdkit/rdkit/dist/RDKit_minimal.js' | sha256sum -c -

      - name: Measure 20 alternating published-artifact blocks
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          browser_arg=()
          if [ "$BROWSER" = chromium ]; then
            browser_bin="$(python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
            browser_arg=(--browser "$browser_bin")
          fi
          python3 scripts/bench_browser_wasm_vs_rdkit_isolated.py \
            --rdkit-package /tmp/rdkit/node_modules/@rdkit/rdkit \
            --schematic-dir /tmp/chematic-published/package \
            --schematic-tarball /tmp/chematic-package/kent-tokyo-chematic-1.0.30.tgz \
            --corpus scripts/descriptor_census_corpus.smi --rows 250 --warmup 20 \
            --repetitions 20 --batch-timing --prepared-mode split \
            --engine "$BROWSER" "${browser_arg[@]}" \
            --output "/tmp/published-browser-$BROWSER.json"
          python3 scripts/check_published_browser_paired.py \
            --input "/tmp/published-browser-$BROWSER.json" \
            --output "/tmp/published-browser-$BROWSER-summary.json"
          for operation in direct prepared; do
            python3 scripts/check_browser_rdkit_ecfp4_parity.py \
              --rdkit-package /tmp/rdkit/node_modules/@rdkit/rdkit \
              --schematic-dir /tmp/chematic-published/package \
              --schematic-tarball /tmp/chematic-package/kent-tokyo-chematic-1.0.30.tgz \
              --corpus scripts/descriptor_census_corpus.smi --rows 250 \
              --schematic-operation "$operation" \
              --engine "$BROWSER" "${browser_arg[@]}" \
              --output "/tmp/published-browser-$BROWSER-row-$operation.json"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: published-browser-${{ matrix.browser }}
          path: |
            /tmp/published-browser-${{ matrix.browser }}.json
            /tmp/published-browser-${{ matrix.browser }}-summary.json
            /tmp/published-browser-${{ matrix.browser }}-row-direct.json
            /tmp/published-browser-${{ matrix.browser }}-row-prepared.json
