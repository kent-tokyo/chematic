name: Revised 3D parity holdouts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/parity-holdout.yml'

permissions:
  contents: read
  actions: read

jobs:
  holdout:
    strategy:
      fail-fast: false
      matrix:
        dataset: [complete, prime]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Verify frozen source and download exact wheel
        run: |
          test "$(git rev-parse HEAD:crates)" = '99a9d44e7ddbe3ba8a1d797c8bd3baa5938272c1'
          test "$(git rev-parse HEAD:scripts/benchmarks)" = '00a8c3615c849288c7d31f718a502bbd40da4fdc'
          gh run download 44927371343 --repo "$GITHUB_REPOSITORY" --name parity-candidate-ubuntu-latest-ac055be0c0262b32bfe52f7a9dd1cb3607cd1919 --dir candidate
          python -c 'import glob,hashlib,pathlib; p=glob.glob("candidate/**/*.whl",recursive=True); assert len(p)==1; h=hashlib.sha256(pathlib.Path(p[0]).read_bytes()).hexdigest(); assert h=="046fd444e4131fbc5fabc4c1d14f5c9fe64b6525f42158abc961496f741a7898"; print(h,p[0])'
          python -m pip install 'rdkit==2026.9.2' 'numpy<3'
          python -m pip install --force-reinstall --no-deps candidate/dist/candidate-wheel/*.whl
      - name: Fetch and verify reference structures
        env:
          DATASET: ${{ matrix.dataset }}
        run: |
          if [ "$DATASET" = complete ]; then
            curl --fail --location --retry 3 --max-time 120 --output input.zip https://comp3d.univie.ac.at/fileadmin/user_upload/p_comp3d/datasets/platinum-dataset-2017-01-sdf.zip
            echo '4370821a41ac452145dc97ec20e442b6d3ea838d4f923607aec00c94e47030ee  input.zip' | sha256sum --check
            unzip -p input.zip platinum_dataset_2017_01.sdf > input.sdf
            echo '715fa18108340f31f09c68f62a9484970b49c78653cbf950dbc411e3ab1b53d8  input.sdf' | sha256sum --check
            echo 'SPLIT=validation/results/platinum-complete-scaffold-split-2026-11-22.json' >> "$GITHUB_ENV"
            echo 'AUDIT=validation/results/platinum-complete-invalid-exclusion-audit-2026-11-22.json' >> "$GITHUB_ENV"
            echo 'COUNT=430' >> "$GITHUB_ENV"
            echo 'SECONDS=0.2' >> "$GITHUB_ENV"
          else
            curl --fail --location --retry 3 --max-time 120 --output input.tar.gz https://zenodo.org/records/8137603/files/benchmarking_datasets_and_code.tar.gz
            echo '30a5218e80e442a7e5f9129433d307b7b11dd569930d33244fd9fbd26fbf173b  input.tar.gz' | sha256sum --check
            tar -xOf input.tar.gz benchmarking_datasets_and_code/datasets/prime_dataset.sdf > input.sdf
            echo '28fc27d7bd33c7df5ab4ff63acb320cd5216ae91262d1288cd1fe18a045adbdb  input.sdf' | sha256sum --check
            echo 'SPLIT=validation/results/prime-scaffold-split-2026-11-22.json' >> "$GITHUB_ENV"
            echo 'AUDIT=validation/results/prime-invalid-exclusion-graph-audit-2026-11-22.json' >> "$GITHUB_ENV"
            echo 'COUNT=188' >> "$GITHUB_ENV"
            echo 'SECONDS=2.0' >> "$GITHUB_ENV"
          fi
      - name: Measure fixed candidates
        run: |
          python scripts/benchmarks/platinum_development_probe.py --sdf input.sdf --split "$SPLIT" --invalid-exclusion-audit "$AUDIT" --partition holdout --output holdout-fixed.json --limit "$COUNT" --count 20 --seed 42 --profile corrected --geometry --repair-iters 400
          python scripts/benchmarks/summarize_platinum_holdout.py holdout-fixed.json "$SPLIT" --output holdout-fixed-summary.json
      - name: Measure equal-time candidates
        run: |
          python scripts/benchmarks/platinum_time_budget.py --sdf input.sdf --baseline holdout-fixed.json --output holdout-time.json --limit "$COUNT" --seconds "$SECONDS" --max-candidates 20 --geometry --repair-iters 400
          python scripts/benchmarks/summarize_platinum_time_budget.py holdout-time.json --output holdout-time-summary.json
          python scripts/benchmarks/summarize_platinum_time_holdout.py holdout-time.json "$SPLIT" --output holdout-time-cluster.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: revised-holdout-${{ matrix.dataset }}-${{ github.sha }}
          path: |
            candidate/candidate-source-commit.txt
            candidate/candidate-wheel.sha256
            holdout-*.json
          if-no-files-found: warn
