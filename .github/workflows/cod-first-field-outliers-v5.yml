name: COD exposed force-field outliers on v5
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/cod-first-field-outliers-v5.yml'
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install fixed candidate and check exposed inputs
        run: |
          test "$(git rev-parse HEAD:crates)" = 'ebe322bf287fd58e9731bee836f682b19efd7a7e'
          test "$(git rev-parse HEAD:scripts/benchmarks)" = '00a8c3615c849288c7d31f718a502bbd40da4fdc'
          gh run download 44965786491 --repo "$GITHUB_REPOSITORY" --name parity-candidate-v5-ubuntu-latest-acc79a611d5c3bac571a7b1a6f274700b20f534e --dir candidate
          python -c 'import glob,hashlib,pathlib; h=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest(); w=glob.glob("candidate/**/*.whl",recursive=True); assert len(w)==1 and h(w[0])=="e113e7f74b6e5018a03913836824c203d2366e34189264c0d85291fbd663b7b3"; assert h("validation/results/cod-first-field-outliers-development-2026-11-22.json")=="5d21b0a84649b8a266c41524ed9a2083041db3e866123547aec4db5b6b3f5659"'
          python -m pip install 'rdkit==2026.9.2' 'numpy<3'
          python -m pip install --force-reinstall --no-deps candidate/dist/candidate-wheel/*.whl
      - name: Compare exposed inputs on common coordinates
        run: |
          python scripts/benchmarks/platinum_force_fields.py --development validation/results/cod-first-field-outliers-development-2026-11-22.json --output cod-first-fields-v5.json
          python scripts/benchmarks/summarize_platinum_force_fields.py cod-first-fields-v5.json --output cod-first-fields-v5-summary.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: cod-first-fields-v5-${{ github.sha }}
          path: cod-first-fields-v5*.json
          if-no-files-found: warn
