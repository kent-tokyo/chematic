name: Near-linear second COD force-field diagnostic
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/near-linear-second-cod-development.yml'
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            wheel_sha: 8305fd27765c4d10670fa2a0900f3b86b286d35a711f3f2eecb5c412f96613ac
          - os: macos-latest
            wheel_sha: b37bfac64e9ce9550eea1e36eb0e7554294b71f7e9efb22be470da44a5ef9608
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      WHEEL_SHA: ${{ matrix.wheel_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install the frozen v8 wheel
        run: |
          gh run download 44971533548 --repo "$GITHUB_REPOSITORY" --name 'parity-candidate-v8-${{ matrix.os }}-98a270e4ba39c7f7db61a0e1980bfa29fd55f615' --dir candidate
          python -c 'import glob,hashlib,os,pathlib; w=glob.glob("candidate/**/*.whl",recursive=True); assert len(w)==1 and hashlib.sha256(pathlib.Path(w[0]).read_bytes()).hexdigest()==os.environ["WHEEL_SHA"]'
          python -m pip install 'rdkit==2026.9.2' 'numpy<3'
          python -m pip install --force-reinstall --no-deps candidate/dist/candidate-wheel/*.whl
      - name: Compare gradients and step sizes
        run: python scripts/validation/near_linear_second_cod_diagnostic.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: near-linear-second-cod-${{ matrix.os }}-${{ github.sha }}
          path: near-linear-second-cod.json
          if-no-files-found: warn
