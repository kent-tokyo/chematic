name: Freeze aromaticity candidate wheels

on:
  pull_request:
    types: [opened, reopened]
    paths:
      - '.github/workflows/parity-candidate-wheel-v10.yml'

permissions:
  contents: read

jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 6fae31e8341a11913a20e46f740105044a6a5b59
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Build and fingerprint candidate
        run: |
          test "$(git rev-parse HEAD:crates)" = '8ef777effd70e7ac74d51737df6a3704ec618777'
          python -m pip install 'maturin==1.13.3'
          git rev-parse HEAD > candidate-source-commit.txt
          uname -a > candidate-platform.txt
          maturin build --locked --release -m crates/chematic-py/Cargo.toml --interpreter python --out dist/candidate-wheel
          python -c 'import glob,hashlib,pathlib; p=glob.glob("dist/candidate-wheel/*.whl"); assert len(p)==1; f=pathlib.Path(p[0]); pathlib.Path("candidate-wheel.sha256").write_text(hashlib.sha256(f.read_bytes()).hexdigest()+"  "+f.name+"\n")'
      - name: Upload exact wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: parity-candidate-v10-${{ matrix.os }}-${{ github.sha }}
          path: |
            candidate-source-commit.txt
            candidate-platform.txt
            candidate-wheel.sha256
            dist/candidate-wheel/*.whl
          if-no-files-found: error
