name: Stereo candidate COD holdout comparison

on:
  pull_request:
    types: [opened, reopened]
    paths:
      - '.github/workflows/cod-holdout-v4.yml'

permissions:
  contents: read
  actions: read

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: parity-candidate-v4-ubuntu-latest-e4efaf29afd6bfa3689d1187dfc391343d7ceac0
            wheel_sha: e0f95eb569e14a5f69df04b566acbe0e86b86832afa18da079eedff6a3e82a78
          - os: macos-latest
            artifact: parity-candidate-v4-macos-latest-e4efaf29afd6bfa3689d1187dfc391343d7ceac0
            wheel_sha: 1a952db5bd458a4072df4b92f617b818d45373be2a000d6cfd9aafe7bf771001
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      PARITY_ARTIFACT: ${{ matrix.artifact }}
      PARITY_WHEEL_SHA: ${{ matrix.wheel_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Verify and install frozen inputs
        run: |
          test "$(git rev-parse HEAD:crates)" = 'c953928e32e912a94b5bd4462c9b49e31f5461c8'
          test "$(git rev-parse HEAD:scripts/benchmarks)" = '00a8c3615c849288c7d31f718a502bbd40da4fdc'
          gh run download 44958776980 --repo "$GITHUB_REPOSITORY" --name "$PARITY_ARTIFACT" --dir candidate
          gh run download 44930127544 --repo "$GITHUB_REPOSITORY" --name cod-reference-sample-914f4df10743b1d484d0be76974ba256985822a4 --dir reference
          python -c 'import glob,hashlib,os,pathlib; p=glob.glob("candidate/**/*.whl",recursive=True); assert len(p)==1; assert hashlib.sha256(pathlib.Path(p[0]).read_bytes()).hexdigest()==os.environ["PARITY_WHEEL_SHA"]; assert hashlib.sha256(pathlib.Path("reference/cod-sample.sdf").read_bytes()).hexdigest()=="6ad24cf292a62561e55d3556395b841440f9d0d8588c7f2b85c8fb7e4675af74"'
          python -m pip install 'rdkit==2026.9.2' 'numpy<3'
          python -m pip install --force-reinstall --no-deps candidate/dist/candidate-wheel/*.whl
          gzip -dc validation/results/cod-round2-scaffold-split-2026-11-22.json.gz > cod-split.json
          python -c 'import hashlib,pathlib; assert hashlib.sha256(pathlib.Path("cod-split.json").read_bytes()).hexdigest()=="b12af9cb05683735ab8fad725dcf38e0f8e8f51bdef8e4aa3db22e87590109c3"'
          python -c 'import hashlib,pathlib; x={"scripts/validation/cod_atom_identity_audit.py":"3c28cae85c13e139c749465ad222f00b6ce75786bbd99a0bcfc3ee6298c162a7", "scripts/validation/cod_support_probe.py":"606d5d3f8b2a8cb17a3fe5534f9a1b9f09257eb4e8a9ae16c32e41fc7d474dcc", "scripts/validation/cod_eligible_split.py":"d2825bd9951a939333bf5f8ad926883f2801318f1b66ba68b28c68634d757d15", "validation/results/cod-round2-invalid-exclusion-audit-2026-11-22.json":"378660b452dbf1c9a6f169315f15cd69a738b4e7077357879163a3cee2a24960"}; assert all(hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()==v for p,v in x.items())'
      - name: Audit all input identities and support
        run: |
          python scripts/validation/cod_atom_identity_audit.py reference/cod-sample.sdf cod-split.json --partition holdout --output cod-identity.json
          python -c 'import json; x=json.load(open("cod-identity.json")); assert x["summary"]=={"match": 2288}; assert all(r.get("isotopic_formula_match",True) for r in x["results"])'
          python scripts/validation/cod_support_probe.py reference/cod-sample.sdf cod-split.json --partition holdout --output cod-support.json
          python scripts/validation/cod_eligible_split.py cod-split.json validation/results/cod-round2-invalid-exclusion-audit-2026-11-22.json cod-support.json --output-split eligible-split.json --output-audit eligible-audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: cod-stereo-parent-${{ matrix.os }}-${{ github.sha }}
          path: |
            cod-identity.json
            cod-support.json
            eligible-split.json
            eligible-audit.json
          if-no-files-found: warn

  score:
    needs: audit
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard: [0, 1, 2, 3]
        include:
          - os: ubuntu-latest
            artifact: parity-candidate-v4-ubuntu-latest-e4efaf29afd6bfa3689d1187dfc391343d7ceac0
            wheel_sha: e0f95eb569e14a5f69df04b566acbe0e86b86832afa18da079eedff6a3e82a78
          - os: macos-latest
            artifact: parity-candidate-v4-macos-latest-e4efaf29afd6bfa3689d1187dfc391343d7ceac0
            wheel_sha: 1a952db5bd458a4072df4b92f617b818d45373be2a000d6cfd9aafe7bf771001
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      PARITY_ARTIFACT: ${{ matrix.artifact }}
      PARITY_WHEEL_SHA: ${{ matrix.wheel_sha }}
      PARITY_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Restore and verify frozen candidate and audited domain
        run: |
          test "$(git rev-parse HEAD:crates)" = 'c953928e32e912a94b5bd4462c9b49e31f5461c8'
          test "$(git rev-parse HEAD:scripts/benchmarks)" = '00a8c3615c849288c7d31f718a502bbd40da4fdc'
          gh run download 44958776980 --repo "$GITHUB_REPOSITORY" --name "$PARITY_ARTIFACT" --dir candidate
          gh run download 44930127544 --repo "$GITHUB_REPOSITORY" --name cod-reference-sample-914f4df10743b1d484d0be76974ba256985822a4 --dir reference
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "cod-stereo-parent-${{ matrix.os }}-${{ github.sha }}" --dir parent
          python -c 'import glob,hashlib,os,pathlib; p=glob.glob("candidate/**/*.whl",recursive=True); assert len(p)==1; assert hashlib.sha256(pathlib.Path(p[0]).read_bytes()).hexdigest()==os.environ["PARITY_WHEEL_SHA"]; assert hashlib.sha256(pathlib.Path("reference/cod-sample.sdf").read_bytes()).hexdigest()=="6ad24cf292a62561e55d3556395b841440f9d0d8588c7f2b85c8fb7e4675af74"; assert hashlib.sha256(pathlib.Path("scripts/validation/cod_holdout_shards.py").read_bytes()).hexdigest()=="b4687e441cde90d9ff3f68230009ac53bae6de66fde1d43224db9a6473730f02"'
          python -m pip install 'rdkit==2026.9.2' 'numpy<3'
          python -m pip install --force-reinstall --no-deps candidate/dist/candidate-wheel/*.whl
          python scripts/validation/cod_holdout_shards.py parent/eligible-split.json parent/eligible-audit.json --shards 4 --output-dir shard
          python -c 'import json,os; n=json.load(open("shard/split-{}.json".format(os.environ["PARITY_SHARD"])))["sharding"]["holdout_records"]; open(os.environ["GITHUB_ENV"],"a").write(f"PARITY_SAMPLE_COUNT={n}\n")'
          python -c 'import json,platform; print(json.dumps({"platform":platform.platform(),"machine":platform.machine(),"processor":platform.processor(),"uname":list(platform.uname())}))' > host.json
      - name: Compare fixed and equal-time candidates
        run: |
          python scripts/benchmarks/platinum_development_probe.py --sdf reference/cod-sample.sdf --split "shard/split-$PARITY_SHARD.json" --invalid-exclusion-audit "shard/audit-$PARITY_SHARD.json" --partition holdout --output "fixed-$PARITY_SHARD.json" --limit "$PARITY_SAMPLE_COUNT" --count 20 --seed 42 --profile corrected --geometry --repair-iters 400
          python scripts/benchmarks/platinum_time_budget.py --sdf reference/cod-sample.sdf --baseline "fixed-$PARITY_SHARD.json" --output "time-$PARITY_SHARD.json" --limit "$PARITY_SAMPLE_COUNT" --seconds 0.2 --max-candidates 20 --geometry --repair-iters 400
          python scripts/benchmarks/summarize_platinum_probe.py "fixed-$PARITY_SHARD.json" --output "fixed-summary-$PARITY_SHARD.json"
          python scripts/benchmarks/summarize_platinum_time_budget.py "time-$PARITY_SHARD.json" --output "time-summary-$PARITY_SHARD.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: cod-stereo-shard-${{ matrix.os }}-${{ matrix.shard }}-${{ github.sha }}
          path: |
            shard/split-${{ matrix.shard }}.json
            shard/audit-${{ matrix.shard }}.json
            fixed-${{ matrix.shard }}.json
            time-${{ matrix.shard }}.json
            fixed-summary-${{ matrix.shard }}.json
            time-summary-${{ matrix.shard }}.json
            host.json
          if-no-files-found: warn

  aggregate:
    needs: [audit, score]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: parity-candidate-v4-ubuntu-latest-e4efaf29afd6bfa3689d1187dfc391343d7ceac0
            wheel_sha: e0f95eb569e14a5f69df04b566acbe0e86b86832afa18da079eedff6a3e82a78
          - os: macos-latest
            artifact: parity-candidate-v4-macos-latest-e4efaf29afd6bfa3689d1187dfc391343d7ceac0
            wheel_sha: 1a952db5bd458a4072df4b92f617b818d45373be2a000d6cfd9aafe7bf771001
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      PARITY_ARTIFACT: ${{ matrix.artifact }}
      PARITY_WHEEL_SHA: ${{ matrix.wheel_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Restore and verify all results
        run: |
          test "$(git rev-parse HEAD:crates)" = 'c953928e32e912a94b5bd4462c9b49e31f5461c8'
          test "$(git rev-parse HEAD:scripts/benchmarks)" = '00a8c3615c849288c7d31f718a502bbd40da4fdc'
          gh run download 44958776980 --repo "$GITHUB_REPOSITORY" --name "$PARITY_ARTIFACT" --dir candidate
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "cod-stereo-parent-${{ matrix.os }}-${{ github.sha }}" --dir parent
          mkdir shards
          for part in 0 1 2 3; do
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "cod-stereo-shard-${{ matrix.os }}-$part-${{ github.sha }}" --dir "piece-$part"
            cp "piece-$part/shard/split-$part.json" "shards/split-$part.json"
            cp "piece-$part/fixed-$part.json" "shards/fixed-$part.json"
            cp "piece-$part/time-$part.json" "shards/time-$part.json"
          done
          python -c 'import glob,hashlib,os,pathlib; p=glob.glob("candidate/**/*.whl",recursive=True); assert len(p)==1; assert hashlib.sha256(pathlib.Path(p[0]).read_bytes()).hexdigest()==os.environ["PARITY_WHEEL_SHA"]; assert hashlib.sha256(pathlib.Path("scripts/validation/merge_cod_holdout_shards.py").read_bytes()).hexdigest()=="ab0cbf9b1580b123910004800dbb45cd3b9db898efc55316649bc1e585eaea61"'
          python -m pip install 'rdkit==2026.9.2' 'numpy<3'
          python -m pip install --force-reinstall --no-deps candidate/dist/candidate-wheel/*.whl
      - name: Merge and summarize complete holdout
        run: |
          python scripts/validation/merge_cod_holdout_shards.py parent/eligible-split.json --kind fixed --shards-dir shards --shards 4 --output cod-holdout-fixed.json
          python scripts/validation/merge_cod_holdout_shards.py parent/eligible-split.json --kind time --shards-dir shards --shards 4 --output cod-holdout-time.json
          python scripts/benchmarks/summarize_platinum_holdout.py cod-holdout-fixed.json parent/eligible-split.json --output cod-holdout-fixed-summary.json
          python scripts/benchmarks/summarize_platinum_probe.py cod-holdout-fixed.json --output cod-holdout-stereo-summary.json
          python scripts/benchmarks/summarize_platinum_time_budget.py cod-holdout-time.json --output cod-holdout-time-summary.json
          python scripts/benchmarks/summarize_platinum_time_holdout.py cod-holdout-time.json parent/eligible-split.json --output cod-holdout-time-cluster.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: cod-stereo-holdout-${{ matrix.os }}-${{ github.sha }}
          path: |
            cod-holdout*.json
            piece-*/host.json
          if-no-files-found: warn

  fields:
    needs: aggregate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: parity-candidate-v4-ubuntu-latest-e4efaf29afd6bfa3689d1187dfc391343d7ceac0
            wheel_sha: e0f95eb569e14a5f69df04b566acbe0e86b86832afa18da079eedff6a3e82a78
          - os: macos-latest
            artifact: parity-candidate-v4-macos-latest-e4efaf29afd6bfa3689d1187dfc391343d7ceac0
            wheel_sha: 1a952db5bd458a4072df4b92f617b818d45373be2a000d6cfd9aafe7bf771001
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      PARITY_ARTIFACT: ${{ matrix.artifact }}
      PARITY_WHEEL_SHA: ${{ matrix.wheel_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Restore frozen wheel and complete fixed results
        run: |
          test "$(git rev-parse HEAD:crates)" = 'c953928e32e912a94b5bd4462c9b49e31f5461c8'
          test "$(git rev-parse HEAD:scripts/benchmarks)" = '00a8c3615c849288c7d31f718a502bbd40da4fdc'
          gh run download 44958776980 --repo "$GITHUB_REPOSITORY" --name "$PARITY_ARTIFACT" --dir candidate
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "cod-stereo-holdout-${{ matrix.os }}-${{ github.sha }}" --dir holdout
          python -c 'import glob,hashlib,os,pathlib; p=glob.glob("candidate/**/*.whl",recursive=True); assert len(p)==1; assert hashlib.sha256(pathlib.Path(p[0]).read_bytes()).hexdigest()==os.environ["PARITY_WHEEL_SHA"]'
          python -m pip install 'rdkit==2026.9.2' 'numpy<3'
          python -m pip install --force-reinstall --no-deps candidate/dist/candidate-wheel/*.whl
      - name: Compare force fields on common coordinates
        run: |
          python scripts/benchmarks/platinum_force_fields.py --development holdout/cod-holdout-fixed.json --output cod-holdout-fields.json --checkpoint-every 50
          python scripts/benchmarks/summarize_platinum_force_fields.py cod-holdout-fields.json --output cod-holdout-fields-summary.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: cod-stereo-fields-${{ matrix.os }}-${{ github.sha }}
          path: cod-holdout-fields*.json
          if-no-files-found: warn
