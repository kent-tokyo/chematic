name: PDB macrocycle development 100-candidate comparison

on:
  pull_request:
    types: [opened, reopened]
    paths:
      - '.github/workflows/macrocycle-pdb-development-100.yml'

permissions:
  contents: read
  actions: read

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Fetch and verify frozen wheel and structural sample
        run: |
          echo 'eecbf2c8a12d9cfb75daac79ebde3a2504f87f0b267e7a196737951f6c73f9a8  scripts/benchmarks/platinum_development_probe.py' | sha256sum --check
          echo '56d7c529f8499f7025aafae34c027f867a9fb2ba9877471774a285de3d19fc22  scripts/benchmarks/platinum_geometry.py' | sha256sum --check
          echo '0733b8add33eabb45dbb49eda3df7ab9d9e293af3a08cdab29037b172c2b606d  scripts/benchmarks/summarize_platinum_probe.py' | sha256sum --check
          gh run download 44984753739 --repo "$GITHUB_REPOSITORY" --name parity-candidate-v11-ubuntu-latest-54780e156da34198ed3ae0d76b5efe8b76d02ae2 --dir candidate
          python -c 'import glob,hashlib,pathlib; p=glob.glob("candidate/**/*.whl",recursive=True); assert len(p)==1; assert hashlib.sha256(pathlib.Path(p[0]).read_bytes()).hexdigest()=="0052c7ad06ce6fe92ddf919fc0e2a15869b7d683c530f794c62a052edf0d1603"'
          python -m pip install 'rdkit==2026.9.2' 'numpy<3'
          python -m pip install --force-reinstall --no-deps candidate/dist/candidate-wheel/*.whl
      - name: Fetch verified macrocycle references
        run: |
          gh run download 44955399937 --repo "$GITHUB_REPOSITORY" --name macrocycle-pdb-prepared-3b3a5f827788c39195ccc58608e854e6ab543557 --dir macrocycle
          echo '71bf05a54cd402146e8892acd88969ec52fd45d2a02c4194b7aa905fe900222d  macrocycle/macrocycle-prepared.sdf' | sha256sum --check
          echo 'ffb256b0a9dbc779a5c6b3dd2ac96deec6174dc25408dc1d0691efcef8c4c4ff  macrocycle/macrocycle-prepared-split.json' | sha256sum --check
      - name: Select the two exposed development mismatches
        run: |
          python -c 'import json,pathlib; p=pathlib.Path("macrocycle/macrocycle-prepared-split.json"); d=json.loads(p.read_text()); names={"8bi2__Ligand_peptide_QR7_A_701","6exq__Ligand_organic_C2W_B_303"}; found=[r for r in d["rows"] if r["name"] in names and r["split"]=="development"]; assert len(found)==2; [r.update(split="deferred_development") for r in d["rows"] if r["split"]=="development" and r["name"] not in names]; pathlib.Path("macrocycle-development-two.json").write_text(json.dumps(d)+"\n")'
          sha256sum macrocycle-development-two.json > macrocycle-development-two.sha256
      - name: Compare 100 candidates for two development references
        run: |
          set +e
          timeout --signal=TERM 100m python scripts/benchmarks/platinum_development_probe.py --sdf macrocycle/macrocycle-prepared.sdf --split macrocycle-development-two.json --output macrocycle-development-pilot.json --partition development --limit 2 --count 100 --seed 42 --profile corrected --geometry --repair-iters 400
          result=$?
          set -e
          printf 'probe_exit_code=%s\n' "$result" > macrocycle-development-pilot-status.txt
          if [ -f macrocycle-development-pilot.json ]; then
            python scripts/benchmarks/summarize_platinum_probe.py macrocycle-development-pilot.json --output macrocycle-development-pilot-summary.json
          fi
          exit "$result"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macrocycle-pdb-development-100-${{ github.sha }}
          path: |
            macrocycle-development-two.sha256
            macrocycle-development-pilot*.json
            macrocycle-development-pilot-status.txt
          if-no-files-found: warn
