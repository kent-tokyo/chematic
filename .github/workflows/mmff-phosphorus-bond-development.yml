name: MMFF phosphorus bond development regression
on:
  pull_request:
    types: [opened, reopened]
    paths:
      - '.github/workflows/mmff-phosphorus-bond-development.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Check MMFF typing and field regressions
        run: |
          cargo test --locked -p chematic-ff --lib phosphorus_type_75_single_bond_classification_matches_registry -- --nocapture
          cargo test --locked -p chematic-ff --lib one_neighbor_carbon_uses_rdkit_type_60 -- --nocapture
          cargo test --locked -p chematic-ff --lib mmff94_numeric_tests -- --nocapture
          cargo test --locked -p chematic-ff --lib uff_contract_tests -- --nocapture
          cargo test --locked -p chematic-ff --lib uff_boundary_contract_tests -- --nocapture
      - name: Build development wheel
        run: |
          python -m pip install 'maturin==1.13.3' 'rdkit==2026.9.2' 'numpy<3'
          git rev-parse HEAD > mmff-phosphorus-bond-source-commit.txt
          maturin build --locked --release -m crates/chematic-py/Cargo.toml --interpreter python --out dist/terminal-carbon
          python -m pip install --force-reinstall --no-deps dist/terminal-carbon/*.whl
      - name: Compare against RDKit
        run: |
          python scripts/validation/mmff_phosphaalkene_diagnostic.py
          python scripts/validation/mmff_terminal_carbon_diagnostic.py
          python scripts/validation/uff_inversion_diagnostic.py
          python scripts/validation/phosphoryl_candidate_diagnostic.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: mmff-phosphorus-bond-development-${{ github.sha }}
          path: |
            mmff-phosphorus-bond-source-commit.txt
            mmff-terminal-carbon-diagnostic.json
            mmff-phosphaalkene-diagnostic.json
            uff-inversion-diagnostic.json
            phosphoryl-candidate-diagnostic.json
          if-no-files-found: warn
