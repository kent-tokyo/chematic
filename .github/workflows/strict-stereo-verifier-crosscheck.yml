name: Strict stereo verifier crosscheck
on:
  pull_request:
    types: [opened, reopened]
    paths:
      - '.github/workflows/strict-stereo-verifier-crosscheck.yml'
permissions:
  contents: read
  actions: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            wheel_sha: 0052c7ad06ce6fe92ddf919fc0e2a15869b7d683c530f794c62a052edf0d1603
          - os: macos-latest
            wheel_sha: fa33b33382589fd46124131525e5efabc06150bca33eba7153a4f551c9d985d6
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PARITY_OS: ${{ matrix.os }}
      PARITY_WHEEL_SHA: ${{ matrix.wheel_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Verify source and install pinned candidate
        run: |
          python -c 'import hashlib,pathlib; p={"scripts/validation/compare_stereo_verifiers.py":"59de53b98c20add7e081fb51d45412410683c0de91a6fd084da507bc57785193","scripts/benchmarks/platinum_development_probe.py":"eecbf2c8a12d9cfb75daac79ebde3a2504f87f0b267e7a196737951f6c73f9a8","scripts/benchmarks/platinum_stereo_strict.py":"3b09595c02ede46bccb1aa8b45e62b3e038fcbb30cdb5a974ef8ef0f1acd0132","scripts/benchmarks/platinum_geometry.py":"56d7c529f8499f7025aafae34c027f867a9fb2ba9877471774a285de3d19fc22"}; assert all(hashlib.sha256(pathlib.Path(k).read_bytes()).hexdigest()==v for k,v in p.items())'
          gh run download 44984753739 --repo "$GITHUB_REPOSITORY" --name "parity-candidate-v11-$PARITY_OS-54780e156da34198ed3ae0d76b5efe8b76d02ae2" --dir candidate
          python -c 'import glob,hashlib,os,pathlib; p=glob.glob("candidate/**/*.whl",recursive=True); assert len(p)==1; assert hashlib.sha256(pathlib.Path(p[0]).read_bytes()).hexdigest()==os.environ["PARITY_WHEEL_SHA"]'
          python -m pip install 'rdkit==2026.9.2' 'numpy<3'
          python -m pip install --force-reinstall --no-deps candidate/dist/candidate-wheel/*.whl
      - name: Test and compare verifier behavior
        run: |
          python -m unittest scripts.validation.test_platinum_stereo_strict scripts.validation.test_audit_declared_stereo scripts.validation.test_shard_platinum_holdout scripts.validation.test_shard_platinum_time
          python scripts/validation/compare_stereo_verifiers.py validation/results/cod-linux-development-v11-corrected-2026-11-22.json.gz --output stereo-verifier-crosscheck.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: strict-verifier-crosscheck-${{ matrix.os }}-${{ github.sha }}
          path: stereo-verifier-crosscheck.json
          if-no-files-found: warn
