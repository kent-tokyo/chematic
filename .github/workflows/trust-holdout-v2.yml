name: Trust holdout v2

on:
  pull_request:
    paths:
      - '.github/workflows/trust-holdout-v2.yml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'scripts/validation/score_trust_holdouts.py'
      - 'validation/trust_holdouts/v2/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  score-linux-x86-64:
    name: Frozen v2 score (Linux x86-64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Build the frozen candidate wheel
        shell: bash
        run: |
          candidate="$(python -c 'import json; print(json.load(open("validation/trust_holdouts/v2/manifest.json"))["candidate_frozen_commit"])')"
          git worktree add --detach "$RUNNER_TEMP/candidate" "$candidate"
          python -m pip install 'maturin==1.13.3'
          mkdir -p "$RUNNER_TEMP/wheel"
          (
            cd "$RUNNER_TEMP/candidate"
            maturin build --locked --release --manifest-path crates/chematic-py/Cargo.toml \
              --interpreter python --out "$RUNNER_TEMP/wheel"
            git diff --quiet
          )
      - name: Install the exact wheel and pinned oracle
        shell: bash
        run: |
          wheel="$(find "$RUNNER_TEMP/wheel" -name '*.whl' -print -quit)"
          python -m pip install 'rdkit==2026.9.1' "$wheel"
      - name: Score every frozen row once
        shell: bash
        run: |
          candidate="$(python -c 'import json; print(json.load(open("validation/trust_holdouts/v2/manifest.json"))["candidate_frozen_commit"])')"
          wheel="$(find "$RUNNER_TEMP/wheel" -name '*.whl' -print -quit)"
          python scripts/validation/score_trust_holdouts.py \
            --holdout-version v2 \
            --candidate-commit "$candidate" \
            --wheel "$wheel" \
            --output "$RUNNER_TEMP/trust-holdout-v2-linux-x86-64.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trust-holdout-v2-linux-x86-64
          path: ${{ runner.temp }}/trust-holdout-v2-linux-x86-64.json
          retention-days: 90
