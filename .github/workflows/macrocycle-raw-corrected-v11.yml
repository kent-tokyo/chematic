name: Macrocycle corrected embedding diagnostic
on:
  pull_request:
    types: [opened, reopened]
    paths:
      - '.github/workflows/macrocycle-raw-corrected-v11.yml'
permissions:
  contents: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 22578e3829bfee7aaab03b4c1bd829e580c3a8fe
          path: candidate
      - name: Verify tested source and extract exposed development input
        run: |
          test "$(git -C candidate rev-parse HEAD:crates)" = 8ddeec5d8efd30ffe1e77a75e5abd1869ef48568
          python3 - <<'PY'
          import gzip,hashlib,json,pathlib
          script=pathlib.Path('scripts/validation/macrocycle_raw_corrected.rs')
          assert hashlib.sha256(script.read_bytes()).hexdigest() == 'bcce625bb330a3c35a42d426d1db525877b2bd14fd5a485f3fc2096710c98b28'
          raw=gzip.decompress(pathlib.Path('validation/results/macrocycle-pdb-linux-development-v11-2026-11-22.json.gz').read_bytes())
          assert hashlib.sha256(raw).hexdigest() == '821e4cbb342bbb94db5f4a44a62560d17001ead9e1a7f1190f0cb58ab3d14708'
          rows=[r for r in json.loads(raw)['results'] if r['name']=='5vk0__Ligand_phospholipids_ALA_L_4']
          assert len(rows)==1
          pathlib.Path('candidate/macrocycle-input.smi').write_text(rows[0]['smiles']+'\n')
          PY
          cp scripts/validation/macrocycle_raw_corrected.rs candidate/crates/chematic-3d/examples/macrocycle_raw_corrected.rs
      - name: Separate corrected embedding from stereo screening
        run: |
          set -o pipefail
          cargo run --manifest-path candidate/Cargo.toml --locked --release -p chematic-3d --example macrocycle_raw_corrected -- candidate/macrocycle-input.smi | tee macrocycle-raw-corrected.json
          python3 -c 'import json; d=json.load(open("macrocycle-raw-corrected.json")); assert d["atom_count"] == 208 and len(d["candidates"]) == d["raw_corrected_count"]'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: macrocycle-raw-corrected-v11-${{ matrix.os }}-${{ github.sha }}
          path: macrocycle-raw-corrected.json
          if-no-files-found: warn
