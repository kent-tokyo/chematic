name: COD independent-engine timed comparison

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/cod-isolated-timed-holdout.yml'

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Verify wheel and prepare audited population
        run: |
          bash scripts/validation/fetch_bridge_fix_holdout_inputs.sh '${{ matrix.os }}'
          python -m pip install 'rdkit==2026.9.2' 'numpy<3'
          python -m pip install --force-reinstall --no-deps "$(cat bridge-input/wheel-path.txt)"
          python -m unittest scripts.validation.test_prepare_direct_timed_holdout scripts.validation.test_shard_platinum_time scripts.validation.test_platinum_time_engine_isolation
          python scripts/benchmarks/prepare_force_field_holdout.py bridge-input/reference/reference.sdf bridge-input/split.json --output inputs.json
          python scripts/benchmarks/prepare_direct_timed_holdout.py --split bridge-input/split.json --audit bridge-input/audit.json --input inputs.json --output-dir timed-plan --shards 8 --wheel-sha256 "$(cat bridge-input/wheel-sha256.txt)"
          python -c 'import json; m=json.load(open("timed-plan/manifest.json")); assert sum(s["count"] for s in m["shards"]) == 3579'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: isolated-timed-plan-${{ matrix.os }}-${{ github.run_id }}
          path: |
            inputs.json
            timed-plan/
            bridge-input/wheel-sha256.txt
          if-no-files-found: error

  compare:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Restore pinned inputs
        run: |
          bash scripts/validation/fetch_bridge_fix_holdout_inputs.sh '${{ matrix.os }}'
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name 'isolated-timed-plan-${{ matrix.os }}-${{ github.run_id }}' --dir parent
          python -m pip install 'rdkit==2026.9.2' 'numpy<3'
          python -m pip install --force-reinstall --no-deps "$(cat bridge-input/wheel-path.txt)"
      - name: Score and seal
        run: |
          index='${{ matrix.shard }}'
          suffix=$(printf '%03d' "$index")
          count=$(python -c 'import json,sys; print(json.load(open("parent/timed-plan/manifest.json"))["shards"][int(sys.argv[1])]["count"])' "$index")
          python scripts/benchmarks/platinum_time_mixed_strict.py --sdf bridge-input/reference/reference.sdf --baseline "parent/timed-plan/baseline-$suffix.json" --output result.json --limit "$count" --seconds 0.2 --max-candidates 20 --geometry --repair-iters 400
          python scripts/benchmarks/shard_platinum_time.py seal --manifest parent/timed-plan/manifest.json --index "$index" --wheel "$(cat bridge-input/wheel-path.txt)" --baseline "parent/timed-plan/baseline-$suffix.json" --result result.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: isolated-timed-${{ matrix.os }}-${{ matrix.shard }}-${{ github.run_id }}
          path: result.json
          if-no-files-found: warn

  merge:
    needs: compare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Verify and summarize all timed shards
        run: |
          bash scripts/validation/fetch_bridge_fix_holdout_inputs.sh '${{ matrix.os }}'
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name 'isolated-timed-plan-${{ matrix.os }}-${{ github.run_id }}' --dir parent
          for i in 0 1 2 3 4 5 6 7; do gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "isolated-timed-${{ matrix.os }}-$i-$GITHUB_RUN_ID" --dir "part-$i"; done
          python -m pip install 'rdkit==2026.9.2' 'numpy<3'
          python scripts/benchmarks/shard_platinum_time.py merge --manifest parent/timed-plan/manifest.json --output timed.json part-{0,1,2,3,4,5,6,7}/result.json
          python scripts/benchmarks/summarize_platinum_time_holdout.py timed.json bridge-input/split.json --output timed-summary.json
          python scripts/benchmarks/summarize_platinum_stereo_strict.py timed.json --output timed-stereo.json
          python scripts/benchmarks/summarize_platinum_timing_details.py timed.json --output timed-details.json
          python scripts/benchmarks/summarize_platinum_time_budget.py timed.json --output timed-engine-summary.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: isolated-timed-merged-${{ matrix.os }}-${{ github.run_id }}
          path: |
            timed.json
            timed-summary.json
            timed-stereo.json
            timed-details.json
            timed-engine-summary.json
          if-no-files-found: error
