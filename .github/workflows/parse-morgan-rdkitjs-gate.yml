name: Parse + Morgan RDKit.js Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'crates/chematic-fp/**'
      - 'crates/chematic-perception/**'
      - 'crates/chematic-wasm/**'
      - 'scripts/bench_browser_wasm_vs_rdkit_isolated.py'
      - 'scripts/check_parse_morgan_rdkit_speed_gate.py'
      - '.github/workflows/parse-morgan-rdkitjs-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rdkitjs-gate:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'performance')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install wasm-pack and Playwright browser
        run: |
          cargo install wasm-pack --locked
          python3 -m pip install 'playwright==1.55.0'
          python3 -m playwright install --with-deps "${{ matrix.browser }}"

      - name: Build candidate and install pinned official RDKit.js
        run: |
          wasm-pack build crates/chematic-wasm --target web --out-dir /tmp/chematic-wasm --release
          npm install --prefix /tmp/rdkit '@rdkit/rdkit@2026.3.6' --ignore-scripts

      - name: Measure equivalent Parse + Morgan operation
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          browser_arg=()
          if [ "$BROWSER" = chromium ]; then
            chromium_bin="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux/chrome' -print -quit)"
            test -n "$chromium_bin"
            browser_arg=(--browser "$chromium_bin")
          fi
          python3 scripts/bench_browser_wasm_vs_rdkit_isolated.py \
            --rdkit-package /tmp/rdkit/node_modules/@rdkit/rdkit \
            --schematic-dir /tmp/chematic-wasm \
            --corpus validation/benchmark_corpora/rdkit-js-browser-10k-v1.smi \
            --engine "$BROWSER" "${browser_arg[@]}" --rows 10000 --repetitions 10 \
            --output "/tmp/parse-morgan-${BROWSER}.json"
          python3 scripts/check_parse_morgan_rdkit_speed_gate.py \
            --input "/tmp/parse-morgan-${BROWSER}.json" --min-lower-speedup 1.0

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: parse-morgan-rdkitjs-${{ matrix.browser }}
          path: /tmp/parse-morgan-${{ matrix.browser }}.json
