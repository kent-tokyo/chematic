name: MMFF relevant cage angle development
on:
  pull_request:
    types: [opened, reopened]
    paths:
      - '.github/workflows/mmff-cage-angle-development.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Check cage angles and existing force-field tests
        run: |
          cargo test --locked -p chematic-ff --test mmff94_relevant_cage_angles
          cargo test --locked -p chematic-ff --lib
      - name: Build source candidate
        run: |
          python -m pip install 'maturin==1.13.3' 'rdkit==2026.9.2' 'numpy<3'
          git rev-parse HEAD > mmff-cage-source-commit.txt
          maturin build --locked --release -m crates/chematic-py/Cargo.toml --interpreter python --out dist/cage
          python -m pip install --force-reinstall --no-deps dist/cage/*.whl
      - name: Compare both exposed cages on shared coordinates
        run: python scripts/validation/mmff_cage_angle_diagnostic.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: mmff-cage-angle-development-${{ github.sha }}
          path: |
            mmff-cage-source-commit.txt
            mmff-cage-angle-diagnostic.json
          if-no-files-found: warn
