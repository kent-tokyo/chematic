name: Benchmarks

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'   # weekly, Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Rust: Criterion benchmarks ─────────────────────────────────────────────
  rust-bench:
    name: Rust (Criterion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Run Criterion benchmarks
        run: |
          cargo bench --workspace -- --output-format bencher \
            | tee bench_criterion.txt

      - name: Upload Criterion results
        uses: actions/upload-artifact@v7
        with:
          name: rust-benchmarks
          path: bench_criterion.txt
          retention-days: 90

  # ── Python: startup time + SMILES parse throughput ─────────────────────────
  python-bench:
    name: Python (startup + parse)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install chematic
        run: pip install chematic --quiet

      - name: Startup time benchmark
        run: python scripts/bench_startup.py --runs 5 --json | tee bench_startup.json

      - name: SMILES parse throughput benchmark
        run: python scripts/bench_smiles_parse.py --n 5000 --json | tee bench_parse.json

      - name: Show results
        run: |
          echo "=== startup ===" && cat bench_startup.json
          echo "=== parse ===" && cat bench_parse.json

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-benchmarks
          path: |
            bench_startup.json
            bench_parse.json
          retention-days: 90
