name: Revised complete holdout Linux time recovery

on:
  pull_request:
    types: [opened, reopened]
    paths:
      - '.github/workflows/parity-complete-linux-time.yml'

permissions:
  contents: read
  actions: read

jobs:
  time-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Verify frozen code and artifacts
        run: |
          test "$(git rev-parse HEAD:crates)" = '99a9d44e7ddbe3ba8a1d797c8bd3baa5938272c1'
          test "$(git rev-parse HEAD:scripts/benchmarks)" = '00a8c3615c849288c7d31f718a502bbd40da4fdc'
          gh run download 44927371343 --repo "$GITHUB_REPOSITORY" --name parity-candidate-ubuntu-latest-ac055be0c0262b32bfe52f7a9dd1cb3607cd1919 --dir candidate
          gh run download 44928036446 --repo "$GITHUB_REPOSITORY" --name revised-holdout-complete-1945655e68d97cc9638eb002a74be6348d542821 --dir fixed
          python -c 'import glob,hashlib,pathlib; p=glob.glob("candidate/**/*.whl",recursive=True); assert len(p)==1; assert hashlib.sha256(pathlib.Path(p[0]).read_bytes()).hexdigest()=="046fd444e4131fbc5fabc4c1d14f5c9fe64b6525f42158abc961496f741a7898"; assert hashlib.sha256(pathlib.Path("fixed/holdout-fixed.json").read_bytes()).hexdigest()=="01dda14cc25da574b9736363fb85f8c44e95a61aae136d78d7e951039ba756fc"'
          python -m pip install 'rdkit==2026.9.2' 'numpy<3'
          python -m pip install --force-reinstall --no-deps candidate/dist/candidate-wheel/*.whl
      - name: Fetch and verify reference structures
        run: |
          curl --fail --location --retry 3 --max-time 120 --output input.zip https://comp3d.univie.ac.at/fileadmin/user_upload/p_comp3d/datasets/platinum-dataset-2017-01-sdf.zip
          echo '4370821a41ac452145dc97ec20e442b6d3ea838d4f923607aec00c94e47030ee  input.zip' | sha256sum --check
          unzip -p input.zip platinum_dataset_2017_01.sdf > input.sdf
          echo '715fa18108340f31f09c68f62a9484970b49c78653cbf950dbc411e3ab1b53d8  input.sdf' | sha256sum --check
      - name: Measure equal-time candidates
        run: |
          python scripts/benchmarks/platinum_time_budget.py --sdf input.sdf --baseline fixed/holdout-fixed.json --output holdout-time.json --limit 430 --seconds 0.2 --max-candidates 20 --geometry --repair-iters 400
          python scripts/benchmarks/summarize_platinum_time_budget.py holdout-time.json --output holdout-time-summary.json
          python scripts/benchmarks/summarize_platinum_time_holdout.py holdout-time.json validation/results/platinum-complete-scaffold-split-2026-11-22.json --output holdout-time-cluster.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: revised-complete-linux-time-${{ github.sha }}
          path: holdout-time*.json
          if-no-files-found: warn
