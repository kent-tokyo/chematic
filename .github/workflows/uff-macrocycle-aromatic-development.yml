name: UFF macrocycle aromatic development
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/uff-macrocycle-aromatic-development.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Check aromaticity, SMILES and UFF regressions
        run: |
          cargo test --locked -p chematic-perception --lib
          cargo test --locked -p chematic-smiles --lib
          cargo test --locked -p chematic-ff --test uff_macrocycle_aromatic
          cargo test --locked -p chematic-ff --lib
      - name: Build source candidate
        run: |
          python -m pip install 'maturin==1.13.3' 'rdkit==2026.9.2' 'numpy<3'
          git rev-parse HEAD > uff-aromatic-source-commit.txt
          maturin build --locked --release -m crates/chematic-py/Cargo.toml --interpreter python --out dist/candidate
          sha256sum dist/candidate/*.whl > uff-aromatic-wheel.sha256
          python -m pip install --force-reinstall --no-deps dist/candidate/*.whl
      - name: Compare exposed field outliers on shared coordinates
        run: |
          python scripts/benchmarks/platinum_force_fields.py --development validation/results/cod-second-field-outliers-development-2026-11-22.json --output uff-aromatic-fields.json
          python scripts/benchmarks/summarize_platinum_force_fields.py uff-aromatic-fields.json --output uff-aromatic-fields-summary.json
          python -c 'import json; d=json.load(open("uff-aromatic-fields.json")); names={"SAWYAYVQRLIVEW-UHFFFAOYSA-P","FFDBWJMOMIIWCE-JNLZMNOBSA-N"}; rows=[x for x in d["results"] if x["name"] in names]; assert len(rows)==2; assert all("error" not in x and x["fields"]["UFF"]["energy_absolute_error"] < 1e-5 and max(x["fields"]["UFF"]["gradient_absolute_errors"]) < 1e-4 for x in rows), rows'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: uff-macrocycle-aromatic-development-${{ github.sha }}
          path: |
            uff-aromatic-source-commit.txt
            uff-aromatic-wheel.sha256
            uff-aromatic-fields*.json
          if-no-files-found: warn
