name: Publish to crates.io

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish crates to crates.io
    # Keep prerelease tags out of every registry publication path.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Verify publish graph
        run: python3 scripts/check_publish_graph.py

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -e
          CRATES=$(python3 scripts/check_publish_graph.py | awk '/Safe publish order:/{found=1; next} found {print $1}')
          echo "Publish order:"
          echo "$CRATES"
          for crate in $CRATES; do
            echo "=== Publishing $crate ==="
            # A dependent can observe a stale sparse index even after cargo
            # reports the previous crate as published. v1.0.29 hit this at
            # chematic-wasm -> chematic-mol; retry only that propagation error.
            for attempt in 1 2 3 4 5 6; do
              if OUTPUT=$(cargo publish -p "$crate" --locked 2>&1); then
                echo "$OUTPUT"
                echo "Published $crate"
                break
              elif echo "$OUTPUT" | grep -qi "already uploaded\|already exists"; then
                echo "$OUTPUT"
                echo "$crate already published at this version, skipping"
                break
              elif [[ "$OUTPUT" == *"failed to select a version for the requirement"* && "$attempt" -lt 6 ]]; then
                echo "$OUTPUT"
                echo "Sparse index not yet current for $crate (attempt $attempt/6); retrying in 30s"
                sleep 30
              else
                echo "$OUTPUT"
                echo "::error::Failed to publish $crate"
                exit 1
              fi
            done
            # Give the newly published crate a head start in the sparse index;
            # the bounded retry above handles slower-than-expected propagation.
            sleep 20
          done
