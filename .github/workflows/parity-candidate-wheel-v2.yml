name: Freeze silicon-corrected candidate wheels

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened]
    paths:
      - '.github/workflows/parity-candidate-wheel-v2.yml'
      - 'crates/chematic-ff/src/mmff94_numeric/**'

concurrency:
  # A new push to the same PR cancels the superseded run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Build and fingerprint candidate
        run: |
          python -m pip install 'maturin==1.13.3'
          git rev-parse HEAD > candidate-source-commit.txt
          uname -a > candidate-platform.txt
          maturin build --locked --release -m crates/chematic-py/Cargo.toml --interpreter python --out dist/candidate-wheel
          python -c 'import glob,hashlib,pathlib; p=glob.glob("dist/candidate-wheel/*.whl"); assert len(p)==1; f=pathlib.Path(p[0]); pathlib.Path("candidate-wheel.sha256").write_text(hashlib.sha256(f.read_bytes()).hexdigest()+"  "+f.name+"\n")'
      - name: Upload exact wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: parity-candidate-v2-${{ matrix.os }}-${{ github.sha }}
          path: |
            candidate-source-commit.txt
            candidate-platform.txt
            candidate-wheel.sha256
            dist/candidate-wheel/*.whl
          if-no-files-found: error
