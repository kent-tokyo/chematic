name: Aromatic silicon Kekule experiment

on:
  pull_request:
    paths:
      - '.github/workflows/silicon-kekule-experiment.yml'
      - 'validation/experiments/silicon-anion-kekulization.patch'
      - 'scripts/validation/mmff94_silicon_anion_regression.rs'
      - 'scripts/fixtures/mmff94-silicon-anion-2026-11-22.json'

permissions:
  contents: read

jobs:
  silicon-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Apply experimental change
        run: |
          if git apply --check validation/experiments/silicon-anion-kekulization.patch; then
            git apply validation/experiments/silicon-anion-kekulization.patch
          else
            git apply --reverse --check validation/experiments/silicon-anion-kekulization.patch
          fi
          cp scripts/validation/mmff94_silicon_anion_regression.rs crates/chematic-ff/tests/mmff94_silicon_anion_regression.rs
          cp scripts/fixtures/mmff94-silicon-anion-2026-11-22.json crates/chematic-ff/tests/mmff94_silicon_anion_fixture.json
      - name: Run core and force-field tests
        run: |
          cargo test --locked -p chematic-core --lib
          cargo test --locked -p chematic-ff --test mmff94_silicon_anion_regression -- --nocapture
