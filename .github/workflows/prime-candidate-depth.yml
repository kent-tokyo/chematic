name: Macrocycle development candidate depth

on:
  pull_request:
    types: [opened, reopened]
    paths:
      - '.github/workflows/prime-candidate-depth.yml'

permissions:
  contents: read
  actions: read

jobs:
  candidate-depth:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Verify frozen candidate wheel
        run: |
          test "$(git rev-parse HEAD:crates)" = '99a9d44e7ddbe3ba8a1d797c8bd3baa5938272c1'
          test "$(git rev-parse HEAD:scripts/benchmarks)" = '00a8c3615c849288c7d31f718a502bbd40da4fdc'
          gh run download 44927371343 --repo "$GITHUB_REPOSITORY" --name parity-candidate-ubuntu-latest-ac055be0c0262b32bfe52f7a9dd1cb3607cd1919 --dir candidate
          python -c 'import glob,hashlib,pathlib; p=glob.glob("candidate/**/*.whl",recursive=True); assert len(p)==1; assert hashlib.sha256(pathlib.Path(p[0]).read_bytes()).hexdigest()=="046fd444e4131fbc5fabc4c1d14f5c9fe64b6525f42158abc961496f741a7898"'
          python -m pip install 'rdkit==2026.9.2' 'numpy<3'
          python -m pip install --force-reinstall --no-deps candidate/dist/candidate-wheel/*.whl
      - name: Fetch and verify development reference
        run: |
          curl --fail --location --retry 3 --max-time 120 --output input.tar.gz https://zenodo.org/records/8137603/files/benchmarking_datasets_and_code.tar.gz
          echo '30a5218e80e442a7e5f9129433d307b7b11dd569930d33244fd9fbd26fbf173b  input.tar.gz' | sha256sum --check
          tar -xOf input.tar.gz benchmarking_datasets_and_code/datasets/prime_dataset.sdf > input.sdf
          echo '28fc27d7bd33c7df5ab4ff63acb320cd5216ae91262d1288cd1fe18a045adbdb  input.sdf' | sha256sum --check
      - name: Evaluate 100-candidate development ensembles
        run: |
          python scripts/benchmarks/platinum_development_probe.py --sdf input.sdf --split validation/results/prime-scaffold-split-2026-11-22.json --output prime-development-100.json --limit 31 --count 100 --seed 42 --profile corrected --geometry --repair-iters 400
          python scripts/benchmarks/summarize_platinum_probe.py prime-development-100.json --output prime-development-100-summary.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: prime-development-100-${{ github.sha }}
          path: prime-development-100*.json
          if-no-files-found: warn
