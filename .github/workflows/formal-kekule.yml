name: Formal Kekulé pilot

# Experimental, non-required check: Lean 4 specification vs. Rust kekulize.
# See formal/kekule/README.md.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - crates/chematic-core/src/kekulization.rs
      - formal/kekule/**
      - .github/workflows/formal-kekule.yml

permissions:
  contents: read

env:
  LEAN_VERSION: "4.29.1"
  LEAN_SHA256: bf062d29556d655685fb287563c249ad6a8fde34352c18b5e32568a595c1aec1

jobs:
  kekule:
    name: Lean spec + differential test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install Lean (pinned release, checksum verified)
        run: |
          archive="lean-${LEAN_VERSION}-linux.tar.zst"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/leanprover/lean4/releases/download/v${LEAN_VERSION}/${archive}"
          echo "${LEAN_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar --zstd -xf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-${LEAN_VERSION}-linux/bin" >> "$GITHUB_PATH"
      - name: Build Lean proofs and run the differential test
        run: formal/kekule/run.sh
