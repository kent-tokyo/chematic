name: Deploy chematic demo + docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'crates/chematic-wasm/**'
      - 'demo/**'
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:


permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-wasm-

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked

      - name: Install binaryen (wasm-opt)
        run: |
          wget -q https://github.com/WebAssembly/binaryen/releases/download/version_119/binaryen-version_119-x86_64-linux.tar.gz
          tar xzf binaryen-version_119-x86_64-linux.tar.gz
          echo "$PWD/binaryen-version_119/bin" >> "$GITHUB_PATH"

      - name: Build WASM (--target web)
        working-directory: crates/chematic-wasm
        run: wasm-pack build --target web --release -d ../../demo/pkg/

      - name: Optimize WASM with wasm-opt
        run: wasm-opt -O3 -o demo/pkg/chematic_wasm_bg.wasm demo/pkg/chematic_wasm_bg.wasm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install MkDocs dependencies
        run: pip install mkdocs-material mkdocstrings[python]

      - name: Build MkDocs site
        run: mkdocs build --site-dir _site

      - name: Merge demo into docs site
        run: |
          cp -r demo/ _site/playground/
          cp -r demo/explorer/ _site/explorer/
          cp -r demo/pkg/ _site/pkg/

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
