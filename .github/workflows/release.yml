name: Release

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Extract release notes
        run: |
          OLD=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null | sed 's/^v//' || echo '0.0.0')
          python3 scripts/make_release_notes.py --old "$OLD" --notes-file /tmp/release_notes.md

      - name: Generate machine-readable release metadata
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          COMMIT="$(git rev-list -1 "$GITHUB_REF_NAME")"
          RELEASED_AT="$(git show -s --format=%cI "$GITHUB_REF_NAME")"
          python3 scripts/generate_release_metadata.py \
            --version "$VERSION" \
            --commit "$COMMIT" \
            --released-at "$RELEASED_AT" \
            --output "/tmp/chematic-release-metadata-${VERSION}.json"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file /tmp/release_notes.md \
            --verify-tag \
            "/tmp/chematic-release-metadata-${GITHUB_REF_NAME#v}.json"
