name: Macrocycle development comparison

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened]
    paths:
      - '.github/workflows/prime-development.yml'
      - 'crates/chematic-ff/src/mmff94_numeric/**'
      - 'scripts/benchmarks/platinum_development_probe.py'
      - 'validation/results/prime-scaffold-split-2026-11-22.json'

concurrency:
  # A new push to the same PR cancels the superseded run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  macrocycle-development:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install tools
        run: python -m pip install 'maturin==1.13.3' 'rdkit==2026.9.2' 'numpy<3'
      - name: Build and identify source wheel
        run: |
          git rev-parse HEAD > prime-source-commit.txt
          maturin build --locked --release -m crates/chematic-py/Cargo.toml --interpreter python --out dist/prime-wheel
          python -m pip install --force-reinstall --no-deps dist/prime-wheel/chematic-*.whl
          sha256sum dist/prime-wheel/chematic-*.whl > prime-wheel.sha256
      - name: Fetch published reference data
        run: |
          curl --fail --location --retry 3 --max-time 120 --output prime.tar.gz https://zenodo.org/records/8137603/files/benchmarking_datasets_and_code.tar.gz
          echo '30a5218e80e442a7e5f9129433d307b7b11dd569930d33244fd9fbd26fbf173b  prime.tar.gz' | sha256sum --check
          tar -xOf prime.tar.gz benchmarking_datasets_and_code/datasets/prime_dataset.sdf > prime.sdf
          echo '28fc27d7bd33c7df5ab4ff63acb320cd5216ae91262d1288cd1fe18a045adbdb  prime.sdf' | sha256sum --check
      - name: Measure development molecules
        run: |
          python scripts/benchmarks/platinum_development_probe.py --sdf prime.sdf --split validation/results/prime-scaffold-split-2026-11-22.json --output prime-development.json --limit 31 --count 20 --seed 42 --profile corrected --geometry --repair-iters 400
          python scripts/benchmarks/summarize_platinum_probe.py prime-development.json --output prime-development-summary.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macrocycle-development-${{ github.sha }}
          path: |
            prime-source-commit.txt
            prime-wheel.sha256
            prime-development*.json
          if-no-files-found: warn
