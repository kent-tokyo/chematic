name: COD second MMFF outlier typing diagnostic
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/cod-second-mmff-types-v8.yml'
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install frozen v8 wheel
        run: |
          gh run download 44971533548 --repo "$GITHUB_REPOSITORY" --name parity-candidate-v8-ubuntu-latest-98a270e4ba39c7f7db61a0e1980bfa29fd55f615 --dir candidate
          python -c 'import glob,hashlib,pathlib; h=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest(); w=glob.glob("candidate/**/*.whl",recursive=True); assert len(w)==1 and h(w[0])=="8305fd27765c4d10670fa2a0900f3b86b286d35a711f3f2eecb5c412f96613ac"; assert h("validation/results/cod-second-mmff-outliers-v8-development-2026-11-22.json")=="610015a4651f05a1687cc840823a85ed562523634faa3dd1d66bb432dbc8dc89"'
          python -m pip install 'rdkit==2026.9.2' 'numpy<3'
          python -m pip install --force-reinstall --no-deps candidate/dist/candidate-wheel/*.whl
      - name: Compare atom types and partial charges
        run: python scripts/validation/cod_second_mmff_types_diagnostic.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: cod-second-mmff-types-v8-${{ github.sha }}
          path: cod-second-mmff-types.json
          if-no-files-found: warn
