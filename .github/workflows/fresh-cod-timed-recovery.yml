name: Linux COD timed holdout recovery

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/fresh-cod-timed-recovery.yml'

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Verify fixed-count baseline and prepare timed plan
        run: |
          git show 87151e43a9c2483ec298fa7936d17cdc35a3d55b:scripts/benchmarks/platinum_development_probe.py > scripts/benchmarks/platinum_development_probe.py
          gh run download 45026013999 --repo "$GITHUB_REPOSITORY" --name fresh-plan-cod-ubuntu-latest-45026013999 --dir original
          gh run download 45055482083 --repo "$GITHUB_REPOSITORY" --name cod-recovered-fixed-linux-45055482083 --dir recovered
          echo '70276bbeb65bdb5e1de4528b148daf258a2a49e75e88e036af16fd326109e5d5  original/plan/manifest.json' | sha256sum -c
          echo '3fb325b1f18e3150f76f1bb5fb89c9c6cc05be3f2f7e4a437b97f306fbf0f7d0  recovered/fixed.json' | sha256sum -c
          python -m pip install 'rdkit==2026.9.2' 'numpy<3'
          python scripts/benchmarks/shard_platinum_time.py prepare --fixed-manifest original/plan/manifest.json --baseline recovered/fixed.json --output-dir timed-plan
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cod-linux-timed-plan-${{ github.run_id }}
          path: timed-plan/
          if-no-files-found: error

  timed:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Restore frozen inputs
        run: |
          git show 87151e43a9c2483ec298fa7936d17cdc35a3d55b:scripts/benchmarks/platinum_development_probe.py > scripts/benchmarks/platinum_development_probe.py
          bash scripts/validation/fetch_mixed_holdout_inputs.sh ubuntu-latest cod
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "cod-linux-timed-plan-$GITHUB_RUN_ID" --dir timed-plan
          python -m pip install 'rdkit==2026.9.2' 'numpy<3'
          python -m pip install --force-reinstall --no-deps "$(cat evaluation/wheel-path.txt)"
      - name: Score and seal timed shard
        run: |
          index='${{ matrix.shard }}'
          suffix=$(printf '%03d' "$index")
          count=$(python -c 'import json,sys; print(json.load(open("timed-plan/manifest.json"))["shards"][int(sys.argv[1])]["count"])' "$index")
          python scripts/benchmarks/platinum_time_mixed_strict.py --sdf evaluation/reference/reference.sdf --baseline "timed-plan/baseline-$suffix.json" --output result.json --limit "$count" --seconds 0.2 --max-candidates 20 --geometry --repair-iters 400
          python scripts/benchmarks/shard_platinum_time.py seal --manifest timed-plan/manifest.json --index "$index" --wheel "$(cat evaluation/wheel-path.txt)" --baseline "timed-plan/baseline-$suffix.json" --result result.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: cod-linux-timed-${{ matrix.shard }}-${{ github.run_id }}
          path: result.json
          if-no-files-found: warn

  merge:
    needs: timed
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Merge and summarize timed results
        run: |
          git show 87151e43a9c2483ec298fa7936d17cdc35a3d55b:scripts/benchmarks/platinum_development_probe.py > scripts/benchmarks/platinum_development_probe.py
          bash scripts/validation/fetch_mixed_holdout_inputs.sh ubuntu-latest cod
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "cod-linux-timed-plan-$GITHUB_RUN_ID" --dir timed-plan
          for i in 0 1 2 3; do gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "cod-linux-timed-$i-$GITHUB_RUN_ID" --dir "part-$i"; done
          python -m pip install 'rdkit==2026.9.2' 'numpy<3'
          python scripts/benchmarks/shard_platinum_time.py merge --manifest timed-plan/manifest.json --output timed.json part-{0,1,2,3}/result.json
          python scripts/benchmarks/summarize_platinum_time_holdout.py timed.json evaluation/reference/split.json --output timed-summary.json
          python scripts/benchmarks/summarize_platinum_stereo_strict.py timed.json --output timed-stereo.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cod-linux-timed-merged-${{ github.run_id }}
          path: |
            timed.json
            timed-summary.json
            timed-stereo.json
          if-no-files-found: error
