name: MMFF fused anion ring regression

on:
  pull_request:
    paths:
      - 'crates/chematic-ff/tests/mmff94_fused_anion_ring_order.rs'
      - 'crates/chematic-ff/src/mmff94_numeric/**'
      - 'crates/chematic-perception/src/rdkit_sssr_order.rs'
      - '.github/workflows/mmff-ring-diagnostic.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-integration-2-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-integration-2-
      - run: cargo test --locked -p chematic-ff --test mmff94_fused_anion_ring_order -- --nocapture
