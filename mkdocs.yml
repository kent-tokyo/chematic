site_name: chematic
site_description: A compact Rust and WebAssembly chemistry engine for interactive tools, local analysis, and serverless applications — plus native Rust and Python bindings.
site_url: https://kent-tokyo.github.io/chematic/
repo_url: https://github.com/kent-tokyo/chematic
repo_name: kent-tokyo/chematic

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.highlight
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [crates/chematic-py/python]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_category_heading: true
            merge_init_into_class: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list

extra_css:
  - stylesheets/homepage.css

nav:
  - Home: index.md
  - Local Compound Explorer: https://kent-tokyo.github.io/chematic/explorer/
  - Getting Started:
    - Installation: getting_started/installation.md
    - Quick Start: getting_started/quickstart.md
  - Use Cases:
    - Python Notebook: use-cases/python-notebook.md
    - Batch Analysis: use-cases/batch-analysis.md
    - Browser App (WASM): use-cases/browser-app.md
    - AI-Assisted Molecular Analysis (MCP): use-cases/ai-drug-discovery.md
    - Rust Server: use-cases/rust-server.md
  - Cookbook (EN): cookbook.md
  - Cookbook (日本語): cookbook_ja.md
  - Benchmark: benchmark.md
  - Formats & Bindings:
    - Format Capability Matrix: format-capabilities.md
    - Language Bindings Cross-Reference: language-bindings.md
    - Error Handling & Limits: error-and-limits.md
  - Reliability:
    - Validation vs RDKit: validation.md
    - Detailed RDKit Comparison: rdkit-comparison.md
    - RDKit Issue Lessons: rdkit_issue_lessons.md
  - RDKit Migration Guide: rdkit_cheatsheet.md
  - RDKit Feature Support Matrix: rdkit-migration.md
  - API Reference:
    - chematic: api/chematic.md
  - Changelog: changelog.md
