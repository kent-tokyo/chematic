site_name: chematic
site_description: Pure-Rust cheminformatics for local browser, Python, Rust, and Node workflows, with typed limits and explicit unsupported chemistry.
site_url: https://kent-tokyo.github.io/chematic/
repo_url: https://github.com/kent-tokyo/chematic
repo_name: kent-tokyo/chematic

# Historical audit records stay in Git but are intentionally omitted from the
# current documentation site and its search index.
exclude_docs: |
  archive/

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.highlight
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [crates/chematic-py/python]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_category_heading: true
            merge_init_into_class: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list

extra_css:
  - stylesheets/homepage.css

# Keep the primary navigation task-oriented. Narrow reference pages remain
# searchable and are linked from the overview pages instead of appearing here.
nav:
  - Home: index.md
  - When to choose chematic: reference/choosing-chematic.md
  - Local Compound Explorer: https://kent-tokyo.github.io/chematic/explorer/
  - Getting Started:
    - Installation: getting_started/installation.md
    - Quick Start: getting_started/quickstart.md
  - Use Cases:
    - Python Notebook: use-cases/python-notebook.md
    - Batch Analysis: use-cases/batch-analysis.md
    - Browser App: use-cases/browser-app.md
    - Rust Server: use-cases/rust-server.md
    - MCP / Agents: use-cases/ai-drug-discovery.md
  - Guides:
    - Researchers: reference/researchers.md
    - Cookbook (EN): reference/cookbook.md
    - Cookbook (日本語): reference/cookbook_ja.md
    - RDKit Migration: reference/rdkit_cheatsheet.md
    - RDKit Support Matrix: reference/rdkit-migration.md
  - Formats & Bindings:
    - Format Capability Matrix: reference/format-capabilities.md
    - Molden Geometry & Vibrations: reference/molden-vibrations.md
    - Language Bindings: reference/language-bindings.md
    - Reaction CXSMILES Atom Groups: reference/reaction-cxsmiles.md
    - Compatibility Scope: reference/compatibility-scope.md
    - Errors & Limits: reference/error-and-limits.md
    - MCP Protocol: reference/mcp-protocol-reference.md
  - Evidence:
    - Validation Report: reference/validation.md
    - Benchmark Method: reference/benchmark.md
    - RDKit Comparison: reference/rdkit-comparison.md
    - mmCIF Numeric Preservation: reference/mmcif-numeric-preservation.md
    - Open Babel File I/O: reference/openbabel-file-io.md
    - V3000 Atom Scalar Integrity: reference/v3000-atom-scalar-integrity.md
    - V2000 Isotope Output: reference/v2000-isotope-output.md
    - V2000 Property Precedence: reference/v2000-property-precedence.md
    - CML Lexical Meaning: reference/cml-lexical-meaning.md
  - API Reference:
    - Python: api/chematic.md
  - Project:
    - Roadmap: https://github.com/kent-tokyo/chematic/blob/main/ROADMAP.md
    - Open Work: reference/roadmap-open-work.md
    - Refactoring Guardrails: plans/refactoring-plan.md
    - Contributor Corpus Policy: reference/contributor-corpus-policy.md
    - Product Naming: reference/product-naming.md
    - Changelog: reference/changelog.md
