site_name: chematic
site_description: Pure-Rust cheminformatics for Python — SMILES, fingerprints, 70+ descriptors, pKa, ADMET
site_url: https://kent-tokyo.github.io/chematic/
repo_url: https://github.com/kent-tokyo/chematic
repo_name: kent-tokyo/chematic

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.highlight
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [crates/chematic-py/python]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_category_heading: true
            merge_init_into_class: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - attr_list

nav:
  - Home: index.md
  - Benchmark: benchmark.md
  - Getting Started:
    - Installation: getting_started/installation.md
    - Quick Start: getting_started/quickstart.md
  - Cookbook (EN): cookbook.md
  - Cookbook (日本語): cookbook_ja.md
  - RDKit Migration Guide: rdkit_cheatsheet.md
  - API Reference:
    - chematic: api/chematic.md
  - Changelog: changelog.md
