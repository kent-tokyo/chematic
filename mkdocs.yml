site_name: chematic
site_description: A compact Rust and WebAssembly chemistry engine for interactive tools, local analysis, and serverless applications — plus native Rust and Python bindings.
site_url: https://kent-tokyo.github.io/chematic/
repo_url: https://github.com/kent-tokyo/chematic
repo_name: kent-tokyo/chematic

# Historical audit records stay in Git but are intentionally omitted from the
# current documentation site and its search index.
exclude_docs: |
  archive/

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.highlight
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [crates/chematic-py/python]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_category_heading: true
            merge_init_into_class: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list

extra_css:
  - stylesheets/homepage.css

nav:
  - Home: index.md
  - Local Compound Explorer: https://kent-tokyo.github.io/chematic/explorer/
  - Getting Started:
    - Installation: getting_started/installation.md
    - Quick Start: getting_started/quickstart.md
  - For Researchers: researchers.md
  - Use Cases:
    - Python Notebook: use-cases/python-notebook.md
    - Batch Analysis: use-cases/batch-analysis.md
    - Browser App (WASM): use-cases/browser-app.md
    - AI-Assisted Molecular Analysis (MCP): use-cases/ai-drug-discovery.md
    - Rust Server: use-cases/rust-server.md
  - MCP Protocol Reference: mcp-protocol-reference.md
  - Cookbook (EN): cookbook.md
  - Cookbook (日本語): cookbook_ja.md
  - Benchmark: benchmark.md
  - Formats & Bindings:
    - CCD Molecular Templates: ccd-components.md
    - Rooted SMILES Stereo: rooted-smiles-stereo.md
    - Format Capability Matrix: format-capabilities.md
    - HIN Aromatic Bond Preservation: openbabel-hin-aromatic-bonds.md
    - ORCA-AICCM EXYZ: openbabel-exyz.md
    - FHI-aims Geometry: openbabel-fhiaims.md
    - MOPAC Cartesian: openbabel-mopac-cartesian.md
    - DMol3 Coordinates: openbabel-dmol3.md
    - PDB Atom Selection: pdb-atom-selection.md
    - Language Bindings Cross-Reference: language-bindings.md
    - Error Handling & Limits: error-and-limits.md
    - Checked 3D Distance Matrices: rdkit-checked-3d-distance-matrix.md
  - Reliability:
    - ChemDoodle JSON: chemdoodle-json.md
    - Fingerprint Target Density: fingerprint-target-density.md
    - Bounded Native Distance Matrices: native-distance-matrix-limits.md
    - Validation vs RDKit: validation.md
    - Compatibility Scope: compatibility-scope.md
    - Detailed RDKit Comparison: rdkit-comparison.md
    - RDKit Graph Queries: rdkit-graph-queries.md
    - RDKit Atom Environments: rdkit-atom-environment.md
    - RDKit Path Enumeration: rdkit-path-enumeration.md
    - RDKit Accuracy Plan: rdkit-accuracy-plan.md
    - Canonical E/Z Plan: canonical-ez-plan.md
    - RDKit Issue Lessons: rdkit_issue_lessons.md
  - RDKit Migration Guide: rdkit_cheatsheet.md
  - RDKit Feature Support Matrix: rdkit-migration.md
  - API Reference:
    - chematic: api/chematic.md
  - Project:
    - Roadmap: https://github.com/kent-tokyo/chematic/blob/main/ROADMAP.md
    - Open Work: roadmap-open-work.md
    - Refactoring Guardrails: refactoring-plan.md
  - Changelog: changelog.md
