coverage:
  precision: 2
  round: down
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        # New and changed lines must be covered; see the 99% coverage plan.
        target: 99%
        threshold: 0%
        informational: false

flags:
  rust-unit:
    paths:
      - crates/
    carryforward: false

# Keep coverage visible as checks and badges without adding PR comments.
comment: false
