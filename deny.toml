[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Informational unmaintained advisory with no patched chrono release.
# chrono is transitive through harumi -> lopdf in the PDF depiction path.
# Keep the dependency visible here until that chain can be replaced.
ignore = ["RUSTSEC-2026-0543"]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
deny = []

[sources]
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
