[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # ttf-parser: unmaintained, pulled in transitively via chematic-depict ->
    # svg2pdf -> fontdb/usvg. No safe upgrade available (advisory's own
    # recommendation is to migrate to `skrifa`, which is an upstream change
    # in fontdb/usvg/svg2pdf, not something chematic controls directly).
    "RUSTSEC-2026-0192",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
deny = []

[sources]
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
